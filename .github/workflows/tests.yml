name: Pruebas de base de datos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Iniciar base local (aplica las migraciones)
        run: supabase db start

      - name: Correr pruebas (pgTAP)
        run: supabase test db

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El hook local `pre-push` ya corre typecheck, pero se puede saltar con
      # --no-verify y no existe en un clon donde nadie configuró core.hooksPath.
      # Acá no se salta: es el único freno que no depende de la máquina de quien
      # empuja.
      - name: Verificar tipos
        run: pnpm typecheck

      - name: Correr pruebas de interfaz (Vitest)
        run: pnpm test
