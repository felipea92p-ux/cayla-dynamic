<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipo — prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<!--
  Prototipo de «Equipo» (/admin/equipo), 2026-10-19. Tres formas de leer la misma pantalla.

  NO es código de la app y no toca ninguna base. Datos ficticios (nombres, correos y montos inventados).
  «Hoy» es el lunes 19 de octubre de 2026.

  Lo que NO cambia en ninguna variante (reglas de CLAUDE.md y de permisos.ts):
    · el salario, el vínculo, las fechas de contrato y toda escritura son de DO y dirección
      (puedeVerPlanilla / puedeAdministrarEquipo); la líder de equipo consulta y abre la ficha;
    · la líder solo ve su sede (RLS personas_select_supervisor): para ella no hay filtro de sede;
    · Dynamic avisa, nunca sanciona: ningún aviso de esta pantalla bloquea ni decide por nadie;
    · registrar una salida pide último día Y motivo, sin motivo por defecto (de ahí salen
      gratificación, CTS y vacaciones truncas); reactivar avisa que se cerraron sus tramos;
    · el rol (qué pantallas abre) y el cargo (cómo se la nombra) siguen siendo dos campos distintos;
    · el escalafón: un líder DO no puede dar un rol igual o superior al suyo (fn_set_rol).
  Colores: tokens de globals.css, claro y oscuro. Ningún estado va solo en color: lleva ícono y palabra.
-->
<style>
  :root{
    --color-crema:#f5f0e8; --color-papel:#fbf8f2; --color-tinta:#1a1a18;
    --color-rojo:#b8412d; --color-rojo-profundo:#8b2a1f; --color-sand:#e8e0d0; --color-taupe:#805c4c;
    --color-hueso:#eae1d2; --color-pizarra:#4c5d6e; --color-verde:#48603f;
    --color-ambar:#74501a; --color-azul:#2f5f9e; --color-ceniza:#635f58;
    --font-sans:'DM Sans', ui-sans-serif, system-ui, sans-serif;
    --font-serif:'EB Garamond', ui-serif, Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
      --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
      --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
      --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
    --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
    --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
    --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; max-width:100%; }
  body{ background:var(--color-crema); color:var(--color-tinta); font-family:var(--font-sans); font-size:14.5px; line-height:1.5; }
  h1,h2,h3,h4{ font-family:var(--font-serif); font-weight:600; margin:0; text-wrap:balance; }
  p{ margin:0; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--color-rojo); outline-offset:2px; }
  .oculto{ display:none !important; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  svg.i{ width:1em; height:1em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.12em; }

  /* ── barra del prototipo (no es parte de la pantalla) ── */
  .proto{ position:sticky; top:0; z-index:50; background:var(--color-papel); border-bottom:1px solid var(--color-sand); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .proto .vars{ display:flex; flex-wrap:wrap; gap:6px; }
  .vbtn{ border:1px solid var(--color-sand); background:var(--color-crema); border-radius:10px; padding:6px 11px; font-weight:600; font-size:.82rem; display:inline-flex; gap:7px; align-items:center; }
  .vbtn b{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--color-hueso); color:var(--color-taupe); font-size:.76rem; }
  .vbtn[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); border-color:var(--color-tinta); }
  .vbtn[aria-pressed="true"] b{ background:var(--color-crema); color:var(--color-tinta); }
  .vbtn small{ font-weight:500; opacity:.8; }
  .ctlbox{ display:contents; }
  .ctlbox > summary{ display:none; }
  .proto .ctl{ display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-left:auto; font-size:.78rem; color:var(--color-taupe); }
  .proto label{ display:inline-flex; gap:6px; align-items:center; }
  .proto select{ background:var(--color-hueso); border:1px solid var(--color-sand); border-radius:8px; padding:4px 8px; max-width:100%; }
  .demo-badge{ font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 14%, var(--color-papel)); border:1px solid color-mix(in oklab, var(--color-pizarra) 30%, transparent); border-radius:999px; padding:3px 10px; }
  .lema{ padding:10px 16px 0; max-width:1240px; margin-inline:auto; color:var(--color-taupe); font-size:.84rem; }
  .lema strong{ color:var(--color-tinta); }

  /* ── la pantalla ── */
  .page{ max-width:1240px; margin-inline:auto; padding:18px 16px 80px; display:flex; flex-direction:column; gap:14px; }
  .cab{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 18px; align-items:flex-start; }
  .cab .sobre{ display:flex; align-items:center; gap:14px; font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--color-taupe); margin-bottom:6px; }
  .cab .sobre::before{ content:""; width:36px; height:1px; background:var(--color-taupe); flex:none; }
  .cab h1{ font-size:1.75rem; font-weight:500; line-height:1.15; letter-spacing:-.01em; }
  .cab .desc{ color:var(--color-taupe); margin-top:4px; font-size:.9rem; max-width:44rem; }
  .ayb{ margin:-6px 0 -6px 2px; width:32px; height:32px; flex:none; border:0; background:none; border-radius:999px; color:var(--color-taupe); display:inline-grid; place-items:center; font-size:1.25rem; vertical-align:middle; }
  .ayb:hover{ background:color-mix(in oklab, var(--color-sand) 60%, transparent); color:var(--color-tinta); }
  .acciones{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btn{ border:1px solid var(--color-tinta); background:var(--color-tinta); color:var(--color-crema); border-radius:8px; padding:7px 13px; font-weight:600; font-size:.84rem; min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn.sec{ background:transparent; color:var(--color-tinta); border-color:var(--color-taupe); }
  .btn.sutil{ background:transparent; border-color:transparent; color:var(--color-taupe); }
  .btn.peligro{ background:transparent; color:var(--color-rojo-profundo); border-color:color-mix(in oklab, var(--color-rojo) 50%, var(--color-sand)); }
  .btn.fino{ min-height:30px; padding:4px 10px; font-size:.78rem; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .bi{ width:32px; height:32px; border-radius:8px; border:1px solid var(--color-sand); background:var(--color-papel); color:var(--color-taupe); display:inline-grid; place-items:center; flex:none; }
  .bi:hover{ border-color:var(--color-taupe); color:var(--color-tinta); }
  .ins{ display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:600; padding:2px 8px; border-radius:100px; white-space:nowrap; }
  .ins.adv{ color:var(--color-ambar); background:color-mix(in oklab, var(--color-ambar) 15%, var(--color-papel)); }
  .ins.alerta{ color:var(--color-rojo-profundo); background:color-mix(in oklab, var(--color-rojo) 10%, var(--color-papel)); }
  .ins.neutro{ color:var(--color-ceniza); background:color-mix(in oklab, var(--color-ceniza) 12%, var(--color-papel)); }
  .ins.ok{ color:var(--color-verde); background:color-mix(in oklab, var(--color-verde) 15%, var(--color-papel)); }
  .ins.info{ color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 15%, var(--color-papel)); }
  .muted{ color:var(--color-taupe); }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.ok{ background:var(--color-verde); } .dot.falta{ background:var(--color-rojo); } .dot.warn{ background:var(--color-ambar); } .dot.neutro{ background:var(--color-ceniza); } .dot.info{ background:var(--color-pizarra); }

  /* Para atender */
  .atender{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .atender .rot{ font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--color-taupe); }
  .atender .nada{ font-size:.86rem; color:var(--color-verde); display:inline-flex; gap:6px; align-items:center; }
  .pa{ display:inline-flex; align-items:center; gap:6px; border-radius:999px; border:1px solid; padding:5px 12px; font-size:.78rem; font-weight:600; font-variant-numeric:tabular-nums; background:var(--color-papel); }
  .pa.rojo{ border-color:color-mix(in oklab, var(--color-rojo) 30%, transparent); background:color-mix(in oklab, var(--color-rojo) 10%, var(--color-papel)); color:var(--color-rojo-profundo); }
  .pa.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 15%, var(--color-papel)); color:var(--color-ambar); }
  .pa.pizarra{ border-color:color-mix(in oklab, var(--color-pizarra) 40%, transparent); background:color-mix(in oklab, var(--color-pizarra) 12%, var(--color-papel)); color:var(--color-pizarra); }
  .pa[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--color-tinta); }

  /* buscador, Filtros y chips */
  .barra{ display:flex; gap:8px; align-items:center; position:relative; flex-wrap:wrap; }
  .busca{ flex:1 1 220px; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--color-hueso); border:1px solid var(--color-taupe); border-radius:8px; padding:0 10px; min-height:38px; color:var(--color-taupe); }
  .busca input{ flex:1; min-width:0; border:0; background:none; outline:0; padding:8px 0; color:var(--color-tinta); }
  .busca:focus-within{ outline:2px solid var(--color-rojo); outline-offset:2px; }
  .btn-filtros b{ background:var(--color-tinta); color:var(--color-crema); border-radius:100px; min-width:18px; height:18px; display:inline-grid; place-items:center; font-size:.7rem; padding:0 5px; }
  .pop{ position:absolute; top:44px; left:0; z-index:20; width:min(320px,100%); background:var(--color-papel); border:1px solid var(--color-sand); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.18); padding:14px; display:flex; flex-direction:column; gap:12px; }
  .pop label.f{ display:flex; flex-direction:column; gap:4px; font-size:.8rem; color:var(--color-taupe); }
  .pop select, .fld select, .fld input, .fld textarea{ background:var(--color-papel); border:1px solid var(--color-taupe); border-radius:8px; padding:8px 10px; min-height:38px; color:var(--color-tinta); width:100%; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ border:1px solid var(--color-sand); background:var(--color-papel); border-radius:8px; padding:6px 12px; font-size:.84rem; color:var(--color-tinta); min-height:34px; }
  .chip b{ margin-left:6px; font-weight:600; color:var(--color-taupe); font-variant-numeric:tabular-nums; }
  .chip[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); border-color:var(--color-tinta); }
  .chip[aria-pressed="true"] b{ color:var(--color-crema); }
  .conteo{ margin-left:auto; font-size:.78rem; color:var(--color-taupe); font-variant-numeric:tabular-nums; }

  /* avisos, estados vacíos */
  .aviso{ border-radius:12px; border:1px solid; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .aviso.rojo{ border-color:color-mix(in oklab, var(--color-rojo) 30%, transparent); background:color-mix(in oklab, var(--color-rojo) 6%, var(--color-papel)); }
  .aviso.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 7%, var(--color-papel)); }
  .aviso .tit{ font-weight:700; display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .aviso.rojo .tit{ color:var(--color-rojo-profundo); } .aviso.ambar .tit{ color:var(--color-ambar); }
  .aviso .acc{ display:flex; flex-wrap:wrap; gap:6px; }
  .enlinea{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; border-radius:8px; border:1px solid color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 8%, var(--color-papel)); padding:7px 11px; font-size:.84rem; color:var(--color-ambar); }
  .vacio{ border:1px dashed var(--color-taupe); border-radius:16px; padding:36px 20px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; background:var(--color-papel); }
  .vacio h3{ font-size:1.2rem; } .vacio p{ color:var(--color-taupe); max-width:34rem; }
  .esq{ border:1px solid var(--color-sand); border-radius:14px; background:var(--color-papel); }
  .esq i{ display:block; height:48px; border-top:1px solid var(--color-sand); position:relative; overflow:hidden; }
  .esq i:first-child{ border-top:0; }
  .esq i::after{ content:""; position:absolute; left:16px; top:16px; height:14px; width:30%; border-radius:6px; background:var(--color-sand); }

  /* avatar */
  .av{ width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:var(--font-serif); font-size:1.1rem; font-weight:600; color:var(--color-rojo-profundo); background:color-mix(in oklab, var(--color-rojo) 12%, var(--color-papel)); }
  .av.inac{ color:var(--color-ceniza); background:color-mix(in oklab, var(--color-ceniza) 14%, var(--color-papel)); }
  .av.g{ width:48px; height:48px; font-size:1.5rem; }

  /* A · tabla */
  .tabla-wrap{ border:1px solid var(--color-sand); border-radius:14px; background:var(--color-papel); overflow:hidden; }
  table.tb{ width:100%; border-collapse:collapse; }
  .tb th{ text-align:left; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--color-taupe); background:var(--color-hueso); padding:9px 14px; }
  .tb td{ border-top:1px solid var(--color-sand); padding:9px 14px; vertical-align:middle; }
  .tb tbody tr{ cursor:pointer; }
  .tb tbody tr:hover{ background:color-mix(in oklab, var(--color-hueso) 60%, var(--color-papel)); }
  .tb .quien{ display:flex; align-items:center; gap:11px; min-width:0; }
  .tb .quien .nm{ min-width:0; }
  .nombre{ font-weight:600; background:none; border:0; padding:0; text-align:left; }
  .nombre:hover{ text-decoration:underline; }
  .sub{ display:block; font-size:.78rem; color:var(--color-taupe); }
  .tb tr.inac .nombre{ color:var(--color-ceniza); }
  .sit{ display:flex; flex-wrap:wrap; gap:5px; }
  .num{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chev{ color:var(--color-taupe); text-align:right; width:28px; }
  .solo-cel, .solo-cel-b{ display:none; }

  /* B/C · grupos por sede */
  .grupos{ display:flex; flex-direction:column; gap:12px; }
  .grupo{ border:1px solid var(--color-sand); border-radius:14px; background:var(--color-papel); overflow:hidden; }
  .gh{ width:100%; display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--color-hueso); border:0; text-align:left; min-height:48px; }
  .gh .cod{ font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.03em; }
  .gh .nom{ color:var(--color-taupe); }
  .gh .res{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:.8rem; color:var(--color-taupe); text-align:right; }
  .gh .res b{ color:var(--color-tinta); font-variant-numeric:tabular-nums; }
  .gh .fl{ transition:transform .15s; }
  .gh[aria-expanded="false"] .fl{ transform:rotate(-90deg); }
  ul.lp{ list-style:none; margin:0; padding:0; }
  .pl{ border-top:1px solid var(--color-sand); }
  .pl > .fil{ width:100%; display:grid; gap:2px 12px; align-items:center; text-align:left; background:none; border:0; padding:10px 14px; min-height:56px; }
  .pl > .fil:hover{ background:color-mix(in oklab, var(--color-hueso) 60%, var(--color-papel)); }
  .pl .nm{ display:flex; align-items:center; gap:11px; min-width:0; }
  .pl .nm b{ font-weight:600; display:block; }
  .pl.inac .nm b{ color:var(--color-ceniza); }
  .pl .nm span.t{ min-width:0; }
  .pl .sit{ justify-content:flex-start; }
  .pa-acc{ padding:0 14px 10px 59px; }
  /* B: una línea por persona, sin columnas */
  .vB .fil{ grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"nm chev" "sit sit"; }
  .vB .fil .nm{ grid-area:nm; } .vB .fil .chev{ grid-area:chev; }
  .vB .fil .c-sit{ grid-area:sit; padding-left:45px; }
  .vB .fil .c-sit:empty{ display:none; }
  .pl .chev{ width:auto; }
  /* C: columnas en escritorio */
  .vC .fil{ grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.5fr) minmax(0,.7fr) auto; }
  .vC .cab-col{ display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.5fr) minmax(0,.7fr) auto; gap:2px 12px; padding:7px 14px; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--color-taupe); border-top:1px solid var(--color-sand); background:color-mix(in oklab, var(--color-hueso) 40%, var(--color-papel)); }
  .vC.sinsal .fil, .vC.sinsal .cab-col{ grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.6fr) auto; }

  /* cajón / hoja */
  .velo{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; }
  .cajon{ position:fixed; top:0; right:0; bottom:0; width:min(470px,100%); background:var(--color-papel); border-left:1px solid var(--color-sand); z-index:61; display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(0,0,0,.2); animation:entra .18s ease-out; }
  @keyframes entra{ from{ transform:translateX(24px); opacity:.4; } to{ transform:none; opacity:1; } }
  @keyframes sube{ from{ transform:translateY(24px); opacity:.4; } to{ transform:none; opacity:1; } }
  .cajon.quieto{ animation:none !important; }
  @media (prefers-reduced-motion: reduce){ .cajon{ animation:none !important; } }
  .cajon > header{ padding:16px 18px 12px; border-bottom:1px solid var(--color-sand); display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .cajon > header .quien{ display:flex; gap:12px; align-items:center; min-width:0; }
  .cajon > header h3{ font-size:1.35rem; line-height:1.15; }
  .cajon > header small{ color:var(--color-taupe); font-size:.84rem; display:block; margin-top:2px; }
  .cajon .cuerpo{ overflow:auto; padding:14px 18px; flex:1; display:flex; flex-direction:column; gap:16px; }
  .cajon > footer{ border-top:1px solid var(--color-sand); padding:12px 18px; display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; background:var(--color-papel); }
  .rot-b{ font-size:.78rem; font-weight:600; color:var(--color-taupe); margin-bottom:6px; }
  dl.dd{ margin:0; display:grid; }
  dl.dd > div{ display:grid; grid-template-columns:9.5rem 1fr; gap:2px 12px; padding:7px 0; border-top:1px solid var(--color-sand); font-size:.88rem; }
  dl.dd > div:first-child{ border-top:0; }
  dl.dd dt{ color:var(--color-taupe); } dl.dd dd{ margin:0; min-width:0; overflow-wrap:anywhere; }
  .acciones-d{ display:flex; flex-direction:column; gap:6px; }
  .acciones-d .btn{ justify-content:flex-start; }
  .pend-l{ display:flex; flex-direction:column; gap:6px; margin:0; padding:0; list-style:none; }
  .pend-l li{ display:flex; gap:8px; align-items:baseline; font-size:.86rem; }
  .fld{ display:flex; flex-direction:column; gap:4px; font-size:.84rem; }
  .fld > span.l{ font-weight:600; }
  .fld .ay{ color:var(--color-taupe); font-size:.78rem; font-weight:400; }
  .fld.dos{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fld.dos > label{ display:flex; flex-direction:column; gap:4px; }
  .chk{ display:flex; gap:8px; align-items:flex-start; font-size:.86rem; }
  .chk input{ margin-top:3px; accent-color:var(--color-tinta); }

  if (puedeSal() && salariosOk() && sinSalario(p)) r.push({ k: 'salario', cls: 'alerta', i: 'alerta', t: 'Sin salario' });
  if (puedeSal() && veMotivoCese() && salidaSinMotivo(p)) r.push({ k: 'salida', cls: 'adv', i: 'alerta', t: 'Salida sin motivo' });
  const n = pendientesDe(p).length;
  if (n && p.estado === 'activo') r.push({ k: 'pend', cls: 'info', i: 'info', t: `${n} pendiente${n === 1 ? '' : 's'}` });
  return r;
}
const insignia = (a) => `<span class="ins ${a.cls}">${ic(a.i)}${esc(a.t)}</span>`;
const insEstado = (p) => p.estado === 'activo' ? '' : `<span class="ins neutro">${ic('salir')}Inactivo${p.cese ? ` · salió ${fmtCorta(p.cese.f)}` : ''}</span>`;

/* ═════════ lo que se muestra ═════════ */
function visibles() {
  const q = sinTildes(S.q.trim());
  return alcance().filter((p) => {
    if (S.estado === 'activos' && p.estado !== 'activo') return false;
    if (S.estado === 'inactivos' && p.estado === 'activo') return false;
    if (S.fSede !== 'todas' && p.sede !== S.fSede) return false;
    if (S.fArea !== 'todas' && p.area !== S.fArea) return false;
    if (S.fVinc !== 'todos' && p.vinc !== S.fVinc) return false;
    if (q && !sinTildes(`${p.n} ${p.a} ${p.cargo}`).includes(q)) return false;
    if (S.pa === 'contratos' && !vencePronto(p)) return false;
    if (S.pa === 'salario' && !(salariosOk() && sinSalario(p))) return false;
    if (S.pa === 'pend' && !(p.estado === 'activo' && pendientesDe(p).length)) return false;
    if (S.pa === 'salida' && !salidaSinMotivo(p)) return false;
    return true;
  });
}
const nFiltros = () => (S.fSede !== 'todas' ? 1 : 0) + (S.fArea !== 'todas' ? 1 : 0) + (S.fVinc !== 'todos' ? 1 : 0);
function paItems() {
  const al = alcance(), r = [];
  if (puedeSal()) r.push({ k: 'contratos', t: (n) => `${n} contrato${n === 1 ? '' : 's'} por vencer`, n: al.filter(vencePronto).length, tono: 'ambar' });
  if (puedeSal() && salariosOk()) r.push({ k: 'salario', t: (n) => `${n} sin salario`, n: al.filter(sinSalario).length, tono: 'rojo' });
  if (puedeSal() && veMotivoCese()) r.push({ k: 'salida', t: (n) => `${n} salida${n === 1 ? '' : 's'} sin motivo`, n: al.filter(salidaSinMotivo).length, tono: 'ambar' });
  r.push({ k: 'pend', t: (n) => `${n} con pendientes`, n: al.filter((p) => p.estado === 'activo' && pendientesDe(p).length).length, tono: 'pizarra' });
  return r;
}

const avatar = (p, g = false) => `<span class="av ${g ? 'g' : ''} ${p.estado === 'activo' ? '' : 'inac'}" aria-hidden="true">${esc(p.n[0])}</span>`;

/* ═════════ estados de la lista ═════════ */
function estadoEspecial() {

}

      <div><h4>Funciones que conserva</h4>${L(n.conserva)}</div><div><h4>Funciones que fusiona</h4>${L(n.fusiona)}</div><div><h4>Funciones que descarta</h4>${L(n.descarta)}</div>
      <div class="ancho"><h4>Pantallas conectadas que toca</h4>${L(n.afecta)}</div>
      ${n.decision ? `<div class="ancho"><h4>Decisión</h4><div class="dec"><p><b>Decidí</b>${n.decision.dec}</p><p><b>Descarté</b>${n.decision.desc}</p><p><b>Se rompe si</b>${n.decision.rompe}</p></div></div>` : ''}
    </div></details>
    <details><summary>Inventario del código actual: qué hace hoy la pantalla</summary><div class="in"><div class="ancho tw"><table>
      <thead><tr><th>Función</th><th>Qué usa</th><th>Quién</th><th>Veredicto</th></tr></thead><tbody>${INVENTARIO.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>
      <div><h4>«N pendientes» significa</h4>${L(['Cuántos pendientes de la Bandeja (12 módulos: contratos, correcciones, disciplina, documentación, seguros, feriados, educación, ausencias, horarios, datos personales, liquidaciones, casos) apuntan a esa persona.', 'Es una alerta real pero genérica: el enlace va a la Bandeja entera, no a lo suyo, y el detalle está en un <code>title</code> que no se ve en el celular.'])}</div>
      <div><h4>«Sin salario asignado» significa</h4>${L(['Persona activa, no estación, sin tramo de salario vigente.', 'No siempre es una alerta: cuenta también a dirección, honorarios y «sin vínculo laboral», que pueden no tener tramo. Un número que nunca llega a cero se aprende a ignorar. Pruébalo con el selector «Sin salario» de arriba.', 'Sí es real cuando es un integrante de planilla con horas: la planilla se las pagaría a S/ 0.'])}</div>
      <div><h4>«Fin de contrato próximo» significa</h4>${L(['Cualquier persona activa con fecha de término anotada, sea en 3 días o en 14 meses: «próximo» no filtra por fecha. Aquí se propone ≤ 30 días.'])}</div>
    </div></details>
  </section>`;
}

/* ═════════ render ═════════ */
const app = $('#app'), capa = $('#capa');
function lemaHTML() {
  const t = {
    lider: '<strong>Líder de equipo (Carla, TRU)</strong>: ve solo su sede, sin salario, vínculo ni fechas de contrato, y no tiene botones de escritura. Consulta y abre la ficha.',
    do: '<strong>Desarrollo Organizacional (Diego)</strong>: ve todas las sedes con salario, vínculo y contrato, y administra todo. Al cambiar un rol, no puede dar uno igual o superior al suyo.',
    admin: '<strong>Dirección (Franco)</strong>: todo lo de DO, y puede dar cualquier rol. Exportar el padrón completo queda en Datos personales.',
  };
  return t[S.rol];
}
function render() {
  const enfoca = document.activeElement && document.activeElement.id === 'q';
  const pos = enfoca ? document.activeElement.selectionStart : 0;
  $('#lema').innerHTML = lemaHTML();
  const hayLista = S.datos !== 'error' && S.datos !== 'cargando' && S.datos !== 'vacio';
  const barra = hayLista ? barraHTML() : '';
  const cuerpo = ({ A: vistaA, B: vistaB, C: vistaC })[S.v]();
  const conteo = hayLista ? `<p class="conteo" role="status">${visibles().length} de ${alcance().length} personas${S.pa ? ' · filtrando por «Para atender»' : ''}</p>` : '';
  app.innerHTML = cabecera() + (hayLista ? paHTML() : '') + barra + conteo + cuerpo + notasHTML();
  const cuerpoAntes = $('#capa .cuerpo'), scrollAntes = cuerpoAntes ? cuerpoAntes.scrollTop : 0;
  const llave = S.drawer ? `${S.drawer.id}|${S.drawer.vista}` : '';
  const mismo = llave && llave === render.llave;
  render.llave = llave;
  capa.innerHTML = (S.drawer ? drawerHTML() : '') + (S.ayuda ? ayudaHTML() : '');
  if (mismo) { const c = $('#capa .cajon'); if (c) c.classList.add('quieto'); const cu = $('#capa .cuerpo'); if (cu) cu.scrollTop = scrollAntes; }
  $('#toast-capa').innerHTML = S.toast ? `<div id="toast" role="status">${esc(S.toast)}</div>` : '';
  $$('.vbtn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.v)));
  if (enfoca) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
  else if (S.drawer || S.ayuda) { const f = $('#capa .cajon .bi, #capa .modal .bi'); if (f && !capa.contains(document.activeElement)) f.focus(); }
}
let tt;
function avisar(t) { S.toast = t; clearTimeout(tt); tt = setTimeout(() => { S.toast = null; render(); }, 4500); }

/* ═════════ acciones ═════════ */
function abrir(id, vista = 'detalle') {
  const p = byId(id); if (!p) return;
  S.drawer = { id, vista };
  if (vista === 'editar') S.drawer.form = { n: p.n, a: p.a, sede: p.sede, rol: p.rol, cargo: p.cargo, area: p.area, email: `${sinTildes(p.n)}.${sinTildes(p.a)}@ejemplo.pe`, vinc: p.vinc, ing: p.ing, fin: p.fin || '', hijos: !!p.hijos, todas: !!p.todas, motivoFin: '' };
  if (vista === 'salario') S.drawer.form = { rango: p.rango || 'colibri', monto: p.sal != null ? String(p.sal) : '', desde: '2026-09-29', nota: '' };
  if (vista === 'salida') S.drawer.form = { fecha: p.fin && p.fin <= HOY ? p.fin : HOY, motivo: p.fin && p.fin <= HOY ? 'fin_contrato' : '' };
}
function vaA(vista) { const d = S.drawer; abrir(d.id, vista); render(); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-open],[data-v]');
  if (!t) { if (S.filtros && !e.target.closest('.pop')) { S.filtros = false; render(); } return; }
  const a = t.dataset.act;
  if (t.dataset.v && !a) { S.v = t.dataset.v; S.drawer = null; render(); return; }
  if (t.dataset.open && !a) { abrir(t.dataset.open); render(); return; }
  switch (a) {
    case 'ayuda': S.ayuda = true; break;
    case 'cerrar-ayuda': S.ayuda = false; break;
    case 'cerrar': S.drawer = null; break;
    case 'filtros': S.filtros = !S.filtros; break;
    case 'limpiar-f': S.fSede = 'todas'; S.fArea = 'todas'; S.fVinc = 'todos'; break;
    case 'limpiar-todo': S.q = ''; S.fSede = 'todas'; S.fArea = 'todas'; S.fVinc = 'todos'; S.pa = null; S.estado = 'activos'; break;
    case 'estado': S.estado = t.dataset.k; break;
    case 'pa': S.pa = S.pa === t.dataset.k ? null : t.dataset.k; if (S.pa === 'salida') S.estado = 'todos'; else if (S.estado === 'inactivos') S.estado = 'activos'; break;
    case 'plegar': S.plegadas[t.dataset.k] = !S.plegadas[t.dataset.k]; break;
    case 'reintentar': S.datos = 'normal'; $('#selDatos').value = 'normal'; break;
    case 'alta': S.drawer = { vista: 'alta', form: { n: '', a: '', doc: '', sede: S.rol === 'lider' ? '' : '', rol: 'integrante', area: 'calidad', email: '' }, parec: null }; break;
    case 'accion-pa': {
      const id = t.dataset.id;
      if (S.pa === 'pend') { avisar('Abriría la Bandeja filtrada por esta persona (hoy el filtro no existe).'); break; }
      abrir(id, S.pa === 'salario' ? 'salario' : S.pa === 'salida' ? 'detalle' : 'editar');
      if (S.pa === 'salida') avisar('El motivo se elige al editar la salida desde la ficha de la persona (demo).');
      break;
    }
    case 'v-detalle': S.drawer = { id: S.drawer.id, vista: 'detalle' }; break;
    case 'v-editar': vaA('editar'); return;
    case 'v-salario': vaA('salario'); return;
    case 'v-salida': vaA('salida'); return;
    case 'v-reactivar': vaA('reactivar'); return;
    case 'usar-fin': { const p = byId(S.drawer.id); S.drawer.form = { fecha: p.fin, motivo: 'fin_contrato' }; break; }
    case 'ficha': e.preventDefault(); avisar('Abriría la ficha completa de la persona (otra pantalla).'); break;
    case 'guardar-ed': {
      const p = byId(S.drawer.id), f = S.drawer.form;
      Object.assign(p, { n: f.n.trim(), a: f.a.trim(), sede: f.sede, rol: f.rol, cargo: f.cargo.trim(), area: f.area });
      if (puedeSal()) { p.vinc = f.vinc; p.ing = f.ing || p.ing; p.fin = f.fin || undefined; p.hijos = f.hijos; }
      p.todas = f.todas; S.drawer = { id: p.id, vista: 'detalle' }; avisar('Cambios guardados.'); break;
    }
    case 'guardar-sal': {
      const p = byId(S.drawer.id), f = S.drawer.form;
      p.rango = f.rango; p.sal = Number(f.monto); S.drawer = { id: p.id, vista: 'detalle' }; avisar(`Salario asignado a ${nombre(p)}.`); break;
    }
    case 'guardar-sa': {
      const p = byId(S.drawer.id), f = S.drawer.form;
      p.estado = 'inactivo'; p.cese = { f: f.fecha, m: f.motivo }; p.fin = undefined;
      S.drawer = null; avisar(`${nombre(p)} figura como inactivo(a) desde el ${fmtF(f.fecha)}. Su historial se conserva.`); break;
    }
    case 'guardar-re': {
      const p = byId(S.drawer.id); p.estado = 'activo'; p.cese = undefined; p.sal = undefined; p.rango = undefined;
      S.drawer = { id: p.id, vista: 'detalle' }; avisar(`${nombre(p)} está activo(a) otra vez. Revísale el salario y el horario: al salir se cerraron sus tramos.`); break;
    }
    case 'guardar-al': {
      const f = S.drawer.form;
      if (!t.dataset.conf) {
        const par = S.P.find((x) => sinTildes(x.n) === sinTildes(f.n.trim()));
        if (par) { S.drawer.parec = par; break; }
      }
      const id = 'n' + Date.now();
      S.P.push({ id, n: f.n.trim(), a: f.a.trim(), sede: f.sede, cargo: 'Sin cargo', area: f.area, rol: f.rol, vinc: 'planilla', estado: 'activo', ing: HOY, pend: [] });
      S.drawer = null; avisar(`${f.n.trim()} ${f.a.trim()} agregado(a).`); break;
    }
    case 'ver-parec': { const p = byId(t.dataset.id); S.drawer = null; S.q = nombre(p); S.estado = 'todos'; S.fSede = 'todas'; break; }
    default: return;
  }
  render();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); return; }
  const d = S.drawer; if (!d || !d.form) return;
  const f = d.form;
  if (t.dataset.ed) f[t.dataset.ed] = t.type === 'checkbox' ? t.checked : t.value;
  else if (t.dataset.sal) { f[t.dataset.sal] = t.value; if (t.dataset.sal === 'rango') f.monto = String(RANGOS.find((r) => r.c === t.value).b); }
  else if (t.dataset.sa) f[t.dataset.sa] = t.value;
  else if (t.dataset.al) { f[t.dataset.al] = t.value; d.parec = null; }
  else return;
  // no se vuelve a pintar mientras se escribe en un texto: se actualiza al salir del campo o al cambiar un selector
  if (t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'date') render();
  else actualizarBotones();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.f) { S[t.dataset.f] = t.value; render(); return; }
  if (S.drawer && S.drawer.form && (t.dataset.ed || t.dataset.sal || t.dataset.sa || t.dataset.al)) render();
});
function actualizarBotones() { // habilita o deshabilita los botones de guardar sin perder el foco del campo
  const d = S.drawer; if (!d) return;
  const f = d.form;
  const set = (act, off) => { const b = $(`#capa [data-act="${act}"]`); if (b) b.disabled = off; };
  if (d.vista === 'editar') set('guardar-ed', !(f.n.trim() && f.a.trim()));
  if (d.vista === 'salario') set('guardar-sal', !(Number(f.monto) > 0 && f.desde));
  if (d.vista === 'alta' && !d.parec) set('guardar-al', !f.n.trim() || !f.a.trim() || !f.sede || !/^\d{8}$/.test(f.doc.trim()));
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.ayuda) S.ayuda = false; else if (S.drawer) S.drawer = null; else if (S.filtros) S.filtros = false; else return; render(); }
});

/* barra del prototipo */
$('#selRol').addEventListener('change', (e) => { S.rol = e.target.value; S.drawer = null; S.pa = null; S.fSede = 'todas'; S.fVinc = 'todos'; render(); });
$('#selDatos').addEventListener('change', (e) => { S.datos = e.target.value; S.drawer = null; render(); });
$('#selRegla').addEventListener('change', (e) => { S.regla = e.target.value; render(); });
$('#selTema').addEventListener('change', (e) => { S.tema = e.target.value; if (S.tema === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.tema); });
$('#btnReset').addEventListener('click', () => { Object.assign(S, { P: JSON.parse(JSON.stringify(P0)), q: '', estado: 'activos', fSede: 'todas', fArea: 'todas', fVinc: 'todos', pa: null, filtros: false, plegadas: {}, drawer: null, ayuda: false, toast: null }); render(); });
$('#btnLink').addEventListener('click', () => { if (S.rol === 'lider') { S.rol = 'do'; $('#selRol').value = 'do'; } abrir('gaby'); render(); });
const ajusta = () => { $('#ctlbox').open = window.innerWidth > 720 || $('#ctlbox').open; };
window.addEventListener('resize', ajusta); ajusta();
render();
})();
</script>
