<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnos y cobertura — prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<!--
  Prototipo de «Turnos y cobertura» (2026-10-19). Cinco formas de ubicar la misma pantalla.

  NO es código de la app y no toca ninguna base. Datos ficticios. «Hoy» es el miércoles 21 de
  octubre de 2026 para que la semana tenga días que ya pasaron y días por venir.

  Lo que NO cambia en ninguna variante (reglas de CLAUDE.md y de jornada-esperada.ts):
    · el turno puntual de un día MANDA sobre el horario base, y de él salen la tardanza y la falta;
    · Dynamic avisa, nunca sanciona: los avisos de 12 h y de 48 h no bloquean el guardado;
    · la cobertura solo cuenta áreas operativas; quien está en otra área se ve en ámbar y no suma;
    · el corte de la meta es 14:15 (mañana / tarde); la meta de líderes es plana todo el día;
    · en Trujillo se trabaja domingo; la meta vale para todos los «jueves», no para una fecha;
    · una líder no fija su propio turno.
  Colores: tokens de globals.css, claro y oscuro. Ningún estado va solo en color: lleva ícono o palabra.
-->
<style>
  :root{
    --color-crema:#f5f0e8; --color-papel:#fbf8f2; --color-tinta:#1a1a18;
    --color-rojo:#b8412d; --color-rojo-profundo:#8b2a1f; --color-sand:#e8e0d0; --color-taupe:#805c4c;
    --color-hueso:#eae1d2; --color-pizarra:#4c5d6e; --color-verde:#48603f;
    --color-ambar:#74501a; --color-azul:#2f5f9e; --color-ceniza:#635f58;
    --font-sans:'DM Sans', ui-sans-serif, system-ui, sans-serif;
    --font-serif:'EB Garamond', ui-serif, Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
      --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
      --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
      --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
    --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
    --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
    --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; max-width:100%; overflow-x:hidden; }
  body{ background:var(--color-crema); color:var(--color-tinta); font-family:var(--font-sans); font-size:14.5px; line-height:1.5; }
  h1,h2,h3,h4{ font-family:var(--font-serif); font-weight:600; margin:0; text-wrap:balance; }
  p{ margin:0; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--color-rojo); outline-offset:2px; }
  .oculto{ display:none !important; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  svg.i{ width:1em; height:1em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.12em; }

  /* ── barra del prototipo (no es parte de la pantalla) ── */
  .proto{ position:sticky; top:0; z-index:50; background:var(--color-papel); border-bottom:1px solid var(--color-sand); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .proto .vars{ display:flex; flex-wrap:wrap; gap:6px; }
  .vbtn{ border:1px solid var(--color-sand); background:var(--color-crema); border-radius:10px; padding:6px 11px; font-weight:600; font-size:.82rem; display:inline-flex; gap:7px; align-items:center; }
  .vbtn b{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--color-hueso); color:var(--color-taupe); font-size:.76rem; }
  .vbtn[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); border-color:var(--color-tinta); }
  .vbtn[aria-pressed="true"] b{ background:var(--color-crema); color:var(--color-tinta); }
  .vbtn small{ font-weight:500; opacity:.8; }
  .proto .ctl{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-left:auto; font-size:.78rem; color:var(--color-taupe); }
  .proto label{ display:inline-flex; gap:6px; align-items:center; }
  .proto select{ background:var(--color-hueso); border:1px solid var(--color-sand); border-radius:8px; padding:4px 8px; }
  .demo-badge{ font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 14%, var(--color-papel)); border:1px solid color-mix(in oklab, var(--color-pizarra) 35%, transparent); padding:3px 9px; border-radius:100px; }
  .lema{ padding:10px 16px 0; max-width:1240px; margin-inline:auto; color:var(--color-taupe); font-size:.84rem; }
  .lema strong{ color:var(--color-tinta); }

  /* ── la pantalla ── */
  .page{ max-width:1240px; margin-inline:auto; padding:18px 16px 80px; display:flex; flex-direction:column; gap:14px; }
  .cab{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 18px; align-items:flex-start; }
  .cab h1{ font-size:1.75rem; font-weight:500; line-height:1.15; }
  .cab .desc{ color:var(--color-taupe); margin-top:3px; font-size:.9rem; }
  .acciones{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btn{ border:1px solid var(--color-tinta); background:var(--color-tinta); color:var(--color-crema); border-radius:8px; padding:7px 13px; font-weight:600; font-size:.84rem; min-height:36px; display:inline-flex; align-items:center; gap:6px; }
  .btn.sec{ background:transparent; color:var(--color-tinta); border-color:var(--color-taupe); }
  .btn.sutil{ background:transparent; border-color:transparent; color:var(--color-taupe); }
  .btn.peligro{ background:transparent; color:var(--color-rojo-profundo); border-color:color-mix(in oklab, var(--color-rojo) 50%, var(--color-sand)); }
  .btn.fino{ min-height:30px; padding:4px 10px; font-size:.78rem; }
  .btn.grande{ min-height:44px; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .seg{ display:inline-flex; border:1px solid var(--color-sand); border-radius:8px; overflow:hidden; background:var(--color-papel); }
  .seg button{ border:0; background:none; padding:7px 12px; font-size:.84rem; font-weight:600; color:var(--color-taupe); min-height:36px; }
  .seg button[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); }
  .seg .et{ padding:7px 10px; font-size:.82rem; color:var(--color-taupe); display:grid; place-items:center; border-inline:1px solid var(--color-sand); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .sel{ background:var(--color-papel); border:1px solid var(--color-taupe); border-radius:8px; padding:7px 10px; min-height:36px; }
  .ins{ display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:600; padding:2px 8px; border-radius:100px; white-space:nowrap; }
  .ins.aviso{ color:var(--color-ambar); background:color-mix(in oklab, var(--color-ambar) 15%, var(--color-papel)); }
  .ins.alerta{ color:var(--color-rojo-profundo); background:color-mix(in oklab, var(--color-rojo) 10%, var(--color-papel)); }
  .ins.neutro{ color:var(--color-ceniza); background:color-mix(in oklab, var(--color-ceniza) 12%, var(--color-papel)); }
  .ins.ok{ color:var(--color-verde); background:color-mix(in oklab, var(--color-verde) 15%, var(--color-papel)); }
  .ins.info{ color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 15%, var(--color-papel)); }
  .confirma{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; border:1px solid color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 8%, var(--color-papel)); border-radius:8px; padding:5px 10px; font-size:.78rem; color:var(--color-ambar); max-width:100%; }

  /* Para atender */
  .atender{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .atender .rot{ font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--color-taupe); }
  .atender .nada{ font-size:.86rem; color:var(--color-verde); display:inline-flex; gap:6px; align-items:center; }
  .pa{ display:inline-flex; align-items:center; gap:6px; border-radius:999px; border:1px solid; padding:5px 12px; font-size:.78rem; font-weight:600; font-variant-numeric:tabular-nums; background:var(--color-papel); }
  .pa.rojo{ border-color:color-mix(in oklab, var(--color-rojo) 30%, transparent); background:color-mix(in oklab, var(--color-rojo) 10%, var(--color-papel)); color:var(--color-rojo-profundo); }
  .pa.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 15%, var(--color-papel)); color:var(--color-ambar); }
  .pa[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--color-tinta); }
  /* buscador, Filtros y chips */
  .barra{ display:flex; gap:8px; align-items:center; position:relative; flex-wrap:wrap; }
  .busca{ flex:1 1 220px; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--color-hueso); border:1px solid var(--color-taupe); border-radius:8px; padding:0 10px; min-height:38px; color:var(--color-taupe); }
  .busca input{ flex:1; min-width:0; border:0; background:none; outline:0; padding:8px 0; color:var(--color-tinta); }
  .btn-filtros b{ background:var(--color-tinta); color:var(--color-crema); border-radius:100px; min-width:18px; height:18px; display:inline-grid; place-items:center; font-size:.7rem; padding:0 5px; }
  .pop{ position:absolute; top:44px; left:0; z-index:20; width:min(320px,100%); background:var(--color-papel); border:1px solid var(--color-sand); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.18); padding:14px; display:flex; flex-direction:column; gap:12px; }
  .pop h4{ font-size:.9rem; font-family:var(--font-sans); font-weight:600; margin-bottom:6px; }
  .pop .fila{ display:flex; flex-wrap:wrap; gap:6px; }
  .pop label.chk{ display:flex; gap:8px; align-items:flex-start; font-size:.84rem; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ border:1px solid var(--color-sand); background:var(--color-papel); border-radius:8px; padding:6px 12px; font-size:.84rem; color:var(--color-tinta); min-height:34px; }
  .chip b{ margin-left:6px; font-weight:600; color:var(--color-taupe); font-variant-numeric:tabular-nums; }
  .chip[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); border-color:var(--color-tinta); }
  .chip[aria-pressed="true"] b{ color:var(--color-crema); }
  .chip.sm{ min-height:28px; padding:3px 10px; font-size:.78rem; }

  /* avisos y tarjetas */
  .aviso{ border-radius:12px; border:1px solid; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .aviso.rojo{ border-color:color-mix(in oklab, var(--color-rojo) 30%, transparent); background:color-mix(in oklab, var(--color-rojo) 6%, var(--color-papel)); }
  .aviso.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 7%, var(--color-papel)); }
  .aviso.ok{ border-color:color-mix(in oklab, var(--color-verde) 30%, transparent); background:color-mix(in oklab, var(--color-verde) 6%, var(--color-papel)); }
  .aviso.info{ border-color:color-mix(in oklab, var(--color-pizarra) 30%, transparent); background:color-mix(in oklab, var(--color-pizarra) 6%, var(--color-papel)); }
  .aviso .tit{ font-weight:700; display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .aviso.rojo .tit{ color:var(--color-rojo-profundo); } .aviso.ambar .tit{ color:var(--color-ambar); } .aviso.ok .tit{ color:var(--color-verde); } .aviso.info .tit{ color:var(--color-pizarra); }
  .aviso .txt{ color:var(--color-tinta); font-size:.88rem; }
  .aviso .acc{ display:flex; flex-wrap:wrap; gap:6px; }
  .tarj{ background:var(--color-papel); border:1px solid var(--color-sand); border-radius:16px; padding:16px; }
  .tarj > h3{ font-size:1.12rem; margin-bottom:8px; }
  .muted{ color:var(--color-taupe); }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.ok{ background:var(--color-verde); } .dot.falta{ background:var(--color-rojo); } .dot.sobra{ background:var(--color-pizarra); } .dot.warn{ background:var(--color-ambar); } .dot.neutro{ background:var(--color-ceniza); }

  /* chips de cobertura: ícono + número + palabra */
  .cobs{ display:flex; flex-direction:column; gap:3px; align-items:stretch; }
  .cob{ display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:600; border-radius:6px; padding:2px 6px; line-height:1.25; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cob.ok{ color:var(--color-verde); background:color-mix(in oklab, var(--color-verde) 13%, var(--color-papel)); }
  .cob.falta{ color:var(--color-rojo-profundo); background:color-mix(in oklab, var(--color-rojo) 12%, var(--color-papel)); box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--color-rojo) 40%, transparent); }
  .cob.sobra{ color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 13%, var(--color-papel)); }
  .cob.neutro{ color:var(--color-ceniza); background:color-mix(in oklab, var(--color-ceniza) 11%, var(--color-papel)); }
  .cob.pasado{ opacity:.6; }
  .cob .g{ font-weight:800; }

  /* cuadrícula */
  .grid-wrap{ overflow-x:auto; border:1px solid var(--color-sand); border-radius:14px; background:var(--color-papel); max-width:100%; }
  table.gr{ border-collapse:separate; border-spacing:0; width:100%; min-width:1010px; }
  .gr td:not(.quien):not(.hrs){ min-width:112px; }
  .gr th, .gr td{ border-top:1px solid var(--color-sand); padding:6px 5px; vertical-align:top; background:var(--color-papel); }
  .gr thead th{ border-top:0; background:var(--color-hueso); text-align:left; font-weight:500; padding:8px 6px 7px; }
  .gr th.quien, .gr td.quien{ position:sticky; left:0; z-index:2; min-width:158px; max-width:170px; padding-left:12px; box-shadow:1px 0 0 var(--color-sand); }
  .gr thead th.quien{ background:var(--color-hueso); z-index:3; }
  .gr td.quien b{ display:block; font-size:.88rem; font-weight:600; }
  .gr td.quien small{ display:block; color:var(--color-taupe); font-size:.72rem; margin-top:1px; }
  .gr td.quien .ins{ margin-top:3px; }
  .dh{ display:flex; align-items:baseline; gap:6px; background:none; border:0; padding:0 0 5px; font-family:var(--font-serif); font-size:1.12rem; font-weight:600; text-align:left; }
  .dh{ flex-wrap:wrap; row-gap:0; }
  .dh small{ font-family:var(--font-sans); font-size:.74rem; color:var(--color-taupe); font-weight:500; white-space:nowrap; }
  .dh em{ font-family:var(--font-sans); font-style:normal; font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--color-rojo-profundo); }
  .gr th.hoy{ box-shadow:inset 0 -3px 0 var(--color-rojo); }
  .gr th.hl, .gr td.hl{ background:color-mix(in oklab, var(--color-tinta) 6%, var(--color-papel)); }
  .gr thead th.hl{ background:color-mix(in oklab, var(--color-tinta) 10%, var(--color-hueso)); }
  .gr td.hrs{ text-align:right; padding-right:12px; font-variant-numeric:tabular-nums; color:var(--color-taupe); font-size:.8rem; white-space:nowrap; vertical-align:middle; }
  .gr tfoot td, .gr tfoot th{ background:var(--color-hueso); }
  .gr tfoot th{ text-align:left; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--color-taupe); padding-left:12px; vertical-align:middle; position:sticky; left:0; z-index:2; }
  .gr tr.dim td{ opacity:.35; }
  .gr tr.dim td.quien{ opacity:1; }

  /* la celda de un turno: hora + tramo en palabra e ícono */
  .cel{ position:relative; display:flex; flex-direction:column; gap:1px; align-items:flex-start; width:100%; min-height:44px; text-align:left; border:1px solid var(--bt, var(--color-sand)); background:var(--bg, var(--color-papel)); color:var(--color-tinta); border-radius:8px; padding:5px 8px; line-height:1.2; justify-content:center; }
  .cel .h{ font-weight:700; font-size:.8rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cel .w{ font-size:.68rem; color:var(--color-taupe); display:inline-flex; align-items:center; gap:3px; }
  .cel:hover, .cel:focus-visible{ box-shadow:0 0 0 2px var(--color-tinta); }
  .cel.m{ --bg:color-mix(in oklab, var(--color-azul) 11%, var(--color-papel)); --bt:color-mix(in oklab, var(--color-azul) 45%, var(--color-sand)); }
  .cel.t{ --bg:color-mix(in oklab, var(--color-taupe) 12%, var(--color-papel)); --bt:color-mix(in oklab, var(--color-taupe) 45%, var(--color-sand)); }
  .cel.l{ --bg:var(--color-hueso); --bt:color-mix(in oklab, var(--color-ceniza) 50%, var(--color-sand)); }
  .cel.otra{ --bg:color-mix(in oklab, var(--color-ambar) 20%, var(--color-papel)); --bt:var(--color-ambar); }
  .cel.base{ border-style:dashed; }
  .cel.turno{ box-shadow:inset 4px 0 0 var(--color-tinta); padding-left:11px; }
  .cel.turno:hover{ box-shadow:inset 4px 0 0 var(--color-tinta), 0 0 0 2px var(--color-tinta); }
  .cel.desc{ --bg:repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in oklab, var(--color-ceniza) 20%, transparent) 6px 7px); --bt:var(--color-ceniza); background:var(--bg); background-color:var(--color-papel); color:var(--color-ceniza); }
  .cel.desc .h{ font-weight:600; }
  .cel.libre{ border-color:transparent; background:transparent; color:var(--color-ceniza); }
  .cel .neq{ position:absolute; top:1px; right:5px; font-weight:800; font-size:1rem; line-height:1; color:var(--color-ambar); }
  .cel.mini{ min-height:38px; padding:3px 6px; } .cel.mini.turno{ padding-left:9px; }

  .leyenda{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.76rem; color:var(--color-taupe); background:var(--color-hueso); border-radius:12px; padding:9px 12px; align-items:center; }
  .leyenda span{ display:inline-flex; align-items:center; gap:6px; }
  .sw{ display:inline-block; width:22px; height:14px; border-radius:4px; border:1px solid var(--color-ceniza); background:var(--color-papel); flex:none; }
  .sw.tu{ box-shadow:inset 4px 0 0 var(--color-tinta); } .sw.ba{ border-style:dashed; } .sw.de{ background:repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in oklab, var(--color-ceniza) 30%, transparent) 4px 5px); }
  .sw.ot{ border-color:var(--color-ambar); background:color-mix(in oklab, var(--color-ambar) 16%, var(--color-papel)); }

  /* línea de tiempo */
  .tira{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; }
  .tira button{ border:1px solid var(--color-sand); background:var(--color-papel); border-radius:12px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; }
  .tira button .n{ font-family:var(--font-serif); font-weight:600; font-size:1.08rem; line-height:1; }
  .tira button small{ color:var(--color-taupe); font-size:.7rem; }
  .tira button .e{ font-size:.68rem; font-weight:700; display:inline-flex; gap:3px; align-items:center; }
  .tira button .e.ok{ color:var(--color-verde);} .tira button .e.falta{ color:var(--color-rojo-profundo);} .tira button .e.sobra{ color:var(--color-pizarra);} .tira button .e.neutro{ color:var(--color-ceniza);}
  .tira button[aria-pressed="true"]{ border-color:var(--color-tinta); box-shadow:inset 0 0 0 1px var(--color-tinta); }
  .tira button.hoy small::after{ content:" · hoy"; color:var(--color-rojo-profundo); font-weight:700; }
  .tl{ --nc:158px; position:relative; border:1px solid var(--color-sand); border-radius:14px; background:var(--color-papel); padding:8px 10px 6px; }
  .tl-eje{ position:relative; height:22px; margin-left:var(--nc); font-size:.68rem; color:var(--color-taupe); }
  .tl-eje span{ position:absolute; transform:translateX(-50%); }
  .tl-fila{ display:flex; align-items:center; min-height:38px; border-top:1px solid var(--color-sand); }

<script>
(() => {
/* ═════════ utilidades ═════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const ic = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const parse = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const toISO = (d) => d.toISOString().slice(0, 10);
const add = (iso, n) => { const d = parse(iso); d.setUTCDate(d.getUTCDate() + n); return toISO(d); };
const dow = (iso) => parse(iso).getUTCDay();
const lunesDe = (iso) => add(iso, dow(iso) === 0 ? -6 : 1 - dow(iso));
const DIA = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAPL = ['domingos','lunes','martes','miércoles','jueves','viernes','sábados'];
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
const num = (iso) => parse(iso).getUTCDate();
const mesDe = (iso) => parse(iso).getUTCMonth();
const fCorta = (iso) => `${DIA[dow(iso)]} ${num(iso)} ${MES[mesDe(iso)]}`;

/* ═════════ el modelo: la misma cascada que jornada-esperada.ts ═════════ */
const personaDe = (id) => D.P.find((p) => p.id === id);
const pers = () => D.P.filter((p) => p.sede === S.sede);
const lunesSel = () => add(LUN0, 7 * S.sem);

function baseDow(pid, d, ref){ // horario base de ese día de la semana, vigente en la fecha `ref`
  let v = D.base[pid][d] || null, mejor = '';
  for (const c of D.cambios) if (c.pid === pid && c.dow === d && c.desde <= ref && c.desde >= mejor) { v = c.val; mejor = c.desde; }

}
const baseDe = (pid, f) => baseDow(pid, dow(f), f);
// Qué le toca: 1) el turno del día manda, 2) el horario base, 3) nada.
function esperado(pid, f, hip){
  const k = pid + '|' + f;
  const t = hip && k in hip ? hip[k] : D.turnos[k] || null;
  const b = baseDe(pid, f);
  if (t) {
    if (t.d) return { tipo:'descanso', origen:'turno' };
    if (t.e) return { tipo:'turno', e:t.e, s:t.s || (b && b.s) || null, r:(b && b.r) || 0, origen:'turno' };
  }
  if (!b) return { tipo:'libre', origen:'horario' };
  return { tipo:'base', e:b.e, s:b.s, r:b.r || 0, origen:'horario' };
}
const trabaja = (c) => c.tipo === 'turno' || c.tipo === 'base';
function tramoDe(c){ const e = hm(c.e), s = c.s ? hm(c.s) : H1; if (s <= 14.5) return 'm'; if (e >= CORTE) return 't'; return 'l'; }
const TRAMO_N = { m:'Mañana', t:'Tarde', l:'Día completo' };
const TRAMO_I = { m:'sol', t:'luna', l:'dia' };

// Cobertura en franjas de 15 min (7:00–21:00). El código real usa 1 h y 30 min según la vista.
function cov(f, filtro, hip){
  const arr = Array(NS).fill(0);
  for (const p of pers()) {
    if (!filtro(p)) continue;
    const c = esperado(p.id, f, hip); if (!trabaja(c)) continue;
    const e = hm(c.e), s = c.s ? hm(c.s) : H1;
    for (let i = 0; i < NS; i++) { const a = H0 + i * SLOT, b = a + SLOT; if (e < b - 1e-9 && s > a + 1e-9) arr[i]++; }
  }
  return arr;
}
function analiza(f, hip){
  const m = D.metas[S.sede][dow(f)];
  const ops = cov(f, (p) => p.op, hip), lid = cov(f, (p) => p.lider, hip);
  const metaOps = (i) => (H0 + i * SLOT >= CORTE ? m.t : m.m);
  const metaLid = () => m.l;
  let i0 = -1, i1 = -1;
  for (let i = 0; i < NS; i++) if (ops[i] > 0 || lid[i] > 0) { if (i0 < 0) i0 = i; i1 = i; }
  const alguien = pers().some((p) => trabaja(esperado(p.id, f, hip)));
  const huecos = [];
  const corre = (arr, metaFn, g) => {
    let ini = -1, key = null;
    for (let i = i0; i <= i1 + 1; i++) {
      let falta = false, k = null;
      if (i <= i1) { const mt = metaFn(i); if (mt > 0 && arr[i] < mt) { falta = true; k = `${arr[i]}/${mt}/${g === 'ops' && H0 + i * SLOT >= CORTE ? 't' : 'm'}`; } }
      if (falta && ini >= 0 && k === key) continue;
      if (ini >= 0) huecos.push({ g, i0:ini, i1:i, n:arr[ini], meta:metaFn(ini), tramo:g === 'ops' ? (H0 + ini * SLOT >= CORTE ? 't' : 'm') : null });
      if (falta) { ini = i; key = k; } else { ini = -1; key = null; }
    }
  };
  if (i0 >= 0) { corre(ops, metaOps, 'ops'); corre(lid, metaLid, 'lid'); }

    const meta = metaFn(Math.max(a, 0));
    if (b < a) return meta > 0 ? { est:'falta', n:0, meta, falta:meta } : null;
    let min = 99, max = 0; for (let i = a; i <= b; i++) { min = Math.min(min, arr[i]); max = Math.max(max, arr[i]); }
    if (meta <= 0) return { est:'sinmeta', n:max, meta:0 };
    if (min < meta) {
      // ¿falta en todo el tramo o solo en una parte? Un «0/1» sobre 15 minutos sin cubrir engaña.
      const fs = []; for (let i = a; i <= b; i++) if (arr[i] < meta) fs.push(i);
      const parcial = fs.length < (b - a + 1) ? `${hh(H0 + fs[0] * SLOT)}–${hh(H0 + (fs[fs.length - 1] + 1) * SLOT)}` : null;
      return { est:'falta', n:min, meta, falta:meta - min, parcial };
    }
    if (max > meta) return { est:'sobra', n:max, meta, sobra:max - meta };
    return { est:'ok', n:min, meta };
  };
  let tm = null, tt = null, tl = null;
  if (i0 >= 0) {
    tm = resumen(ops, () => m.m, i0, Math.min(i1, I_CORTE - 1));
    tt = resumen(ops, () => m.t, Math.max(i0, I_CORTE), i1);
    tl = resumen(lid, () => m.l, i0, i1);
    if (tm && tm.est === 'sinmeta' && tm.n === 0) tm = null;
    if (tt && tt.est === 'sinmeta' && tt.n === 0) tt = null;
    if (tl && tl.est === 'sinmeta') tl = null;
  } else {
    if (m.m > 0) tm = { est:'falta', n:0, meta:m.m, falta:m.m };
    if (m.t > 0) tt = { est:'falta', n:0, meta:m.t, falta:m.t };
    if (m.l > 0) tl = { est:'falta', n:0, meta:m.l, falta:m.l };

  return { m, ops, lid, i0, i1, huecos, tm, tt, tl, sinTurnos, alguien };
}
const horaOk = (v) => /^([01]\d|2[0-3]):[0-5]\d$/.test(v || '');

/* ═════════ qué pide atención ═════════ */
function divergencia(pid, f){
  const t = D.turnos[pid + '|' + f]; if (!t || f < PERIODO_INI) return null;
  const b = baseDe(pid, f);
  const tE = t.d ? null : t.e, tS = t.d ? null : (t.s || null);
  const txt = (e, s) => (e ? `${e}${s ? '–' + s : ''}` : 'descanso');
  let diverge = false;
  if (tE === null) diverge = !!b;
  else if (!b) diverge = true;
  else diverge = tE !== b.e || (tS && b.s && tS !== b.s);
  if (!diverge) return null;
  const espejo = D.viejo.some((v) => v.pid === pid && v.dow === dow(f) && v.e === tE && v.s === tS);
  return { pid, f, turnoTxt:txt(tE, tS), baseTxt: b ? txt(b.e, b.s) : 'descanso', espejo };
}
function causaHueco(f){
  const out = [];
  for (const p of pers()) {
    const t = D.turnos[p.id + '|' + f]; if (!t) continue;
    const b = baseDe(p.id, f);
    if (t.d && b) out.push({ p, tipo:'descanso', baseTxt:`${b.e}–${b.s}` });
  }
  return out;
}
function items(){
  const out = [];
  for (const f of diasSel()) {
    if (f < HOY) continue;
    const an = analiza(f);
    for (const h of an.huecos) out.push({ k:'hueco', f, h, causas:causaHueco(f) });
  }
  for (const key of Object.keys(D.turnos)) {
    const [pid, f] = key.split('|'); const p = personaDe(pid);
    if (p.sede !== S.sede) continue;
    const dv = divergencia(pid, f); if (dv) out.push({ k:'diverge', ...dv });
  }
  for (const p of pers()) { const c = D.ciclo[p.id]; if (c && c.h >= 40) out.push({ k:'tope', pid:p.id, c }); }
  const orden = { hueco:0, tope:1, diverge:2 };
  const pasado = (x) => (x.k === 'diverge' && x.f < HOY ? 1 : 0);
  out.sort((a, b) => orden[a.k] - orden[b.k] || pasado(a) - pasado(b) || (a.f || '').localeCompare(b.f || ''));

}

/* ═════════ piezas compartidas ═════════ */
function chipCob(r, nombre, pasado, corto){
  if (!r) return '';
  const g = { ok:'✓', falta:'▲', sobra:'＋', sinmeta:'–' }[r.est];
  const est = r.est === 'sinmeta' ? 'neutro' : r.est;
  const palabra = r.est === 'falta' ? (r.parcial ? `falta ${r.falta} de ${r.parcial}` : r.n === 0 && r.meta > 0 ? `ninguna, meta ${r.meta}` : `falta ${r.falta}`) : r.est === 'sobra' ? `sobra ${r.sobra}` : r.est === 'ok' ? 'completa' : 'sin meta';
  const cuerpo = r.est === 'sinmeta' ? `${nombre} sin meta` : r.parcial ? `${nombre} ${r.parcial}` : `${nombre} ${r.n}/${r.meta}`;
  return `<span class="cob ${est}${pasado ? ' pasado' : ''}" title="${esc(nombre)}: ${esc(palabra)}"><span class="g">${g}</span>${esc(cuerpo)}${corto ? '' : `<span class="sr"> ${esc(palabra)}</span>`}</span>`;
}
function chipsDia(f, corto){
  const an = analiza(f), pasado = f < HOY;
  if (an.sinTurnos) return `<span class="cob neutro"><span class="g">–</span>Sin turnos</span>`;
  return chipCob(an.tm, corto ? 'M' : 'Mañana', pasado, corto) + chipCob(an.tt, corto ? 'T' : 'Tarde', pasado, corto) + chipCob(an.tl, corto ? 'L' : 'Líder', pasado, corto);
}
function peorEstado(f){
  const an = analiza(f); if (an.sinTurnos) return { est:'neutro', g:'–', t:'Sin turnos' };
  const rs = [an.tm, an.tt, an.tl].filter(Boolean);
  if (rs.some((r) => r.est === 'falta')) return { est:'falta', g:'▲', t:'falta' };
  if (rs.some((r) => r.est === 'sobra')) return { est:'sobra', g:'＋', t:'sobra' };

}
function celdaHTML(p, f, mini){

  const copiables = copiablesN();
  const copia = puedeEditar() && copiables > 0 ? (S.copiar
    ? `<span class="confirma"><span>¿Copiar hasta ${copiables} turno${copiables > 1 ? 's' : ''} de la semana pasada?${copiaDetalle()}</span><button class="btn fino" data-act="copiar-si">Sí, copiar</button><button class="btn sec fino" data-act="copiar-no">Cancelar</button></span>`
    : `<button class="btn sec" data-act="copiar">${ic('copia')}Copiar semana anterior</button>`) : '';
  return `<header class="cab">
    <div><h1>Turnos y cobertura</h1><p class="desc">${esc(SEDES[S.sede])} · ${rangoTxt} · ${resumen}</p></div>
    <div class="acciones">
      ${verSedes() ? `<select class="sel" data-act="sede" aria-label="Sede">${Object.keys(SEDES).map((k) => `<option value="${k}"${k === S.sede ? ' selected' : ''}>${SEDES[k]}</option>`).join('')}</select>` : ''}
      <div class="seg" role="group" aria-label="Semana">
        <button data-act="sem" data-d="-1" aria-label="Semana anterior">${ic('izq')}</button>
        <span class="et">${num(l)}–${num(d)} ${MES[mesDe(d)]}</span>
        <button data-act="sem" data-d="1" aria-label="Semana siguiente">${ic('der')}</button>
      </div>
      <button class="btn sec" data-act="hoy">Hoy</button>
      <button class="btn sec" data-act="metas">${ic('meta')}Metas</button>
      ${copia}
    </div>
  </header>`;
}
function copiablesN(){
  const l = add(lunesSel(), -7), fin = add(l, 6);
  return Object.keys(D.turnos).filter((k) => { const [pid, f] = k.split('|'); return personaDe(pid).sede === S.sede && f >= l && f <= fin; }).length;
}
function copiaDetalle(){
  const l = add(lunesSel(), -7), fin = add(l, 6); let d = 0, x = 0;
  for (const k of Object.keys(D.turnos)) { const [pid, f] = k.split('|'); if (personaDe(pid).sede !== S.sede || f < l || f > fin) continue; if (D.turnos[k].d) d++; if (divergencia(pid, f)) x++; }
  const partes = []; if (d) partes.push(`${d} descanso${d > 1 ? 's' : ''}`); if (x) partes.push(`${x} que no coincide${x > 1 ? 'n' : ''} con el horario base`);
  return partes.length ? ` <strong>Incluye ${partes.join(' y ')}.</strong>` : '';
}
function atenderHTML(){
  const its = items();
  const n = (k) => its.filter((i) => i.k === k).length;
  const pills = [];
  if (n('hueco')) pills.push({ k:'hueco', t:`${n('hueco')} hueco${n('hueco') > 1 ? 's' : ''} de cobertura`, tono:'rojo', i:'alerta' });
  if (n('tope')) pills.push({ k:'tope', t:`${n('tope')} cerca de las 48 h`, tono:its.some((i) => i.k === 'tope' && i.c.h >= 48) ? 'rojo' : 'ambar', i:'reloj' });
  if (n('diverge')) pills.push({ k:'diverge', t:`${n('diverge')} turno${n('diverge') > 1 ? 's' : ''} no coincide${n('diverge') > 1 ? 'n' : ''} con el horario base`, tono:'ambar', i:'info' });
  const cuerpo = pills.length ? pills.map((p) => `<button class="pa ${p.tono}" data-act="pa" data-k="${p.k}" aria-pressed="${S.atender === p.k}">${ic(p.i)}${esc(p.t)}</button>`).join('') : `<span class="nada">${ic('ok')}Nada pendiente en esta sede</span>`;
  let panel = '';
  if (S.atender) { const sel = its.filter((i) => i.k === S.atender); if (sel.length) panel = `<div class="decide" style="margin-top:2px">${sel.map(cardAtender).join('')}</div>`; }
  return `<section aria-label="Para atender"><div class="atender"><span class="rot">Para atender</span>${cuerpo}</div>${panel}</section>`;
}
function barraHTML(){
  const L = pers();
  const cuenta = { todos:L.length, hoy:L.filter((p) => trabaja(esperado(p.id, HOY))).length, op:L.filter((p) => p.op).length, lider:L.filter((p) => p.lider).length, otra:L.filter((p) => !p.op && !p.lider).length };
  const chips = [['todos','Todos'], ['hoy','Trabajan hoy'], ['op','Operativas'], ['lider','Líderes'], ['otra','Otra área']].filter(([k]) => k === 'todos' || cuenta[k] > 0);
  const nf = nFiltros();
  const pop = S.pop ? `<div class="pop" id="pop" role="dialog" aria-label="Filtros">
      <div><h4>Turno que trabaja esta semana</h4><div class="fila">${[['', 'Cualquiera'], ['m', 'Mañana'], ['t', 'Tarde']].map(([v, t]) => `<button class="chip sm" data-act="f-tramo" data-v="${v}" aria-pressed="${S.fil.tramo === v}">${t}</button>`).join('')}</div></div>
      <label class="chk"><input type="checkbox" data-act="f-nov" ${S.fil.novedad ? 'checked' : ''}><span><strong>Solo con novedad</strong><br><span class="muted">Turno que no coincide, cerca de 48 h o que causa un hueco.</span></span></label>
      <p class="muted" style="font-size:.76rem">Los filtros cambian lo que ves, no los números de cobertura: esos siempre cuentan a toda la sede.</p>
      <div class="fila"><button class="btn sec fino" data-act="f-limpiar">Quitar filtros</button><button class="btn fino" data-act="f-cerrar">Listo</button></div>
    </div>` : '';
  return `<section aria-label="Buscar y filtrar"><div class="barra">
      <label class="busca">${ic('buscar')}<span class="sr">Buscar persona</span><input id="q" type="search" placeholder="Buscar persona…" value="${esc(S.q)}" autocomplete="off"></label>
      <button class="btn sec btn-filtros" data-act="filtros" aria-expanded="${S.pop}">${ic('filtros')}Filtros${nf ? ` <b>${nf}</b>` : ''}</button>
      ${pop}
    </div>
    <div class="chips" style="margin-top:8px" role="group" aria-label="Quién">${chips.map(([k, t]) => `<button class="chip" data-act="chip" data-k="${k}" aria-pressed="${S.chip === k}">${t}<b>${cuenta[k]}</b></button>`).join('')}</div></section>`;
}
function leyendaHTML(){
  return `<div class="leyenda" aria-label="Cómo leer"><span><i class="sw tu"></i>Turno del día (manda)</span><span><i class="sw ba"></i>Horario base</span><span><i class="sw de"></i>Descanso</span><span><i class="sw ot"></i>Otra área: no suma</span><span><b style="color:var(--color-ambar)">≠</b>No coincide con el horario base</span><span>☀ mañana · ☾ tarde · hasta 14:15 / desde 14:15</span></div>`;
}

/* la tarjeta de «algo que decidir» (la usan C y el panel de Para atender) */
function cardAtender(it){
  if (it.k === 'hueco') {
    const g = it.h.g === 'ops' ? 'operativas' : 'líderes';
    const cau = it.causas.map((c) => `<strong>${esc(c.p.n)}</strong> tiene descanso ese día (turno del día; su horario base trabaja ${esc(c.baseTxt)})`).join('. ');
    const acc = it.causas.map((c) => `<button class="btn fino" data-act="quitar-turno" data-pid="${c.p.id}" data-f="${it.f}">${esc(c.p.n)} vuelve a su horario</button>`).join('');
    return `<article class="dec rojo"><div class="ico">${ic('alerta')}</div>
      <div class="tt">${mayus(fLarga(it.f))}: falta ${it.h.meta - it.h.n} ${g === 'líderes' ? 'líder' : 'persona'} de ${rango(it.h.i0, it.h.i1)}</div>
      <div class="cu">Hay ${it.h.n} de ${it.h.meta} ${g} ${it.h.tramo === 't' ? 'en la tarde' : it.h.tramo === 'm' ? 'en la mañana' : 'ese día'}. ${cau ? cau + '.' : 'Nadie más tiene turno ahí.'}</div>
      <div class="acc">${acc}<button class="btn sec fino" data-act="ir-dia" data-f="${it.f}">Ver el día</button></div></article>`;
  }
  if (it.k === 'tope') {
    const p = personaDe(it.pid), pc = Math.min(100, Math.round(it.c.h / 48 * 100));
    return `<article class="dec ambar"><div class="ico">${ic('reloj')}</div>
      <div class="tt">${esc(p.n)} ${esc(p.a)}: ${dec1(it.c.h)} de 48 h · día ${it.c.dia} de 7</div>
      <div class="cu">Va por el ciclo de 7 días desde que empezó su racha sin descanso (no es la semana calendario). Conviene darle descanso antes de que siga sumando.
        <div class="barra48" role="img" aria-label="${dec1(it.c.h)} de 48 horas"><i style="width:${pc}%"></i></div></div>
      <div class="acc"><button class="btn sec fino" data-act="ver-persona" data-pid="${it.pid}">Ver su semana</button></div></article>`;
  }
  const p = personaDe(it.pid), pasado = it.f < HOY;
  return `<article class="dec ambar"><div class="ico" style="font-weight:800">≠</div>
    <div class="tt">${esc(p.n)} ${esc(p.a)} · ${fCorta(it.f)} ${pasado ? '<span class="ins neutro">ya pasó</span>' : ''} ${it.espejo ? '<span class="ins alerta">probable espejo viejo</span>' : '<span class="ins neutro">excepción a propósito</span>'}</div>
    <div class="cu">Turno del día <strong>${esc(it.turnoTxt)}</strong> · horario base ${esc(it.baseTxt)}. El turno manda; de él sale la tardanza.</div>
    <div class="acc"><button class="btn fino" data-act="permanente" data-pid="${it.pid}" data-f="${it.f}">Hacer permanente</button><button class="btn sec fino" data-act="quitar-turno" data-pid="${it.pid}" data-f="${it.f}">Usar el horario base</button><button class="btn sutil fino" data-act="celda" data-pid="${it.pid}" data-f="${it.f}">Abrir</button></div></article>`;
}

/* ═════════ VARIANTE A · cuadrícula de la semana ═════════ */

      : `<div class="dh">${DIA[dow(f)]} <small>${num(f)} ${MES[mesDe(f)]}</small>${hoy ? '<em>hoy</em>' : ''}</div>`;
    return `<th class="${hoy ? 'hoy' : ''}${hl ? ' hl' : ''}" scope="col" data-col="${f}">${cab}${modo === 'E' ? '' : `<div class="cobs">${chipsDia(f)}</div>`}</th>`;
  }).join('');

      <tr><th scope="row">Tarde</th>${ds.map((f) => `<td class="${S.hlDia === f ? 'hl' : ''}"><div class="cobs">${(() => { const an = analiza(f); return an.sinTurnos ? '' : chipCob(an.tt, 'Tarde', f < HOY) || '<span class="muted">—</span>'; })()}</div></td>`).join('')}<td></td></tr>
      <tr><th scope="row">Líderes</th>${ds.map((f) => `<td class="${S.hlDia === f ? 'hl' : ''}"><div class="cobs">${(() => { const an = analiza(f); return an.sinTurnos ? '' : chipCob(an.tl, 'Líder', f < HOY) || '<span class="muted">sin meta</span>'; })()}</div></td>`).join('')}<td></td></tr>

function vistaA(){

/* ═════════ VARIANTE B · un día a la vez en línea de tiempo ═════════ */
function tlHTML(f, compacto){
  const an = analiza(f), L = visibles();
  const eje = [7,9,11,13,15,17,19,21].map((h) => `<span style="left:${pct(h)}%">${h}</span>`).join('');
  const segs = (arr, metaFn) => {
    let out = '', i = an.i0; if (i < 0) return '';
    while (i <= an.i1) {
      let j = i; while (j + 1 <= an.i1 && arr[j + 1] === arr[i] && metaFn(j + 1) === metaFn(i)) j++;
      const mt = metaFn(i), n = arr[i];
      const est = mt <= 0 ? null : n < mt ? 'falta' : n > mt ? 'sobra' : 'ok';
      const w = pct(H0 + (j + 1) * SLOT) - pct(H0 + i * SLOT);
      if (est) out += `<div class="seg-c ${est}" style="left:${pct(H0 + i * SLOT)}%;width:${w}%" title="${hh(H0 + i * SLOT)}–${hh(H0 + (j + 1) * SLOT)}: ${n} de ${mt}">${w > 7 ? `${est === 'falta' ? '▲ ' : est === 'sobra' ? '＋ ' : ''}${n}/${mt}` : ''}</div>`;
      i = j + 1;
    }
    return out;
  };
  const filaCob = (nom, sub, arr, metaFn, meta) => `<div class="tl-fila"><div class="nc">${nom}<small>${sub}</small></div><div class="pista">${meta === 0 && !arr.some((x) => x > 0) ? '' : segs(arr, metaFn)}</div></div>`;
  const barra = (p) => {
    const c = esperado(p.id, f), otra = !p.op && !p.lider, dv = divergencia(p.id, f);
    let cont = '';
    if (trabaja(c)) {
      const tr = tramoDe(c), e = hm(c.e), s = c.s ? hm(c.s) : H1, w = pct(s) - pct(e);
      cont = `<button class="bar ${tr} ${c.tipo}${otra ? ' otra' : ''}" style="left:${pct(e)}%;width:${w}%" data-act="celda" data-pid="${p.id}" data-f="${f}" aria-label="${esc(`${p.n} ${p.a}: ${c.e} a ${c.s || 'sin salida'}, ${c.tipo === 'turno' ? 'turno del día' : 'horario base'}`)}">${w > 12 ? `${c.e}–${c.s || '…'}` : ''}${dv ? ' <span style="color:var(--color-ambar);margin-left:4px">≠</span>' : ''}</button>`;
    } else {
      cont = `<button class="bar l ${c.tipo === 'descanso' ? 'turno' : 'base'}" style="left:1%;width:auto;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in oklab,var(--color-ceniza) 22%,transparent) 6px 7px),var(--color-papel);color:var(--color-ceniza)" data-act="celda" data-pid="${p.id}" data-f="${f}" aria-label="${esc(`${p.n} ${p.a}: descanso`)}">Descanso${c.tipo === 'descanso' ? ' · turno del día' : ' · horario base'}${dv ? ' <span style="color:var(--color-ambar);margin-left:4px">≠</span>' : ''}</button>`;
    }
    return `<div class="tl-fila"><div class="nc">${esc(p.n)} ${esc(p.a)}<small>${p.lider ? 'Líder de equipo' : !p.op ? esc(p.area) + ' · no suma' : esc(p.area)}</small></div><div class="pista">${cont}</div></div>`;
  };
  const caps = an.huecos.map((h) => `<i style="left:${pct(H0 + h.i0 * SLOT)}%;width:${pct(H0 + h.i1 * SLOT) - pct(H0 + h.i0 * SLOT)}%"><b>${h.g === 'ops' ? 'Falta' : 'Sin líder'} ${rango(h.i0, h.i1)}</b></i>`).join('');
  return `<div class="tl${compacto ? ' compacto' : ''}" aria-label="Línea de tiempo del ${fLarga(f)}">
    <div class="tl-eje">${eje}</div>
    <div class="corte" style="left:calc(var(--nc) + 10px + (100% - var(--nc) - 20px) * ${pct(CORTE) / 100})" aria-hidden="true"></div>
    ${filaCob('Cobertura', 'operativas vs meta', an.ops, (i) => (H0 + i * SLOT >= CORTE ? an.m.t : an.m.m), an.m.m + an.m.t)}
    ${an.m.l > 0 || an.lid.some((x) => x > 0) ? filaCob('Líderes', `meta ${an.m.l}`, an.lid, () => an.m.l, an.m.l) : ''}
    ${L.map(barra).join('') || '<p class="muted" style="padding:12px">Nadie coincide con lo que buscaste.</p>'}
    <div class="tl-cap" aria-hidden="true">${caps}</div></div>`;
}
function resumenDiaHTML(f){
  const an = analiza(f);
  const frases = an.huecos.map((h) => `${h.g === 'ops' ? 'Falta' : 'Sin líder'} ${h.meta - h.n} de ${rango(h.i0, h.i1)} (${h.n} de ${h.meta})`);
  const causas = causaHueco(f);
  let aviso = '';
  if (f < HOY && frases.length) aviso = `<div class="aviso info"><div class="tit">${ic('info')}Este día ya pasó</div><div class="txt">${frases.join(' · ')}. Corregir un día pasado se hace en Correcciones.</div></div>`;
  else if (frases.length) aviso = `<div class="aviso rojo"><div class="tit">${ic('alerta')}${frases.join(' · ')}</div><div class="txt">${causas.length ? causas.map((c) => `<strong>${esc(c.p.n)}</strong> tiene descanso ese día (su horario base trabaja ${esc(c.baseTxt)}).`).join(' ') : 'Nadie más tiene turno en esa franja.'}</div><div class="acc">${causas.map((c) => `<button class="btn fino" data-act="quitar-turno" data-pid="${c.p.id}" data-f="${f}">${esc(c.p.n)} vuelve a su horario</button>`).join('')}</div></div>`;
  else if (an.sinTurnos) aviso = `<div class="aviso info"><div class="tit">${ic('info')}Sin turnos</div><div class="txt">Ese día la sede no se labora y las tres metas valen 0.</div></div>`;
  return `<div class="cobs" style="flex-direction:row;flex-wrap:wrap;gap:6px">${chipsDia(f)}</div>${aviso}`;
}

      ${resumenDiaHTML(f)}<div style="margin-top:10px">${barraHTML()}</div><div style="margin-top:10px">${tlHTML(f, false)}</div><div style="margin-top:10px">${leyendaHTML()}</div></section>`;

/* ═════════ VARIANTE C · primero lo que hay que decidir ═════════ */
function vistaC(){
  const its = items();

    ? `<div class="decide">${its.map(cardAtender).join('')}</div>`
    : `<div class="vacio"><div class="big">${ic('ok')}</div><h3>Nada que decidir en ${esc(SEDES[S.sede])}</h3><p class="muted">Todas las horas llegan a la meta, los turnos coinciden con el horario base y nadie está cerca de las 48 h.</p></div>`;

    <details class="pleg" id="semC"${S.semAbierta ? ' open' : ''}><summary>La semana completa <span class="muted" style="font-weight:400;font-size:.84rem">· quién trabaja cuándo, y cobertura por día</span></summary><div class="in">${barraHTML()}${gridHTML('E').replace('data-act="dia"', 'data-act="dia"')}${leyendaHTML()}</div></details>`;
}

/* ═════════ VARIANTE D · por persona (pensada para el celular de la líder) ═════════ */
function vistaD(){
  const ds = diasSel(); if (!ds.includes(S.dia)) S.dia = ds.includes(HOY) ? HOY : ds[0];
  const f = S.dia;
  const tabs = ds.map((d) => { const pe = peorEstado(d); return `<button data-act="dia-sel" data-f="${d}" aria-pressed="${d === f}"><small>${DIA[dow(d)]}${d === HOY ? ' · hoy' : ''}</small><b>${num(d)}</b><span class="e ${pe.est}">${pe.g}<span class="sr"> ${pe.t}</span></span></button>`; }).join('');
  let L = visibles();
  // quien trabaja ese día primero, por hora de entrada; el resto después
  const orden = (p) => { const c = esperado(p.id, f); return trabaja(c) ? hm(c.e) : 99; };
  L = [...L].sort((a, b) => (b.id === yo()) - (a.id === yo()) || orden(a) - orden(b));
  const card = (p) => {
    const c = esperado(p.id, f), esYo = p.id === yo();
    const hoyTxt = trabaja(c) ? `${c.e}–${c.s || '…'}` : 'Descansa';

/* ═════════ acciones ═════════ */
function toast(txt, undo){

function snapshot(){ S.undo = JSON.stringify({ t:D.turnos, c:D.cambios }); }
function deshacer(){ if (!S.undo) return; const s = JSON.parse(S.undo); D.turnos = s.t; D.cambios = s.c; S.undo = null; $('#toast-capa').innerHTML = ''; render(); }
function abrirTurno(pid, f){
  const c = esperado(pid, f);

  S.form = { modo: c.tipo === 'descanso' || c.tipo === 'libre' ? 'descanso' : 'trabaja', e: trabaja(c) ? c.e : '', s: trabaja(c) && c.s ? c.s : '' };
  if (c.tipo === 'libre' || (c.tipo === 'descanso')) { const b = baseDe(pid, f); S.form.e = b ? b.e : ''; S.form.s = b ? b.s : ''; }
  renderCapa();

function fijarBase(pid, f, val){
  const d = dow(f);
  const quedan = [0,1,2,3,4,5,6].filter((x) => (x === d ? !!val : !!baseDow(pid, x, f)));
  if (!quedan.length) return { error:`No puedo dejar a ${personaDe(pid).n} sin ningún día de trabajo. Ajusta su horario en Horarios.` };
  const desde = f > HOY ? f : HOY, esPasado = desde !== f;
  D.cambios.push({ pid, dow:d, desde, val });
  if (!esPasado) delete D.turnos[pid + '|' + f];
  return { desde, esPasado, siete: quedan.length === 7 };
}
function hacerPermanente(pid, f){
  const t = D.turnos[pid + '|' + f]; if (!t) return;
  const b = baseDe(pid, f);
  snapshot();
  const r = fijarBase(pid, f, t.d ? null : { e:t.e, s:t.s || (b && b.s) || t.e, r:(b && b.r) || 0 });
  const p = personaDe(pid);
  if (r.error) { S.undo = null; toast(r.error); return; }
  if (r.esPasado) toast(`El horario base de ${p.n} rige desde hoy, no desde el ${fCorta(f)}: un horario nuevo no reescribe días que ya pasaron. Ese día se queda con su turno.${r.siete ? ' Ojo: ya no tendría día de descanso en su horario.' : ''}`, true);
  else toast(`${p.n}: su horario base de los ${DIAPL[dow(f)]} cambió desde el ${fCorta(f)}.${r.siete ? ' Ojo: ya no tiene día de descanso en su horario.' : ''}`, true);
  render();
}
function quitarTurno(pid, f){

  snapshot(); delete D.turnos[pid + '|' + f];
  const c = esperado(pid, f), p = personaDe(pid);
  toast(`${p.n} vuelve a su horario el ${fCorta(f)}${trabaja(c) ? ` (${c.e}–${c.s})` : ''}. Se recalcula esa jornada.`, true);

function guardarSolo(){
  const { pid, f } = S.drawer, F = S.form, p = personaDe(pid);

}
function guardarDesde(){
  const { pid, f } = S.drawer, F = S.form, p = personaDe(pid);
  if (F.modo === 'trabaja' && (!horaOk(F.e) || !horaOk(F.s))) { toast('Para cambiar el horario base necesito entrada y salida, como 08:00 y 14:15.'); return; }
  snapshot();
  const prev = baseDe(pid, f);
  const r = fijarBase(pid, f, F.modo === 'descanso' ? null : { e:F.e, s:F.s, r:(prev && prev.r) || 0 });
  if (r.error) { S.undo = null; toast(r.error); return; }
  S.drawer = null;
  toast(r.esPasado ? `Horario base de ${p.n}: los ${DIAPL[dow(f)]} desde hoy. El ${fCorta(f)} ya pasó y se queda como estaba.${r.siete ? ' Ojo: ya no tendría día de descanso en su horario.' : ''}` : `Horario base de ${p.n}: los ${DIAPL[dow(f)]} desde el ${fCorta(f)}.${r.siete ? ' Ojo: ya no tiene día de descanso en su horario.' : ''}`, true);

function copiarSemana(){

  if (a === 'modo') { S.form.modo = el.dataset.v; renderCapa(); return; }
  if (a === 'guardar-solo') { guardarSolo(); return; }
  if (a === 'guardar-desde') { guardarDesde(); return; }
  if (a === 'deshacer') { deshacer(); return; }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); return; }
  if (t.id === 'fe' || t.id === 'fs') { t.value = mascara(t.value); S.form[t.id === 'fe' ? 'e' : 's'] = t.value; $('#efectos').innerHTML = efectosHTML(); return; }
  if (t.dataset && t.dataset.act === 'meta') {
    const d = Number(t.dataset.d), k = t.dataset.k, val = Math.max(0, Math.round(Number(t.value) || 0));
    D.metas[S.sede][d][k] = val;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'sede') { S.sede = t.value; S.chip = 'todos'; S.q = ''; S.atender = null; render(); return; }
  if (t.dataset && t.dataset.act === 'f-nov') { S.fil.novedad = t.checked; render(); return; }
  if (t.dataset && t.dataset.act === 'agregar') { if (t.value) { const f = t.dataset.f, pid = t.value; S.drawer = null; abrirTurno(pid, f); const b = baseDe(pid, f); S.form = { modo:'trabaja', e:b ? b.e : '08:00', s:b ? b.s : '14:15' }; renderCapa(); } return; }
  if (t.dataset && t.dataset.act === 'meta') { render(); return; }
  if (t.id === 'selRol') { S.rol = t.value; if (S.rol !== 'do') S.sede = 'TRU'; S.drawer = null; S.copiar = false; render(); }
  if (t.id === 'selTema') { if (t.value === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t.value); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.drawer) { S.drawer = null; renderCapa(); } else if (S.pop) { S.pop = false; render(); } } });
$('#btnReset').addEventListener('click', () => { reiniciar(true); toast('Demo reiniciada.'); });

reiniciar(false);
})();
</script>
</body>
</html>
