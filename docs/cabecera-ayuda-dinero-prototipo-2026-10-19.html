<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabecera, ayuda y dinero — prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<!--
  Prototipo «Cabecera, ayuda y dinero» (2026-10-19). Cuatro temas, tres variantes cada uno.

  NO es código de la app y no toca ninguna base. Datos 100 % ficticios. Nada de lo que se aprieta aquí
  cambia un cálculo, cierra un periodo ni publica una boleta: cada acción de dinero termina en un aviso
  «esto es una maqueta».

  Lo que NINGUNA variante cambia (CLAUDE.md):
    · Lo que registra el sistema alimenta el pago: una advertencia que protege plata o una obligación legal
      se ve EN EL MOMENTO de actuar, nunca solo dentro de un ⓘ.
    · Dynamic avisa, nunca sanciona solo.
    · Cada acción de dinero (cerrar un grupo, publicar boletas) pide una confirmación visible y dice que no se paga dos veces.
    · El color nunca va solo: cada estado lleva palabra o ícono. El número de una Cifra siempre va en tinta.
    · Solo tokens de globals.css, claro y oscuro.

  Las alturas que muestra la maqueta ("alto de la cabecera: N px") son las de ESTA maqueta, medidas en vivo en tu
  navegador; no son las de la app real.
-->
<style>
  :root{
    --color-crema:#f5f0e8; --color-papel:#fbf8f2; --color-tinta:#1a1a18;
    --color-rojo:#b8412d; --color-rojo-profundo:#8b2a1f; --color-sand:#e8e0d0; --color-taupe:#805c4c;
    --color-hueso:#eae1d2; --color-pizarra:#4c5d6e; --color-verde:#48603f;
    --color-ambar:#74501a; --color-azul:#2f5f9e; --color-ceniza:#635f58;
    --font-sans:'DM Sans', ui-sans-serif, system-ui, sans-serif;
    --font-serif:'EB Garamond', ui-serif, Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
      --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
      --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
      --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
    --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
    --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
    --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; max-width:100%; overflow-x:hidden; }
  body{ background:var(--color-crema); color:var(--color-tinta); font-family:var(--font-sans); font-size:14.5px; line-height:1.5; }
  h1,h2,h3,h4{ font-family:var(--font-serif); font-weight:600; margin:0; text-wrap:balance; }
  p{ margin:0; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--color-rojo); outline-offset:2px; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  svg.i{ width:1em; height:1em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.12em; }
  .muted{ color:var(--color-taupe); }

  /* ══ barra del prototipo (no es parte de la pantalla) ══ */
  .proto{ z-index:50; background:var(--color-papel); border-bottom:1px solid var(--color-sand); }
  @media (min-width:1100px){ .proto{ position:sticky; top:0; } }
  .proto .fila1{ padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .proto .fila2{ padding:6px 16px 8px; border-top:1px solid var(--color-sand); display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; background:color-mix(in oklab, var(--color-hueso) 55%, var(--color-papel)); }
  .demo-badge{ font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 14%, var(--color-papel)); border:1px solid color-mix(in oklab, var(--color-pizarra) 35%, transparent); padding:3px 9px; border-radius:100px; white-space:nowrap; }
  .tabs{ display:flex; flex-wrap:wrap; gap:4px; }
  .tabs button{ border:1px solid transparent; background:none; border-radius:10px; padding:7px 13px; font-weight:600; font-size:.88rem; color:var(--color-taupe); min-height:38px; }
  .tabs button:hover{ background:var(--color-hueso); color:var(--color-tinta); }
  .tabs button[aria-selected="true"]{ background:var(--color-tinta); color:var(--color-crema); }
  .tabs button small{ font-weight:500; opacity:.75; margin-left:5px; }
  .ctl{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-left:auto; font-size:.78rem; color:var(--color-taupe); }
  .ctl label{ display:inline-flex; gap:6px; align-items:center; }
  .ctl select, .sel{ background:var(--color-hueso); border:1px solid var(--color-sand); border-radius:8px; padding:4px 8px; color:var(--color-tinta); }
  .vars{ display:flex; flex-wrap:wrap; gap:6px; }
  .vbtn{ border:1px solid var(--color-sand); background:var(--color-crema); border-radius:10px; padding:5px 11px 5px 6px; font-weight:600; font-size:.82rem; display:inline-flex; gap:7px; align-items:center; min-height:34px; text-align:left; }
  .vbtn b{ display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 4px; border-radius:6px; background:var(--color-hueso); color:var(--color-taupe); font-size:.76rem; }
  .vbtn[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); border-color:var(--color-tinta); }
  .vbtn[aria-pressed="true"] b{ background:var(--color-crema); color:var(--color-tinta); }
  .vbtn .rec{ font-size:.66rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:1px 6px; border-radius:100px; background:color-mix(in oklab, var(--color-verde) 18%, var(--color-papel)); color:var(--color-verde); white-space:nowrap; }
  .vbtn[aria-pressed="true"] .rec{ background:var(--color-crema); color:var(--color-verde); }
  .vbtn.ref{ border-style:dashed; color:var(--color-taupe); }
  .vbtn.ref[aria-pressed="true"]{ color:var(--color-crema); }
  .caso{ display:inline-flex; border:1px solid var(--color-sand); border-radius:8px; overflow:hidden; background:var(--color-papel); flex-wrap:wrap; }
  .caso button{ border:0; background:none; padding:5px 11px; font-size:.8rem; font-weight:600; color:var(--color-taupe); min-height:32px; }
  .caso button[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); }
  .rotc{ font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--color-taupe); }
  .lema{ padding:12px 16px 0; max-width:1240px; margin-inline:auto; color:var(--color-taupe); font-size:.86rem; }
  .lema strong{ color:var(--color-tinta); }

  /* ══ la «pantalla» simulada ══ */
  .page{ max-width:1240px; margin-inline:auto; padding:14px 16px 80px; display:flex; flex-direction:column; gap:16px; }
  .marco-top{ display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; justify-content:space-between; font-size:.76rem; color:var(--color-taupe); }
  .alto{ font-variant-numeric:tabular-nums; background:var(--color-hueso); border-radius:100px; padding:2px 10px; }
  .pantalla{ container-type:inline-size; container-name:pan; border:1px solid var(--color-sand); border-radius:20px; padding:24px; background:var(--color-crema); display:flex; flex-direction:column; gap:16px; box-shadow:0 1px 0 var(--color-sand); }
  .pantalla.cel{ width:375px; max-width:100%; margin-inline:auto; padding:16px; }
  .pantalla > *{ min-width:0; }

  /* CabeceraPagina */
  .cab{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:12px 16px; }
  .cab-l{ min-width:0; flex:1 1 320px; }
  .cab h1{ font-size:1.75rem; font-weight:500; line-height:1.15; letter-spacing:-.01em; }
  .sobre{ font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--color-taupe); margin-bottom:4px; }
  .desc{ margin-top:4px; display:flex; align-items:flex-start; gap:6px; max-width:42rem; font-size:.875rem; color:var(--color-taupe); }
  .desc .dtxt{ min-width:0; }
  .cab .acc{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; max-width:100%; }
  .tt{ display:flex; gap:14px; align-items:center; }
  .av{ width:56px; height:56px; border-radius:50%; background:color-mix(in oklab, var(--color-rojo) 12%, var(--color-papel)); color:var(--color-rojo); display:grid; place-items:center; font-family:var(--font-serif); font-size:1.5rem; flex:none; }
  .ayb{ margin:-4px 0; width:32px; height:32px; flex:none; border:0; background:none; border-radius:999px; color:var(--color-taupe); display:inline-grid; place-items:center; font-size:1.25rem; }
  .ayb:hover{ background:color-mix(in oklab, var(--color-sand) 60%, transparent); color:var(--color-tinta); }
  /* miga y volver */
  .miga{ display:flex; flex-wrap:wrap; align-items:center; gap:0 2px; font-size:.78rem; color:var(--color-taupe); margin-bottom:2px; }
  .miga a, .miga button.lk{ color:var(--color-taupe); text-decoration:underline; text-underline-offset:3px; padding:7px 4px; min-height:32px; display:inline-flex; align-items:center; background:none; border:0; cursor:pointer; }
  .miga a:hover, .miga button.lk:hover{ color:var(--color-tinta); }
  .miga .sep{ opacity:.7; padding:0 1px; }
  .miga [aria-current]{ color:var(--color-tinta); font-weight:500; padding:7px 4px; }
  .volver{ display:inline-flex; align-items:center; gap:4px; border:1px solid var(--color-sand); background:var(--color-papel); border-radius:8px; padding:4px 12px 4px 8px; font-size:.78rem; color:var(--color-taupe); min-height:34px; margin-bottom:8px; }
  .volver:hover{ color:var(--color-tinta); border-color:var(--color-taupe); }
  .volver-txt{ background:none; border:0; padding:6px 0; font-size:.88rem; color:var(--color-taupe); margin-bottom:6px; }
  .mvolver{ display:inline-flex; align-items:center; gap:2px; flex:none; background:var(--color-papel); border:1px solid var(--color-sand); border-radius:999px; padding:2px 10px 2px 6px; font-size:.78rem; font-weight:600; color:var(--color-taupe); min-height:28px; margin-right:2px; }
  .mvolver:hover{ color:var(--color-tinta); border-color:var(--color-taupe); }
  .dsep{ opacity:.6; }
  .pantalla > .volver, .pantalla > .volver-txt{ align-self:flex-start; margin-bottom:-8px; }

  /* botones, insignias, avisos */
  .btn{ border:1px solid var(--color-tinta); background:var(--color-tinta); color:var(--color-crema); border-radius:8px; padding:7px 14px; font-weight:600; font-size:.84rem; min-height:38px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn.sec{ background:var(--color-papel); color:var(--color-tinta); border-color:var(--color-taupe); }
  .btn.sutil{ background:transparent; color:var(--color-taupe); border-color:transparent; }
  .btn.peligro{ background:transparent; color:var(--color-rojo-profundo); border-color:color-mix(in oklab, var(--color-rojo) 50%, var(--color-sand)); }
  .btn.fino{ min-height:32px; padding:3px 10px; font-size:.78rem; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .lnk{ background:none; border:0; padding:6px 0; color:var(--color-rojo-profundo); text-decoration:underline; text-underline-offset:3px; font-weight:600; font-size:inherit; text-align:left; cursor:pointer; }
  .lnk.sob{ color:var(--color-tinta); }
  .ins{ display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:600; padding:2px 9px; border-radius:100px; white-space:nowrap; }
  .ins::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .ins.aviso{ color:var(--color-ambar); background:color-mix(in oklab, var(--color-ambar) 15%, var(--color-papel)); }
  .ins.alerta{ color:var(--color-rojo-profundo); background:color-mix(in oklab, var(--color-rojo) 10%, var(--color-papel)); }
  .ins.neutro{ color:var(--color-ceniza); background:color-mix(in oklab, var(--color-ceniza) 12%, var(--color-papel)); }
  .ins.ok{ color:var(--color-verde); background:color-mix(in oklab, var(--color-verde) 15%, var(--color-papel)); }
  .ins.info{ color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 15%, var(--color-papel)); }
  .ins.sinp::before{ display:none; }
  .banner{ border-radius:8px; border:1px solid; padding:10px 14px; font-size:.86rem; display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-start; }
  .banner .ico{ margin-top:3px; font-size:1rem; }
  .banner .bx{ min-width:0; flex:1 1 220px; }
  .banner b{ font-weight:700; }
  .banner.alerta{ border-color:color-mix(in oklab, var(--color-rojo) 30%, transparent); background:color-mix(in oklab, var(--color-rojo) 6%, var(--color-papel)); } .banner.alerta b, .banner.alerta .ico{ color:var(--color-rojo-profundo); }
  .banner.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 7%, var(--color-papel)); } .banner.ambar b, .banner.ambar .ico{ color:var(--color-ambar); }
  .banner.info{ border-color:color-mix(in oklab, var(--color-pizarra) 30%, transparent); background:color-mix(in oklab, var(--color-pizarra) 6%, var(--color-papel)); } .banner.info b, .banner.info .ico{ color:var(--color-pizarra); }
  .banner.ok{ border-color:color-mix(in oklab, var(--color-verde) 30%, transparent); background:color-mix(in oklab, var(--color-verde) 6%, var(--color-papel)); } .banner.ok b, .banner.ok .ico{ color:var(--color-verde); }
  .banner.neutro{ border-color:var(--color-sand); background:color-mix(in oklab, var(--color-sand) 25%, var(--color-papel)); } .banner.neutro .ico{ color:var(--color-taupe); }
  .banner .tail{ margin-left:auto; flex:none; }
  .tarj{ background:var(--color-papel); border:1px solid var(--color-sand); border-radius:16px; padding:16px; }
  .tarj > h3{ font-size:1.12rem; margin-bottom:8px; }
  .pt{ width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; }
  .pt.alerta{ background:var(--color-rojo); } .pt.advertencia{ background:var(--color-ambar); } .pt.positivo{ background:var(--color-verde); } .pt.informativo{ background:var(--color-pizarra); }

  /* ParaAtender */
  .atender{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .atender .rot{ font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--color-taupe); }
  .atender .nada{ font-size:.86rem; color:var(--color-verde); display:inline-flex; gap:6px; align-items:center; }
  .pa{ display:inline-flex; align-items:center; gap:6px; border-radius:999px; border:1px solid var(--color-sand); padding:6px 13px; font-size:.78rem; font-weight:600; font-variant-numeric:tabular-nums; background:var(--color-papel); color:var(--color-tinta); min-height:32px; }
  .pa.rojo{ border-color:color-mix(in oklab, var(--color-rojo) 30%, transparent); background:color-mix(in oklab, var(--color-rojo) 10%, var(--color-papel)); color:var(--color-rojo-profundo); }
  .pa.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 15%, var(--color-papel)); color:var(--color-ambar); }
  .pa.pizarra{ border-color:color-mix(in oklab, var(--color-pizarra) 40%, transparent); background:color-mix(in oklab, var(--color-pizarra) 10%, var(--color-papel)); color:var(--color-pizarra); }
  .pa[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--color-tinta); }
  .franja-b{ background:var(--color-papel); border:1px solid var(--color-sand); border-radius:16px; padding:10px 14px; }
  .franja-b .tot{ margin-left:auto; text-align:right; line-height:1.2; }
  .franja-b .tot small{ display:block; font-size:.72rem; color:var(--color-taupe); }
  .franja-b .tot .tl{ display:flex; gap:6px; align-items:center; justify-content:flex-end; font-size:.72rem; color:var(--color-taupe); }
  .franja-b .tot b{ font-family:var(--font-serif); font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums; color:var(--color-tinta); }

  /* Cifra */
  .cifras{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .cifras.c4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  .cifra{ display:flex; flex-direction:column; border:1px solid var(--color-sand); background:var(--color-papel); border-radius:16px; padding:12px; text-align:left; }
  .cifra .et{ display:flex; gap:6px; align-items:center; font-size:.76rem; color:var(--color-taupe); }
  .cifra .v{ margin-top:auto; padding-top:4px; font-family:var(--font-serif); font-size:1.5rem; font-variant-numeric:tabular-nums; color:var(--color-tinta); line-height:1.2; }
  .cifra .v.pintado{ color:var(--color-rojo); }
  .cifra .v.pintado.ambar{ color:var(--color-ambar); }
  .cifra .det{ font-size:.76rem; color:var(--color-taupe); }
  .cifra .mk{ font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--color-rojo-profundo); }
  button.cifra:hover{ background:var(--color-hueso); }

  /* pasos */
  .pasos{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; counter-reset:p; }
  .paso{ border:1px solid var(--color-sand); background:var(--color-papel); border-radius:14px; padding:10px 12px; display:grid; grid-template-columns:auto 1fr; gap:0 10px; align-items:start; min-width:0; }
  .paso .nm{ width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:.78rem; font-weight:700; border:1.5px solid var(--color-taupe); color:var(--color-taupe); grid-row:1 / span 2; background:var(--color-crema); }
  .paso .pt1{ font-weight:700; font-size:.88rem; line-height:1.25; }
  .paso .pd{ font-size:.76rem; color:var(--color-taupe); grid-column:2; }
  .paso.hecho .nm{ background:var(--color-verde); border-color:var(--color-verde); color:var(--color-crema); }
  .paso.ahora{ border-color:var(--color-tinta); box-shadow:inset 0 0 0 1px var(--color-tinta); background:var(--color-hueso); }
  .paso.ahora .nm{ background:var(--color-tinta); border-color:var(--color-tinta); color:var(--color-crema); }
  .paso.luego{ opacity:.78; }
  .paso .est{ font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--color-taupe); grid-column:2; }
  .paso.ahora .est{ color:var(--color-tinta); } .paso.hecho .est{ color:var(--color-verde); }

  /* contexto (lo que queda debajo de la cabecera) */
  .ctx-tabs{ display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid var(--color-sand); }
  .ctx-tabs span{ padding:8px 12px; font-size:.84rem; color:var(--color-taupe); border-bottom:2px solid transparent; margin-bottom:-1px; display:inline-flex; gap:5px; align-items:center; }
  .ctx-tabs span.on{ color:var(--color-tinta); font-weight:600; border-color:var(--color-tinta); }
  .stub{ border:1px dashed var(--color-taupe); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; background:color-mix(in oklab, var(--color-papel) 70%, transparent); }
  .stub .lb{ font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--color-taupe); }
  .stub .bar{ height:10px; border-radius:6px; background:var(--color-sand); }
  .stub .w40{ width:40%; } .stub .w60{ width:60%; } .stub .w80{ width:80%; } .stub .w30{ width:30%; }
  .req{ background:var(--color-papel); border:1px solid var(--color-sand); border-radius:16px; padding:12px 16px; }
  .req h3{ font-size:1.05rem; margin-bottom:6px; }
  .req ul{ list-style:none; margin:0; padding:0; }
  .req li{ display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; padding:7px 0; border-top:1px solid var(--color-sand); font-size:.86rem; }
  .req li .q{ font-weight:600; }
  .req li .r{ color:var(--color-taupe); flex:1 1 180px; }

  /* tabla de la pantalla simulada */
  .tbl-s{ width:100%; border-collapse:collapse; font-size:.86rem; background:var(--color-papel); }
  .tbl-s th{ text-align:left; font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; color:var(--color-taupe); padding:9px 12px; background:var(--color-hueso); font-weight:600; }

  prov: { titulo: 'Cómo se calculan las provisiones', intro: 'Es lo que la empresa debe tener reservado por beneficios que todavía no pagó. No es un pago: es un acumulado.',

/* ═════════ piezas (espejo de components/ui) ═════════ */
const ayb = (k) => `<button class="ayb" type="button" data-act="ayuda" data-k="${k}" aria-label="${AY[k].titulo}" aria-haspopup="dialog">${ic('info')}</button>`;
function cab(o) {
  const desc = (o.desc || o.ayuda)
    ? `<div class="desc">${o.descPre || ''}<span class="dtxt">${o.desc || ''}</span>${o.ayuda ? ayb(o.ayuda) : ''}</div>` : '';
  const ttl = `<div style="min-width:0"><h1>${o.titulo}</h1>${desc}</div>`;
  return `<header class="cab">
    <div class="cab-l">${o.volver || ''}${o.miga || ''}${o.sobre ? `<p class="sobre">${o.sobre}</p>` : ''}
      ${o.av ? `<div class="tt"><span class="av" aria-hidden="true">${o.av}</span>${ttl}</div>` : ttl}</div>
    ${o.acc ? `<div class="acc">${o.acc}</div>` : ''}
  </header>`;
}
const miga = (items) => `<nav class="miga" aria-label="Ubicación">${items.map((x, i) => i < items.length - 1
  ? `<button class="lk" type="button" data-act="nav" data-n="${x}">${x}</button><span class="sep" aria-hidden="true">›</span>`
  : `<span aria-current="page">${x}</span>`).join('')}</nav>`;
const volver = (txt) => `<button class="volver" type="button" data-act="nav" data-n="${txt}">${ic('izq')}${txt}</button>`;
const mvolver = (txt) => `<button class="mvolver" type="button" data-act="nav" data-n="${txt}">${ic('izq')}${txt}</button><span class="dsep" aria-hidden="true">·</span>`;
const btn = (t, o = {}) => `<button class="btn ${o.k || ''} ${o.fino ? 'fino' : ''}" type="button" ${o.dis ? 'disabled' : ''} data-act="${o.act || 'nav'}" data-n="${o.n || t}" ${o.d || ''}>${o.ico ? ic(o.ico) : ''}${t}</button>`;
const ins = (t, tono = 'neutro', sinp = false) => `<span class="ins ${tono}${sinp ? ' sinp' : ''}">${t}</span>`;
const banner = (tono, ico, html, tail = '') => `<div class="banner ${tono}" role="note">${ico ? `<span class="ico">${ic(ico)}</span>` : ''}<div class="bx">${html}</div>${tail ? `<div class="tail">${tail}</div>` : ''}</div>`;
const punto = (t) => `<span class="pt ${t}" aria-hidden="true"></span>`;
const cifra = (c) => `<div class="cifra"><span class="et">${c.tono ? punto(c.tono) : ''}${c.et}</span><span class="v${c.pintado ? ' pintado ' + c.pintado : ''}">${c.v}</span>${c.det ? `<span class="det">${c.det}</span>` : ''}${c.mk ? `<span class="mk">${c.mk}</span>` : ''}</div>`;
const stub = (lb, lines = 3) => `<div class="stub"><span class="lb">${lb}</span>${['w80', 'w60', 'w40'].slice(0, lines).map((w) => `<div class="bar ${w}"></div>`).join('')}</div>`;
const menuBtn = () => `<button class="btn sec" type="button" data-act="nav" data-n="Más acciones" aria-label="Más acciones">${ic('mas')}</button>`;
const pil = (p) => `<button class="pa ${p.tono}" type="button" aria-pressed="false" data-act="nav" data-n="${p.nav || 'Filtra la lista: ' + p.t}">${p.t}</button>`;

/* ═════════ marco de la pantalla simulada ═════════ */
function marco(inner, { etiqueta = 'Pantalla simulada', extra = '', medir = 'cab' } = {}) {
  return `<div class="marco-top"><span>${etiqueta}${extra}</span><span class="alto" id="alto" aria-live="polite" data-medir="${medir}"></span></div>
  <div class="pantalla${S.cel ? ' cel' : ''}" id="pantalla">${inner}</div>`;
}

function vistaSub() {

  let h = '', extra = '', cuerpo = '';
  if (c === 'boletas') {
    cuerpo = `<div class="cards4">${['Con su boleta · 18 de 24', 'Sin publicar · 6', 'Faltan por subir · 6', 'Firmaron · 9'].map((t) => `<div class="mini"><span class="et">${t.split(' · ')[0]}</span><span class="v">${t.split(' · ')[1]}</span></div>`).join('')}</div>${stub('El resto de la pantalla: filtros y lista de boletas')}`;
    const base = { titulo: 'Boletas de pago' };
    if (v === 'H') h = cab({ ...base, miga: miga(['Planilla', 'Boletas']), desc: 'La boleta oficial de cada persona, por periodo. Se sube, se revisa y recién entonces se publica.' });
    if (v === 'A') h = cab({ ...base, miga: miga(['Planilla', 'Boletas de pago']), desc: 'Sube, revisa y publica la boleta oficial de cada persona.', ayuda: 'boletas' });
    if (v === 'B') h = cab({ ...base, volver: volver('Planilla'), sobre: 'Planilla · Octubre 2026', desc: 'Sube, revisa y publica la boleta oficial de cada persona.', ayuda: 'boletas' });
    if (v === 'C') h = cab({ ...base, descPre: mvolver('Planilla'), desc: 'Sube, revisa y publica cada boleta.', ayuda: 'boletas' });
  }
  if (c === 'persona') {
    extra = ` · llegaste desde <select class="sel" id="selDesde" aria-label="De dónde llegaste a la ficha">${['Equipo', 'Desempeño', 'Incidencias'].map((x) => `<option ${x === d ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
    cuerpo = `<div class="cards4">${[['Marcas del periodo', '21'], ['Tardanzas', '2'], ['Faltas', '0'], ['Vacaciones', '8 días']].map((x) => `<div class="mini"><span class="et">${x[0]}</span><span class="v">${x[1]}</span></div>`).join('')}</div>${stub('El resto de la ficha: horario, ausencias, documentos')}`;
    const acc = btn('Descargar PDF', { k: '', fino: false }) + menuBtn();

    if (v === 'H') h = `<button class="volver-txt" type="button" data-act="nav" data-n="Volver (retrocede en el historial)">← Volver</button>` + cab({ ...base, desc: `${descA} ${ins('sueldo fijo', 'neutro', true)}<br><span style="font-size:.78rem">DNI ••••••••</span>` });
    if (v === 'A') h = cab({ ...base, miga: miga([d, 'Carla Rojas']), desc: descA, ayuda: 'persona' });
    if (v === 'B') h = cab({ ...base, volver: volver(d), sobre: 'Ficha de integrante', desc: descA, ayuda: 'persona' });
    if (v === 'C') h = cab({ ...base, descPre: mvolver(d), desc: 'Líder de equipo · Tienda TRU · ingresó 3 mar 2023', ayuda: 'persona' });
  }
  if (c === 'caso') {
    const acc = ins('Urgente', 'alerta') + ins('En revisión', 'info') + ins('Lo lleva DO', 'neutro', true);
    cuerpo = banner('info', 'info', 'Abrir esta ficha queda registrado (44.13) · se abrió 3 veces. Un reporte no es una falta.') +
      stub('Lo reportado · 14 oct 2026', 3) + stub('Seguimiento', 2);
    const base = { titulo: 'Reporte de hostigamiento', acc };
    if (v === 'H') h = volver('Casos') + cab({ ...base, sobre: 'Canal de integrantes · TRU · HOS-0012', desc: 'De Elena Paz (confidencial) · sobre Diego Mora · testigos: Gaby Ríos' });
    if (v === 'A') h = cab({ ...base, miga: miga(['Casos', 'HOS-0012']), desc: 'Canal de integrantes · TRU · reporte de Elena Paz (confidencial)', ayuda: 'caso' });
    if (v === 'B') h = cab({ ...base, volver: volver('Casos'), sobre: 'Canal de integrantes · TRU · HOS-0012', desc: 'Reporte de Elena Paz (confidencial) · sobre Diego Mora', ayuda: 'caso' });
    if (v === 'C') h = cab({ ...base, descPre: mvolver('Casos'), desc: 'HOS-0012 · TRU · reporte de Elena Paz (confidencial)', ayuda: 'caso' });
  }
  return marco(h + cuerpo, { extra, etiqueta: 'Pantalla simulada · ' + TABS.sub.casos.find((x) => x[0] === c)[1] }) + inventarioSub() + notasHTML();

const verTambien = (items) => `<nav class="vt" aria-label="Ver también"><span class="vl">Ver también:</span>${items.map((x, i) => `${i ? '<span class="sepp" aria-hidden="true">·</span>' : ''}<button type="button" data-act="nav" data-n="${x}">${x}</button>`).join('')}</nav>`;
const chipCtx = (t, n) => `<button class="chipctx" type="button" data-act="nav" data-n="${n || t}">${t} ${ic('flecha')}</button>`;

function vistaRel() { return S.caso.rel === 'horas' ? relHoras() : relCorr(); }

function drawerHTML(w) {

       <div style="display:flex;flex-direction:column;gap:0">${nav('Incidencias · de ' + P[0], 'Ver sus incidencias →')}${nav('Ficha de ' + P[0], 'Abrir su ficha →')}</div>`;

function relCorr() {
  const v = S.v.rel, p = S.personaCorr;

  if (p === 'carla') {

      : v === 'C' ? banner('ambar', 'alerta', tx, chipCtx('Revisar en Turnos', 'Turnos · 14 oct'))
      : banner('ambar', 'alerta', tx + 'Revísalo en Turnos.<span class="muted"> (hoy: texto sin enlace)</span>');

    aviso = v === 'A' ? banner('ambar', 'alerta', tx + nav('Horarios · Elena Paz', 'Cargarlo en Horarios →'))

  return marco(head + (v === 'B' ? verTambien(['Turnos', 'Horarios', 'Incidencias', 'Desempeño']) : '') + sel + aviso + tarj + stub('Marcas del día, corrección y motivo'), { etiqueta: 'Pantalla simulada · Corregir marcajes' }) + mapaRel() + notasHTML();

function mapaRel() {
  const R = [
    ['Desempeño', 'Correcciones', 'Botón «Abrir este día…» en el cajón del día', '<span class="etq inf">Visible</span> con persona y fecha'],

  return {
    cifras, pills, rot: 'Para cerrar', tot: { et: E.etTot, v: sol(TOT), det: 'sale de la cuenta ' + sol(BANCO), tono: null },
    pasos: P.map((p, i) => ({ t: p[0], d: p[1], e: i < act ? 'hecho' : i === act ? 'ahora' : 'luego' })),

  };
}

function franja(v, D) {
  if (v === 'A') return `<section class="cifras" aria-label="Resumen">${D.cifras.map(cifra).join('')}</section>` +
    (D.grupos ? `<div class="chiprow" aria-label="Estado de pago por grupo">${D.grupos.map((g) => g[1] ? ins(`${ic('ok')} ${g[0]} pagado`, 'ok', true) : ins(`${g[0]} pendiente`, 'neutro', true)).join('')}</div>` : '');
  if (v === 'B') {
    const p = D.pills.length ? D.pills.map(pil).join('') : `<span class="nada">${ic('ok')} Nada pendiente</span>`;
    return `<section class="atender franja-b" aria-label="${D.rot}"><span class="rot">${D.rot}</span>${p}
      <div class="tot"><span class="tl">${D.tot.tono ? punto(D.tot.tono) : ''}${D.tot.et}</span><b>${D.tot.v}</b><small>${D.tot.det}</small></div></section>`;
  }
  const est = { hecho: 'Hecho', ahora: 'Ahora', luego: 'Luego' };
  return `<ol class="pasos" aria-label="Pasos">${D.pasos.map((p, i) => `<li class="paso ${p.e}" ${p.e === 'ahora' ? 'aria-current="step"' : ''}><span class="nm" aria-hidden="true">${p.e === 'hecho' ? ic('ok') : i + 1}</span><span class="pt1">${p.t}</span><span class="est">${est[p.e]}</span><span class="pd">${p.d}</span></li>`).join('')}</ol>` +
    (D.grupos ? `<div class="chiprow">${D.grupos.map((g) => g[1] ? ins(`${ic('ok')} ${g[0]} pagado`, 'ok', true) : ins(`${g[0]} pendiente`, 'neutro', true)).join('')}</div>` : '');
}

function ctxPlanilla(E) {
  const H = [];
  if (E.bl >= 1) H.push(['Bruno Salas', 'Un día con la salida puesta por el sistema, sin confirmar', 'alerta', 'Frena el pago']);
  if (E.bl >= 2) H.push(['Elena Paz', 'Sin tramo de salario vigente', 'alerta', 'Frena el pago']);
  if (E.av >= 1) H.push(['Diego Mora', 'Marcó 3 días sin horario cargado', 'aviso', 'Avisa']);
  if (E.des) H.push(['Bruno Salas', `Lo pagado (${sol(1500)}) ya no coincide con lo de hoy (${sol(1562.5)}, +${sol(62.5)})`, 'aviso', 'Avisa']);
  const masAv = Math.max(0, E.av - (E.av >= 1 ? 1 : 0)), n2 = masAv + E.inf;
  const req = `<div class="req" id="req"><h3>Requiere atención</h3><ul>${H.map((h) => `<li><span class="q">${h[0]}</span>${ins(h[3], h[2])}<span class="r">${h[1]}</span></li>`).join('')}
    <li><span class="r muted">${n2 > 0 ? `y ${n2} más entre avisos e informativos` : 'nada más'}</span></li></ul></div>`;
  const pg = E.pag;
  const tabs = `<div class="ctx-tabs" aria-hidden="true">${GR.map((g, i) => `<span class="${i === 0 ? 'on' : ''}">${g[0]} (${g[1]})${pg[i] ? ' ' + ic('ok') : ''}</span>`).join('')}</div>`;
  const barra = `<div class="tarj" style="padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px;align-items:center;border-top-left-radius:0;border-top-right-radius:0;margin-top:-17px">
    <div style="min-width:0"><b>«Planilla» · 24 personas · ${sol(38400)}</b><br><span class="muted" style="font-size:.78rem">${pg[0] ? 'Pagado el 29 oct: lo transferido no cambia al corregir.' : 'Abierto: las cifras se recalculan con las horas registradas hasta que se confirme el pago.'}</span></div>
    ${pg[0] ? btn('Reabrir «Planilla»…', { k: 'sec', n: 'Reabrir «Planilla» (pide motivo)' }) : btn('Revisar cierre de «Planilla» →', { act: 'cierre' })}</div>`;
  const aviso = E.des ? banner('ambar', 'alerta', '<b>«Planilla» ya está pagado, pero su desglose dejó de coincidir con los datos de hoy.</b> Lo transferido no cambió: cambió lo que el sistema calcularía ahora.', btn('Recalcular y volver a pagar…', { k: 'sec fino', n: 'Volver a pagar (pide motivo)' })) : '';
  return req + aviso + tabs + barra;
}

function vistaDin() {
  const v = S.v.din, c = S.caso.din;
  let inner = '', extra = '', medir = 'cab';
  if (c === 'planilla') {
    const E = PLE[S.est];
    extra = ` · estado del mes <select class="sel" id="selEst" aria-label="Estado del mes">${Object.entries(PLE).map(([k, e]) => `<option value="${k}" ${k === S.est ? 'selected' : ''}>${e.n}</option>`).join('')}</select>`;
    const periodo = `<select class="sel g" aria-label="Periodo"><option>Octubre 2026</option></select>`;
    const linea = `28 sep → 28 oct · 31 días · ${ins(E.lect[0], E.lect[1])} ${E.linea}`;
    let h;
    if (v === 'H') {
      const pillsG = GR.map((g, i) => `<li><span class="pa" style="font-weight:500">${g[0]} ${E.pag[i] ? `<span style="color:var(--color-verde);display:inline-flex;gap:3px;align-items:center">${ic('ok')}pagado</span>` : '<span class="muted">pendiente</span>'}</span></li>`).join('');
      h = cab({ sobre: 'Planilla', titulo: 'Octubre 2026', desc: linea, acc: periodo + btn('+ Nuevo periodo', { k: 'sec' }) + btn('Boletas del periodo', { ico: 'recibo', n: 'Boletas del periodo' }) + menuBtn() }) +
        `<ul class="chiprow" style="list-style:none;margin:0;padding:0" aria-label="Estado de pago por grupo">${pillsG}</ul>
         <p class="foot-hoy">Base full-time: 201.5 h (6.5 h × 31 días) · feriados: 8 oct Combate de Angamos</p>
         <section class="cifras c4" aria-label="Resumen del periodo">${[
           { et: E.etTot + ' del periodo', v: sol(TOT), det: 'Sale de la cuenta ' + sol(BANCO) },
           { et: 'Personas en el periodo', v: '30', det: 'todas activas' },
           { et: 'Horas registradas', v: '4,860.5 h', det: S.est === 'encurso' ? 'hasta hoy · día 22 de 31' : 'del periodo' },
           { et: 'Personas por resolver', v: String(E.bl + E.av), det: E.bl ? `${E.bl} frenan el pago` : E.av ? 'ninguna frena el pago' : 'nada pendiente' },
         ].map(cifra).join('')}</section>`;
    } else {
      const D = dPlanilla();
      const prim = E.pag.every(Boolean) ? btn('Boletas del periodo', { ico: 'recibo', n: 'Boletas del periodo' }) : btn('Revisar cierre →', { act: 'cierre' });
      h = cab({ sobre: 'Planilla', titulo: 'Octubre 2026', desc: linea, ayuda: 'planilla', acc: periodo + btn('+ Nuevo periodo', { k: 'sec' }) + prim + menuBtn() }) + franja(v, D);
    }
    inner = `<div class="medir" data-medirbox style="display:flex;flex-direction:column;gap:16px"><div data-medirhead style="display:flex;flex-direction:column;gap:16px">${h}</div>${ctxPlanilla(E)}</div>` + stub('La tabla de personas del grupo', 3);
    medir = 'bloque';
  } else {
    const hoy = v === 'H';
    const D = PLAN_OTROS[c] ? PLAN_OTROS[c]() : null;
    let cuerpoHoy = '';
    if (hoy) {
      if (c === 'edu') cuerpoHoy = `<section class="atender" aria-label="Para atender"><span class="rot">Para atender</span>${PLAN_OTROS.edu().pills.map(pil).join('')}</section>`;
      else cuerpoHoy = `<section class="cifras c4" aria-label="Resumen">${HOY_CARDS[c].map(cifra).join('')}</section>`;
    }
    const franjaH = hoy ? cuerpoHoy : franja(v, D);
    const aviso = hoy && c === 'prov' ? banner('alerta', 'alerta', '<b>2 personas sin tramo de salario vigente:</b> sus reservas salen cortas o en cero, no porque no les toque.') : '';
    const avisoC = hoy && c === 'costos' ? banner('ambar', 'alerta', 'Un periodo de este año tiene el desglose reconstruido en vez de congelado el día del pago. Su cifra es la de hoy, no necesariamente la que se transfirió.') + `<p class="foot-hoy">Solo aparecen los periodos ya marcados como pagados: su desglose quedó congelado y ya no cambia. Lo que todavía está abierto se ve en Planilla, y es una proyección, no un costo. Los periodos de CAYLA no son meses calendario, así que cada fila es un periodo, no un mes.</p>` : '';
    inner = `<div class="medir" data-medirbox style="display:flex;flex-direction:column;gap:16px">${CAB_DIN[c](hoy)}${avisoC}${franjaH}${aviso}</div>` + stub('Lo que sigue: pestañas, filtros y tabla', 3);
    medir = 'bloque';
  }
  return marco(inner, { extra, etiqueta: 'Pantalla simulada · ' + TABS.din.casos.find((x) => x[0] === c)[1], medir }) + inventarioDin() + notasHTML();
}

    B: { t: 'B · Franja «Para cerrar» (la que se recomienda)', gana: ['Reutiliza <code>ParaAtender</code>, ya decidido para Asistencia y Educación: <b>un solo vocabulario</b> para «lo que falta resolver».', 'Una fila: lo que frena (rojo, con palabra), los avisos, los grupos por pagar y el total a la derecha. Es la que menos alto ocupa.', 'Las pastillas por grupo se van: las pestañas ya las repiten con ✓.', 'En celular el total baja a una segunda línea, bajo las pastillas.'], paga: ['Hay que mover «Boletas del periodo» al menú «…» mientras el periodo no esté pagado, y poner «Revisar cierre» como primario (es una decisión de producto).', 'La pastilla tiene que llevar al panel «Requiere atención» filtrado; hoy no hay ese vínculo.'], rompe: ['Si el rojo se usa para cualquier cosa, deja de significar «esto frena el pago». La regla: rojo = frena; ámbar = avisa; nada más.'] },
    C: { t: 'C · Pasos del cierre', gana: ['Dice <b>qué sigue</b>, en palabras: la mejor para quien cierra por primera vez.', 'Cada paso lleva número, ícono de hecho y palabra «Ahora».'], paga: ['Es la que más espacio gasta y no se generaliza: solo Planilla, Boletas y Liquidaciones tienen un proceso; en Provisiones, Costos y Educación se degrada a una línea de tiempo.', 'Introduce un orden (resolver → revisar → cerrar → boletas) que el sistema hoy no impone: hay que decidir si es una guía o una obligación.'], rompe: ['Si alguien cierra un grupo saltándose el paso «Revisar el total», la guía mintió. La confirmación del cierre sigue siendo la que protege.'] },
  },
};
const EXTRA = {
  sub: () => [
    ['Decisión', `<div class="dec"><div><b>Decidí</b>A como regla, con la ficha leyendo un <code>?desde=</code> (Equipo, Desempeño, Incidencias).</div><div><b>Descarté</b>B como regla única: suma dos filas (volver + sobretítulo) y el sobretítulo en mayúsculas compite con el título. C: en 375 px la descripción deja de ser una línea.</div><div><b>Se rompe si</b>alguien abre una ficha desde el buscador, que no manda <code>?desde=</code>: la miga debe caer en un padre por defecto honesto («Equipo») y nunca inventar el camino.</div></div>`],
    ['Contrato en tres líneas', `<ul><li><code>CabeceraPagina</code> recibe <code>miga: {texto, href?}[]</code>; el último eslabón no es enlace y lleva <code>aria-current="page"</code>.</li><li>Si hay miga, reemplaza al sobretítulo; lo que decía el sobretítulo pasa a la descripción.</li><li>Todo va con <code>print:hidden</code>: nunca sale en un papel.</li></ul>`],
    ['Objeción', `<p>La miga y el «volver» responden preguntas distintas: <i>dónde vive esta pantalla</i> y <i>de dónde vine</i>. Para Boletas son lo mismo; para la ficha de una persona (se abre desde cinco sitios) no. Poner una miga fija ahí sería la forma elegante de mentir. Por eso la recomendación es A <b>con padre dinámico</b>, no A a secas.</p>`],
    ['Política salarial: no es una subpantalla', `<p>Categorías, Versiones y Constancias son pestañas hermanas (<code>_subnav.tsx</code>), no hijas. Solo <code>versiones/[version]</code> es hija (de tres niveles). Hoy esa ruta usa un <code>&lt;h1&gt;</code> a mano de <code>text-xl</code> y dos textos distintos para volver («Volver» / «Volver a Versiones»).</p>`],
  ],
  rel: () => [
    ['Objeción', `<p>Casi toda la conexión <b>ya existe</b>. Lo que falla es que cuatro de ellas son texto plano o un <code>title</code> (tabla de abajo). Antes de diseñar una fila «Ver también», se arreglan esas cuatro: es más barato y es lo que la gente pierde. La fila B se justifica solo si, tras eso, sigue habiendo gente que no encuentra Turnos.</p>`],
    ['Lo que A no resuelve', `<p>Una integrante que no entiende por qué Correcciones muestra «Turno puntual». Eso es un problema de palabras, no de enlaces: se atiende en el ⓘ de Correcciones, no con otra cabecera.</p>`],
  ],
  nota: () => [
    ['La regla para decidir', `<p><b>Si la persona puede actuar mal sin haberla leído, es advertencia y va junto a la acción.</b> Si leerla solo la ayuda a entender, es información y va al ⓘ. Una nota mixta se parte en dos: la mitad que protege se queda.</p>`],
    ['Hallazgo del código', `<p>La pantalla de Ausencias no sabe si una fecha cae en un periodo pagado: lo averigua el servidor al rechazar. Mientras no lo sepa, la advertencia solo puede vivir como texto (en la ventana «Anular») y no como candado. Lo mismo vale para «+ Registrar ausencia».</p>`],
  ],
  din: () => [
    ['Qué se pliega al ⓘ y adónde', `<table class="tb"><thead><tr><th>Hoy en la cabecera</th><th>Pasa a</th></tr></thead><tbody>
      <tr><td data-l="Hoy">Base full-time · 201.5 h (6.5 h × 31 días)</td><td data-l="Pasa a">ⓘ «Cómo funciona la planilla»: es información; no decide a quién se le paga</td></tr>
      <tr><td data-l="Hoy">Feriados: 8 oct Combate de Angamos</td><td data-l="Pasa a">ⓘ (y el menú «Feriados del año…» que ya existe)</td></tr>
      <tr><td data-l="Hoy">Pastillas por grupo (4)</td><td data-l="Pasa a">Las pestañas ya las repiten con ✓; la franja dice «N grupos por pagar»</td></tr>
      <tr><td data-l="Hoy">Cifras «Personas» y «Horas»</td><td data-l="Pasa a">Detalle del total / ⓘ</td></tr>
      <tr><td data-l="Hoy">«Boletas del periodo» (primario)</td><td data-l="Pasa a">Menú «…» hasta que un grupo esté pagado; el primario es «Revisar cierre»</td></tr>
      <tr><td data-l="Se queda">Estado del periodo · qué frena · total · aviso de pago que ya no cuadra</td><td data-l="Se queda">Visible siempre</td></tr></tbody></table>`],
    ['Lo que ninguna variante cambia', `<ul><li>Ningún cálculo, ningún criterio de «frena / avisa / informa»: la maqueta solo cambia dónde se ven.</li><li>Cerrar un grupo y publicar boletas siguen pasando por una ventana de confirmación que dice <b>«no se paga dos veces»</b> y exige marcar una casilla. El botón queda desactivado con una razón escrita.</li><li>El número de una <code>Cifra</code> va siempre en tinta; el significado es el punto + la palabra.</li></ul>`],
    ['Objeción', `<p>El encabezado de Planilla hoy tiene como botón primario <b>«Boletas del periodo»</b>, pero esas boletas «se suben cuando el periodo cierra». El paso siguiente real casi siempre es cerrar, y el cierre vive en una barra bajo las pestañas, más abajo. En las variantes A, B y C el primario cambia según el estado del mes (pruébalo con el selector): es la decisión de producto que más pesa y no la pediste.</p>`],
    ['Hallazgos del código que no son de diseño', `<ul><li><b>Liquidaciones</b> pinta de rojo y ámbar el <i>número</i> de <code>ResumenCifra</code>, lo que el ADR 0004 (decisión 2) descartó; la cifra «Vencidas» solo existe como número, y las vencidas viven en su pestaña.</li><li><b>Boletas</b> define una función <code>Cifra</code> local, distinta de <code>components/ui/cifra</code>. <b>Costos</b> y <b>Feriados</b> escriben su <code>&lt;h1&gt;</code> a mano; <b>Costos</b> escribe 5 casillas a mano.</li><li>El ⓘ tiene <b>cuatro formas</b> fuera de <code>AyudaPantalla</code>: <code>&lt;details&gt;</code> en Liquidaciones, acordeón en Provisiones, botón + modal en Objetivos y <code>AyudaDeSeguros</code>.</li><li>Las pastillas de estado por grupo de Planilla duplican la información de las pestañas.</li></ul>`],
  ],
};
function notasHTML() {
  const v = S.v[S.tab], d = NV[S.tab][v];
  const li = (a) => a.map((x) => `<li>${x}</li>`).join('');
  const ex = EXTRA[S.tab]().map((e) => `<details><summary>${e[0]}</summary><div class="in"><div class="ancho">${e[1]}</div></div></details>`).join('');
  return `<section class="notas" aria-label="Notas"><details><summary>Notas de la variante · ${d.t}: qué gana, qué paga, qué se rompe si</summary><div class="in">
    <div><h4>Qué gana</h4><ul>${li(d.gana)}</ul></div><div><h4>Qué paga</h4><ul>${li(d.paga)}</ul></div><div><h4>Se rompe si</h4><ul>${li(d.rompe)}</ul></div></div></details>${ex}</section>`;
}

/* ═════════ ventanas ═════════ */
function shell(titulo, cuerpo, pie) {
  return `<div class="vel" data-act="cerrar-modal"></div><div class="modal" role="dialog" aria-modal="true" aria-label="${titulo}"><header><h2>${titulo}</h2><button class="x" type="button" data-act="cerrar-modal" aria-label="Cerrar">${ic('x')}</button></header>${cuerpo}<div class="pie">${pie}</div></div>`;
}
function ayudaDe(k) {
  const a = JSON.parse(JSON.stringify(AY[k])), v = S.v[S.tab];
  if (S.tab === 'rel' && v === 'A' && a.rel) a.relOn = true;
  if (S.tab === 'nota' && k === 'ausencias') {
    const ps = 'No se puede registrar ni anular nada dentro de un periodo de planilla ya pagado: hay que reabrirlo primero, igual que con todo lo demás que toca plata.';
    if (v === 'H') a.sec.push(['Periodo pagado', ps]);
    if (v === 'A') a.sec.push(['No se borra', 'Una ausencia no se borra: se anula con motivo y queda en el historial.']);
    if (v === 'B' || v === 'C') a.sec.push(['No se borra', 'Una ausencia no se borra: se anula con motivo y queda en el historial.'], ['Periodo pagado', ps]);
  }
  if (S.tab === 'nota' && k === 'horarios' && (v === 'B' || v === 'C')) a.sec.push(['Vigente desde', FOOT_HOR.replace(/<\/?b>/g, '')]);
  return a;
}
function modalAyuda(k) {
  const a = ayudaDe(k);
  const rel = a.relOn ? `<div><dt>Relacionadas</dt><dd><ul class="rel-l">${a.rel.map((r) => `<li><button type="button" data-act="nav" data-n="${r[2]}"><b>${r[0]}</b><span>${r[1]}</span></button></li>`).join('')}</ul></dd></div>` : '';
  return shell(a.titulo, `<p class="muted" style="font-size:.9rem">${a.intro}</p><dl>${a.sec.map((s) => `<div><dt>${s[0]}</dt><dd>${s[1]}</dd></div>`).join('')}${rel}</dl>`, `<button class="btn" type="button" data-act="cerrar-modal">Entendido</button>`);
}
function modalAnular(id) {
  const a = AUS.find((x) => x.id === id);
  return shell('Anular ausencia', `<p class="muted" style="font-size:.9rem">Vas a anular «${a.t}» de ${a.n} (${a.f}). No se borra: queda en el historial con el motivo.</p>
    <label class="campo">¿Por qué se anula? (obligatorio)<textarea id="motivo" rows="2" placeholder="ej. se registró el tipo equivocado"></textarea></label>`,
    `<button class="btn sec" type="button" data-act="cerrar-modal">Cancelar</button><button class="btn peligro" type="button" data-act="anular-ok" data-id="${id}">Anular</button>`);
}
function modalCierre() {
  const E = PLE[S.est], bl = E.bl > 0;
  const cuerpo = `<div class="resumen-cierre"><div><span>Personas</span><b>24</b></div><div><span>Total del grupo «Planilla»</span><b>${sol(38400)}</b></div><div><span>Sale de la cuenta</span><b>${sol(34100)}</b></div></div>
    ${bl ? banner('alerta', 'alerta', `<b>${E.bl} personas frenan el pago.</b> Resuélvelas primero: hasta entonces el cierre no se puede confirmar.`) : ''}
    ${S.est === 'encurso' ? banner('ambar', 'reloj', '<b>El periodo aún no termina</b> (día 22 de 31): las cifras seguirán cambiando hasta el 28 oct.') : ''}
    ${banner('ambar', 'candado', '<b>No se paga dos veces.</b> Al confirmar se congela el desglose de «Planilla». Quien cesó este mes y ya cobró su liquidación no se transfiere otra vez: usa «Ya le pagué aparte». Para corregir después hay que reabrir el grupo, con motivo.')}
    <label class="chk"><input type="checkbox" id="chkOk" ${bl ? 'disabled' : ''}><span>Revisé el total de <b>${sol(38400)}</b> y entiendo que no se vuelve a pagar este mes.</span></label>
    ${bl ? '<p class="muted" style="font-size:.8rem">«Confirmar cierre» está desactivado porque hay personas que frenan el pago.</p>' : ''}`;
  return shell('Revisar cierre de «Planilla»', cuerpo, `<button class="btn sec" type="button" data-act="cerrar-modal">Cancelar</button><button class="btn" type="button" id="btnCierre" data-act="cierre-ok" disabled>Confirmar cierre</button>`);
}
function modalPublicar() {
  const cuerpo = `<div class="resumen-cierre"><div><span>Periodo</span><b>Octubre 2026</b></div><div><span>Boletas a publicar</span><b>6</b></div></div>
    ${banner('info', 'info', 'La persona no ve su boleta hasta que la publiques. Al publicar, la ve.')}
    ${banner('ambar', 'candado', '<b>Revisa antes.</b> Cada boleta debe ser de su persona y de este periodo.')}
    <label class="chk"><input type="checkbox" id="chkOk"><span>Revisé las 6 boletas: cada una corresponde a su persona y a Octubre 2026.</span></label>`;
  return shell('Publicar 6 boletas', cuerpo, `<button class="btn sec" type="button" data-act="cerrar-modal">Cancelar</button><button class="btn" type="button" id="btnCierre" data-act="publicar-ok" disabled>Publicar 6 boletas</button>`);
}
let tt;
function toast(txt, err) {
  clearTimeout(tt);
  $('#toast-capa').innerHTML = `<div class="toast${err ? ' err' : ''}" role="status"><span>${txt}</span><button type="button" data-act="cerrar-toast">Cerrar</button></div>`;
  tt = setTimeout(() => { $('#toast-capa').innerHTML = ''; }, 6000);
}

/* ═════════ render ═════════ */
function render() {
  $('#tabs').innerHTML = Object.entries(TABS).map(([k, t]) => `<button type="button" role="tab" aria-selected="${k === S.tab}" data-tab="${k}">${t.n}<small>${t.s}</small></button>`).join('');
  const T = TABS[S.tab];
  $('#fila2').innerHTML = `<span class="rotc">Variante</span><div class="vars" role="group" aria-label="Variantes">${T.vars.map((x) => `<button type="button" class="vbtn${x[2] === 'ref' ? ' ref' : ''}" data-var="${x[0]}" aria-pressed="${S.v[S.tab] === x[0]}">${x[2] === 'ref' ? '<b>•</b>' : `<b>${x[0]}</b>`}${x[1]}${x[2] === 'rec' ? ' <span class="rec">★ recomendada</span>' : ''}</button>`).join('')}</div>
    <span class="rotc">Caso</span><div class="caso" role="group" aria-label="Casos">${T.casos.map((x) => `<button type="button" data-caso="${x[0]}" aria-pressed="${S.caso[S.tab] === x[0]}">${x[1]}</button>`).join('')}</div>`;
  $('#lema').innerHTML = T.lema;
  $('#app').innerHTML = { sub: vistaSub, rel: vistaRel, nota: vistaNota, din: vistaDin }[S.tab]();
  renderCapa();
  medir();
}
function renderCapa() {
  let h = '';
  if (S.drawer) h += drawerHTML(S.drawer);
  if (S.modal) {
    const m = S.modal;
    h += m.t === 'ayuda' ? modalAyuda(m.k) : m.t === 'anular' ? modalAnular(m.id) : m.t === 'cierre' ? modalCierre() : m.t === 'publicar' ? modalPublicar() : '';
  }
  $('#capa').innerHTML = h;
  const f = $('#capa .modal [data-act="cerrar-modal"].x, #capa .cajon .x'); if (f) f.focus();
}
function medir() {
  const el = $('#alto'); if (!el) return;
  requestAnimationFrame(() => {
    const p = $('#pantalla'); let h = 0, txt = '';
    if (S.tab === 'sub') { const c = p.querySelector('.cab'); h = c.getBoundingClientRect().bottom - p.firstElementChild.getBoundingClientRect().top; txt = `Alto de la cabecera en esta maqueta: ${Math.round(h)} px`; }
    else if (S.tab === 'din') { const b = p.querySelector('[data-medirbox]'); h = b.getBoundingClientRect().height; const hd = p.querySelector('[data-medirhead]'); txt = hd ? `Cabecera + franja: ${Math.round(hd.getBoundingClientRect().height)} px · hasta que empieza la tabla: ${Math.round(h)} px (en esta maqueta)` : `Cabecera + franja: ${Math.round(h)} px (en esta maqueta)`; }
    else { el.style.display = 'none'; return; }
    el.style.display = ''; el.textContent = txt;
  });
}

/* ═════════ eventos ═════════ */
document.addEventListener('click', (e) => {
  let b;
  if ((b = e.target.closest('[data-tab]'))) { S.tab = b.dataset.tab; S.modal = S.drawer = null; render(); window.scrollTo({ top: 0 }); return; }
  if ((b = e.target.closest('[data-var]'))) { S.v[S.tab] = b.dataset.var; S.modal = S.drawer = null; render(); return; }
  if ((b = e.target.closest('[data-caso]'))) { S.caso[S.tab] = b.dataset.caso; S.modal = S.drawer = null; render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'nav') { if (S.modal && S.modal.t === 'ayuda') S.modal = null; S.drawer = null; renderCapa(); toast(`Maqueta: aquí se abriría «${el.dataset.n}».`); return; }
  if (a === 'ayuda') { S.modal = { t: 'ayuda', k: el.dataset.k }; renderCapa(); return; }
  if (a === 'cerrar-modal') { S.modal = null; renderCapa(); return; }
  if (a === 'cerrar') { S.drawer = null; renderCapa(); return; }
  if (a === 'cerrar-toast') { $('#toast-capa').innerHTML = ''; return; }
  if (a === 'drawer') { S.drawer = el.dataset.w; renderCapa(); return; }
  if (a === 'anular') { S.modal = { t: 'anular', id: el.dataset.id }; renderCapa(); return; }
  if (a === 'anular-ok') {
    const m = $('#motivo').value.trim(); if (!m) { $('#motivo').focus(); toast('Escribe el motivo: es obligatorio.', true); return; }
    const x = AUS.find((r) => r.id === el.dataset.id); S.modal = null; renderCapa();
    if (x.pago) toast(`No se pudo anular la ausencia: el periodo de ${x.per} ya está pagado. Reábrelo primero en Planilla. <i>(mensaje de ejemplo)</i>`, true);
    else toast('Maqueta: la ausencia se anularía. No se guardó nada.');
    return;
  }
  if (a === 'guardar-h') { toast('Maqueta: el horario se guardaría desde hoy. No se guardó nada.'); return; }
  if (a === 'cierre') { S.modal = { t: 'cierre' }; renderCapa(); return; }
  if (a === 'publicar') { S.modal = { t: 'publicar' }; renderCapa(); return; }
  if (a === 'cierre-ok' || a === 'publicar-ok') { S.modal = null; renderCapa(); toast('Maqueta: no se cerró ni se publicó nada, y no se pagó a nadie.'); return; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'selTema') { if (t.value === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t.value); return; }
  if (t.id === 'selAncho') { S.cel = t.value === 'cel'; render(); return; }
  if (t.id === 'selDesde') { S.desde = t.value; render(); return; }
  if (t.id === 'selEst') { S.est = t.value; render(); return; }
  if (t.id === 'selPers') { S.personaCorr = t.value; render(); return; }
  if (t.id === 'chkOk') { const b = $('#btnCierre'); if (b) b.disabled = !t.checked; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.modal) { S.modal = null; renderCapa(); } else if (S.drawer) { S.drawer = null; renderCapa(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act="drawer"]')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('resize', medir);
render();
})();
</script>
</body>
</html>
