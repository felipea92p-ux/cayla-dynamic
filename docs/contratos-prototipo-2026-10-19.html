<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratos — prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<!--
  Prototipo de «Contratos» (/admin/contratos), 2026-10-19. Tres formas de leer la misma pantalla.

  NO es código de la app y no toca ninguna base. Datos ficticios (nombres y montos inventados; sin DNI).
  «Hoy» es el lunes 19 de octubre de 2026.

  Lo que NO cambia en ninguna variante (reglas de CLAUDE.md, de permisos.ts y de las migraciones):
    · quién entra: solo DO y dirección (puedeGestionarContratos = admin + lider_do; RLS contratos_lectura);
      la líder de equipo no ve esta pantalla, solo su propio contrato en «Lo mío»;
    · el art. 77 (fn_contratos_desnaturalizados, 0231): quien marca DESPUÉS de la fecha de fin de su contrato
      a plazo queda como indefinido por ley. Se detecta con los marcajes; el sistema avisa, nunca decide;
    · «firmado» = fecha_firma (0430): la integrante confirma su firma en /mio/contrato, o DO sube el escaneo;
      un escaneo posterior NO mueve la fecha de firma;
    · un borrador se corrige en su sitio (fn_contrato_editar); uno firmado no se edita nunca: se anula o se
      modifica con un adendum; anular exige motivo y no borra;
    · un borrador por tipo y persona, y sin periodos que se pisen (0388): lo hace cumplir la base;
    · la copia al colaborador (cláusula décima octava) se anota con fecha; el MTPE ya no es trámite (0470);
    · el generador (5 pasos, ~25 candados, texto de contrato-texto.ts) queda tal cual: es otra pantalla.
  Colores: tokens de globals.css, claro y oscuro. Ningún estado va solo en color: lleva ícono y palabra.
-->
<style>
  :root{
    --color-crema:#f5f0e8; --color-papel:#fbf8f2; --color-tinta:#1a1a18;
    --color-rojo:#b8412d; --color-rojo-profundo:#8b2a1f; --color-sand:#e8e0d0; --color-taupe:#805c4c;
    --color-hueso:#eae1d2; --color-pizarra:#4c5d6e; --color-verde:#48603f;
    --color-ambar:#74501a; --color-azul:#2f5f9e; --color-ceniza:#635f58;
    --font-sans:'DM Sans', ui-sans-serif, system-ui, sans-serif;
    --font-serif:'EB Garamond', ui-serif, Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
      --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
      --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
      --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
    --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
    --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
    --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; max-width:100%; }
  body{ background:var(--color-crema); color:var(--color-tinta); font-family:var(--font-sans); font-size:14.5px; line-height:1.5; }
  h1,h2,h3,h4{ font-family:var(--font-serif); font-weight:600; margin:0; text-wrap:balance; }
  p{ margin:0; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--color-rojo); outline-offset:2px; }
  .oculto{ display:none !important; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  svg.i{ width:1em; height:1em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.12em; }

  /* ── barra del prototipo (no es parte de la pantalla) ── */
  .proto{ position:sticky; top:0; z-index:50; background:var(--color-papel); border-bottom:1px solid var(--color-sand); padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .proto .vars{ display:flex; flex-wrap:wrap; gap:6px; }
  .vbtn{ border:1px solid var(--color-sand); background:var(--color-crema); border-radius:10px; padding:6px 11px; font-weight:600; font-size:.82rem; display:inline-flex; gap:7px; align-items:center; }
  .vbtn b{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--color-hueso); color:var(--color-taupe); font-size:.76rem; }
  .vbtn[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); border-color:var(--color-tinta); }
  .vbtn[aria-pressed="true"] b{ background:var(--color-crema); color:var(--color-tinta); }
  .vbtn small{ font-weight:500; opacity:.8; }
  .ctlbox{ display:contents; }
  .ctlbox > summary{ display:none; }
  .proto .ctl{ display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-left:auto; font-size:.78rem; color:var(--color-taupe); }
  .proto label{ display:inline-flex; gap:6px; align-items:center; }
  .proto select{ background:var(--color-hueso); border:1px solid var(--color-sand); border-radius:8px; padding:4px 8px; max-width:100%; }
  .demo-badge{ font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 14%, var(--color-papel)); border:1px solid color-mix(in oklab, var(--color-pizarra) 30%, transparent); border-radius:999px; padding:3px 10px; }
  .lema{ padding:10px 16px 0; max-width:1240px; margin-inline:auto; color:var(--color-taupe); font-size:.84rem; }
  .lema strong{ color:var(--color-tinta); }

  /* ── la pantalla ── */
  .page{ max-width:1240px; margin-inline:auto; padding:18px 16px 80px; display:flex; flex-direction:column; gap:14px; }
  .cab{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 18px; align-items:flex-start; }
  .cab .sobre{ display:flex; align-items:center; gap:14px; font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--color-taupe); margin-bottom:6px; }
  .cab .sobre::before{ content:""; width:36px; height:1px; background:var(--color-taupe); flex:none; }
  .cab h1{ font-size:1.75rem; font-weight:500; line-height:1.15; letter-spacing:-.01em; }
  .cab .desc{ color:var(--color-taupe); margin-top:4px; font-size:.9rem; max-width:44rem; }
  .ayb{ margin:-6px 0 -6px 2px; width:32px; height:32px; flex:none; border:0; background:none; border-radius:999px; color:var(--color-taupe); display:inline-grid; place-items:center; font-size:1.25rem; vertical-align:middle; }
  .ayb:hover{ background:color-mix(in oklab, var(--color-sand) 60%, transparent); color:var(--color-tinta); }
  .acciones{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btn{ border:1px solid var(--color-tinta); background:var(--color-tinta); color:var(--color-crema); border-radius:8px; padding:7px 13px; font-weight:600; font-size:.84rem; min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; }
  .btn.sec{ background:transparent; color:var(--color-tinta); border-color:var(--color-taupe); }
  .btn.sutil{ background:transparent; border-color:transparent; color:var(--color-taupe); }
  .btn.peligro{ background:transparent; color:var(--color-rojo-profundo); border-color:color-mix(in oklab, var(--color-rojo) 50%, var(--color-sand)); }
  .btn.fino{ min-height:30px; padding:4px 10px; font-size:.78rem; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .bi{ width:32px; height:32px; border-radius:8px; border:1px solid var(--color-sand); background:var(--color-papel); color:var(--color-taupe); display:inline-grid; place-items:center; flex:none; }
  .bi:hover{ border-color:var(--color-taupe); color:var(--color-tinta); }
  .ins{ display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:600; padding:2px 8px; border-radius:100px; white-space:nowrap; }
  .ins.adv{ color:var(--color-ambar); background:color-mix(in oklab, var(--color-ambar) 15%, var(--color-papel)); }
  .ins.alerta{ color:var(--color-rojo-profundo); background:color-mix(in oklab, var(--color-rojo) 10%, var(--color-papel)); }
  .ins.neutro{ color:var(--color-ceniza); background:color-mix(in oklab, var(--color-ceniza) 12%, var(--color-papel)); }
  .ins.ok{ color:var(--color-verde); background:color-mix(in oklab, var(--color-verde) 15%, var(--color-papel)); }
  .ins.info{ color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 15%, var(--color-papel)); }
  .muted{ color:var(--color-taupe); }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.ok{ background:var(--color-verde); } .dot.falta{ background:var(--color-rojo); } .dot.warn{ background:var(--color-ambar); } .dot.neutro{ background:var(--color-ceniza); } .dot.info{ background:var(--color-pizarra); }
  .rel{ display:inline-flex; gap:6px; align-items:center; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* Para atender */
  .atender{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .atender .rot{ font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--color-taupe); }
  .atender .nada{ font-size:.86rem; color:var(--color-verde); display:inline-flex; gap:6px; align-items:center; }
  .pa{ display:inline-flex; align-items:center; gap:6px; border-radius:999px; border:1px solid; padding:5px 12px; font-size:.78rem; font-weight:600; font-variant-numeric:tabular-nums; background:var(--color-papel); }
  .pa.rojo{ border-color:color-mix(in oklab, var(--color-rojo) 30%, transparent); background:color-mix(in oklab, var(--color-rojo) 10%, var(--color-papel)); color:var(--color-rojo-profundo); }
  .pa.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 15%, var(--color-papel)); color:var(--color-ambar); }
  .pa.pizarra{ border-color:color-mix(in oklab, var(--color-pizarra) 40%, transparent); background:color-mix(in oklab, var(--color-pizarra) 12%, var(--color-papel)); color:var(--color-pizarra); }
  .pa[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--color-tinta); }

  /* buscador, Filtros y pestañas */
  .barra{ display:flex; gap:8px; align-items:center; position:relative; flex-wrap:wrap; }
  .busca{ flex:1 1 220px; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--color-hueso); border:1px solid var(--color-taupe); border-radius:8px; padding:0 10px; min-height:38px; color:var(--color-taupe); }
  .busca input{ flex:1; min-width:0; border:0; background:none; outline:0; padding:8px 0; color:var(--color-tinta); }
  .busca:focus-within{ outline:2px solid var(--color-rojo); outline-offset:2px; }
  .btn-filtros b{ background:var(--color-tinta); color:var(--color-crema); border-radius:100px; min-width:18px; height:18px; display:inline-grid; place-items:center; font-size:.7rem; padding:0 5px; }
  .pop{ position:absolute; top:44px; left:0; z-index:20; width:min(320px,100%); background:var(--color-papel); border:1px solid var(--color-sand); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.18); padding:14px; display:flex; flex-direction:column; gap:12px; }
  .pop label.f{ display:flex; flex-direction:column; gap:4px; font-size:.8rem; color:var(--color-taupe); }
  .pop select, .fld select, .fld input, .fld textarea{ background:var(--color-papel); border:1px solid var(--color-taupe); border-radius:8px; padding:8px 10px; min-height:38px; color:var(--color-tinta); width:100%; }
  .fld textarea{ resize:vertical; }
  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--color-sand); overflow-x:auto; }
  .tab{ border:0; background:none; border-bottom:2px solid transparent; padding:9px 12px; font-size:.88rem; color:var(--color-taupe); white-space:nowrap; margin-bottom:-1px; }
  .tab b{ margin-left:6px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tab:hover{ color:var(--color-tinta); }
  .tab[aria-current="page"]{ color:var(--color-tinta); font-weight:600; border-bottom-color:var(--color-tinta); }
  .conteo{ margin-left:auto; font-size:.78rem; color:var(--color-taupe); font-variant-numeric:tabular-nums; }

  /* avisos, estados vacíos */
  .aviso{ border-radius:12px; border:1px solid; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .aviso.rojo{ border-color:color-mix(in oklab, var(--color-rojo) 30%, transparent); background:color-mix(in oklab, var(--color-rojo) 6%, var(--color-papel)); }
  .aviso.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 7%, var(--color-papel)); }
  .aviso .tit{ font-weight:700; display:flex; gap:7px; align-items:flex-start; }
  .aviso .tit svg{ margin-top:.25em; }
  .aviso.rojo .tit{ color:var(--color-rojo-profundo); } .aviso.ambar .tit{ color:var(--color-ambar); }
  .aviso .acc{ display:flex; flex-wrap:wrap; gap:6px; }
  .aviso ul{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:3px; }
  .enlinea{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; border-radius:8px; border:1px solid color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 8%, var(--color-papel)); padding:7px 11px; font-size:.84rem; color:var(--color-ambar); }
  .enlinea.info{ border-color:color-mix(in oklab, var(--color-pizarra) 40%, transparent); background:color-mix(in oklab, var(--color-pizarra) 8%, var(--color-papel)); color:var(--color-pizarra); }
  .vacio{ border:1px dashed var(--color-taupe); border-radius:16px; padding:36px 20px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; background:var(--color-papel); }
  .vacio h3{ font-size:1.2rem; } .vacio p{ color:var(--color-taupe); max-width:34rem; }
  .esq{ border:1px solid var(--color-sand); border-radius:14px; background:var(--color-papel); }
  .esq i{ display:block; height:48px; border-top:1px solid var(--color-sand); position:relative; overflow:hidden; }
  .esq i:first-child{ border-top:0; }
  .esq i::after{ content:""; position:absolute; left:16px; top:16px; height:14px; width:30%; border-radius:6px; background:var(--color-sand); }

  /* avatar */
  .av{ width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:var(--font-serif); font-size:1.1rem; font-weight:600; color:var(--color-rojo-profundo); background:color-mix(in oklab, var(--color-rojo) 12%, var(--color-papel)); }
  .av.g{ width:48px; height:48px; font-size:1.5rem; }

  /* A · tabla */
  .tabla-wrap{ border:1px solid var(--color-sand); border-radius:14px; background:var(--color-papel); overflow:hidden; }
  table.tb{ width:100%; border-collapse:collapse; }
  .tb th{ text-align:left; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--color-taupe); background:var(--color-hueso); padding:9px 14px; }
  .tb td{ border-top:1px solid var(--color-sand); padding:9px 14px; vertical-align:middle; }
  .tb tbody tr{ cursor:pointer; }
  .tb tbody tr:hover{ background:color-mix(in oklab, var(--color-hueso) 60%, var(--color-papel)); }
  .tb .quien{ display:flex; align-items:center; gap:11px; min-width:0; }
  .tb .quien .nm{ min-width:0; }
  .nombre{ font-weight:600; background:none; border:0; padding:0; text-align:left; }
  .nombre:hover{ text-decoration:underline; }
  .sub{ display:block; font-size:.78rem; color:var(--color-taupe); }
  .num{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tb td.act{ text-align:right; white-space:nowrap; width:1%; }
  .solo-cel, .solo-cel-b{ display:none; }

  /* B/C · grupos */
  .grupos{ display:flex; flex-direction:column; gap:12px; }
  .grupo{ border:1px solid var(--color-sand); border-radius:14px; background:var(--color-papel); overflow:hidden; }
  .gh{ width:100%; display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--color-hueso); border:0; text-align:left; min-height:48px; }
  .gh .cod{ font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.03em; }
  .gh .nom{ color:var(--color-taupe); }
  .gh .res{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:.8rem; color:var(--color-taupe); text-align:right; }
  .gh .res b{ color:var(--color-tinta); font-variant-numeric:tabular-nums; }
  .gh .fl{ transition:transform .15s; }
  .gh[aria-expanded="false"] .fl{ transform:rotate(-90deg); }
  ul.lp{ list-style:none; margin:0; padding:0; }
  .pl{ border-top:1px solid var(--color-sand); display:grid; align-items:center; gap:4px 14px; padding:10px 14px; cursor:pointer; }
  .pl:hover{ background:color-mix(in oklab, var(--color-hueso) 60%, var(--color-papel)); }
  .pl .nm{ display:flex; align-items:center; gap:11px; min-width:0; }
  .pl .nm b{ font-weight:600; display:block; }
  .pl .nm .t{ min-width:0; }
  .pl .acc-c{ display:flex; justify-content:flex-end; gap:6px; align-items:center; }
  /* B: barra de vigencia */
  .vB .pl{ grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) auto; grid-template-areas:"nm vig acc"; }
  .vB .pl .nm{ grid-area:nm; } .vB .pl .vig{ grid-area:vig; } .vB .pl .acc-c{ grid-area:acc; }
  .vig .lin{ display:flex; flex-wrap:wrap; gap:2px 10px; align-items:center; justify-content:space-between; font-size:.8rem; margin-bottom:5px; }
  .vig .lin .tx{ color:var(--color-taupe); }
  .barra-v{ display:flex; align-items:center; gap:3px; }
  .bv{ position:relative; flex:1; height:8px; border-radius:99px; background:var(--color-sand); overflow:hidden; }
  .bv > i{ position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--color-taupe); }
  .bv > u{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--color-tinta); }
  .bv.aviso-v > i{ background:var(--color-ambar); } .bv.mal > i{ background:var(--color-rojo); } .bv.bien > i{ background:var(--color-verde); }
  .bv.sinfin{ background:repeating-linear-gradient(90deg, var(--color-sand) 0 6px, transparent 6px 10px); }
  .bv.punteada{ background:none; border:1px dashed var(--color-taupe); }
  .pasado{ width:38px; height:8px; border-radius:0 99px 99px 0; flex:none; background:repeating-linear-gradient(135deg, var(--color-rojo) 0 3px, transparent 3px 6px); }
  /* C: bandas por urgencia */
  .vC .pl{ grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 124px 124px; grid-template-areas:"nm tiempo insc acc"; }
  .vC .pl .nm{ grid-area:nm; } .vC .pl .tiempo{ grid-area:tiempo; } .vC .pl .insc{ grid-area:insc; } .vC .pl .acc-c{ grid-area:acc; }
  .vC .gh .tit-b{ font-weight:700; font-family:var(--font-serif); font-size:1.08rem; }
  .vC .gh .cuenta{ background:var(--color-tinta); color:var(--color-crema); border-radius:100px; min-width:20px; height:20px; display:inline-grid; place-items:center; font-size:.72rem; font-weight:700; padding:0 6px; }
  .racimo{ padding:7px 14px; border-top:1px solid var(--color-sand); background:color-mix(in oklab, var(--color-ambar) 9%, var(--color-papel)); color:var(--color-ambar); font-size:.82rem; display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .fechah{ padding:6px 14px; border-top:1px solid var(--color-sand); background:color-mix(in oklab, var(--color-hueso) 45%, var(--color-papel)); font-size:.74rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--color-taupe); display:flex; gap:8px; align-items:center; }

  /* cajón / hoja */
  .velo{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; }
  .cajon{ position:fixed; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--color-papel); border-left:1px solid var(--color-sand); z-index:61; display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(0,0,0,.2); animation:entra .18s ease-out; }
  @keyframes entra{ from{ transform:translateX(24px); opacity:.4; } to{ transform:none; opacity:1; } }
  @keyframes sube{ from{ transform:translateY(24px); opacity:.4; } to{ transform:none; opacity:1; } }
  .cajon.quieto{ animation:none !important; }
  @media (prefers-reduced-motion: reduce){ .cajon{ animation:none !important; } }

/* ═════════ reglas (espejo de fn_contratos_tablero 0491 y del cliente) ═════════ */
const vivos = (p) => p.docs.filter((d) => !d.anulado).sort((x, y) => (y.gen > x.gen ? 1 : y.gen < x.gen ? -1 : 0));
const docVig = (p) => vivos(p)[0] ?? null;
// La fecha que gobierna: para una practicante nunca pasa del tope de 12 meses desde que ingresó (0336).
function finEf(p) {
  if (p.vinc !== 'practicante') return p.fin;
  const tope = masMeses(p.ing, 12);
  return p.fin ? (p.fin < tope ? p.fin : tope) : tope;
}
function estado(p) {
  if (S.datos === 'aldia') return 'ok';
  const u = docVig(p), f = finEf(p);
  if (p.dm > 0) return 'desnaturalizado';
  if (!u) return 'sin_contrato';
  if (!u.firma) return 'sin_firmar';
  if (u.tipo === 'indefinido') return u.copia ? 'ok' : 'tramite_pendiente';
  if (!f) return 'sin_vencimiento';
  if (f < HOY) return 'vencido';
  if (dias(HOY, f) <= S.vent) return 'por_vencer';
  return u.copia ? 'ok' : 'tramite_pendiente';
}
const enPapel = (p) => estado(p) === 'sin_contrato' && !!p.fin;
const cuentaAtencion = (p) => { const e = estado(p); if (e === 'ok') return false; if (S.papel === 'propuesta' && enPapel(p)) return false; return true; };
const esVigente = (p) => { const e = estado(p); return e === 'ok' || e === 'sin_vencimiento' || (S.papel === 'propuesta' && enPapel(p)); };
const grave = (p) => ['desnaturalizado', 'vencido'].includes(estado(p));
const META = {
  desnaturalizado: { cls: 'alerta', i: 'alerta', t: 'Riesgo art. 77' },
  vencido: { cls: 'alerta', i: 'reloj', t: 'Vencido' },
  por_vencer: { cls: 'adv', i: 'reloj', t: 'Vence pronto' },
  sin_firmar: { cls: 'info', i: 'firma', t: 'Sin firmar' },
  sin_contrato: { cls: 'info', i: 'doc', t: 'Sin registrar' },
  papel: { cls: 'neutro', i: 'archivo', t: 'En papel' },
  tramite_pendiente: { cls: 'adv', i: 'copia', t: 'Falta la copia' },
  ok: { cls: 'ok', i: 'ok', t: 'Vigente' },
  indef: { cls: 'ok', i: 'inf', t: 'Indefinido' },
  sin_vencimiento: { cls: 'ok', i: 'ok', t: 'Sin fecha de fin' },
};
function meta(p) {
  const e = estado(p);
  if (enPapel(p)) return META.papel;
  if (e === 'ok' && docVig(p)?.tipo === 'indefinido' && S.datos !== 'aldia') return META.indef;
  return META[e];
}
const insignia = (p) => { const m = meta(p); return `<span class="ins ${m.cls}">${ic(m.i)}${m.t}</span>`; };
// Tiempo hasta la fecha que gobierna: número en tinta, el significado en el punto.
function rel(p) {
  const f = finEf(p), u = docVig(p), e = estado(p);
  if (e === 'sin_contrato' && !f) return { t: p.docs.length ? '—' : `ingresó el ${fmtC(p.ing)}`, d: 'neutro' };
  if (e === 'sin_firmar' && !vivos(p).some((d) => d.firma)) { const n = dias(u.gen, HOY); return { t: `sin firmar hace ${plural(n, 'día', 'días')}`, d: n > 14 ? 'falta' : 'warn' }; }
  if (u?.tipo === 'indefinido') return { t: 'sin fecha de fin', d: 'neutro' };
  if (!f) return { t: 'sin fecha de fin', d: 'neutro' };
  const n = dias(HOY, f);
  if (n < 0) return { t: `venció hace ${plural(-n, 'día', 'días')}`, d: 'falta' };
  if (n === 0) return { t: 'vence hoy', d: 'falta' };
  return { t: `vence en ${plural(n, 'día', 'días')}`, d: n <= S.vent ? 'warn' : 'ok' };
}
const relHTML = (p) => { const r = rel(p); return `<span class="rel"><span class="dot ${r.d}" aria-hidden="true"></span>${esc(r.t)}</span>`; };
function periodo(p) {
  const u = docVig(p);

const tipoDe = (p) => { const u = docVig(p); return u ? TIPO[u.tipo] : (p.fin ? 'Contrato en papel' : '—'); };

}

  return `<div class="tabs" role="navigation" aria-label="Qué ver">${T.map(([k, l, n]) => `<button class="tab" ${S.tab === k ? 'aria-current="page"' : ''} data-act="tab" data-k="${k}">${l}<b>${n}</b></button>`).join('')}</div>`;
}
function visibles() {
  const q = sinTildes(S.q.trim());
  const pa = PA.find((x) => x.k === S.pa);
  return alcance().filter((p) => {
    if (S.tab === 'atencion' && !cuentaAtencion(p)) return false;
    if (S.tab === 'vigentes' && !esVigente(p)) return false;
    if (pa && !pa.f(p)) return false;
    if (S.fSede !== 'todas' && p.sede !== S.fSede) return false;
    if (S.fTipo !== 'todos' && docVig(p)?.tipo !== S.fTipo) return false;
    if (q && !sinTildes(`${p.n} ${p.a} ${p.sede} ${sedeNombre(p.sede)}`).includes(q)) return false;
    return true;
  });
}
const nFiltros = () => (S.fSede !== 'todas' ? 1 : 0) + (S.fTipo !== 'todos' ? 1 : 0);
function ordenA(arr) { // como hoy: lo grave arriba y después por cuántos días quedan
  return arr.slice().sort((x, y) => {
    const r = (q) => (estado(q) === 'desnaturalizado' ? 2 : grave(q) ? 1 : 0); // el art. 77 siempre primero
    const g = r(y) - r(x); if (g) return g;
    const dx = finEf(x) ? dias(HOY, finEf(x)) : 99999, dy = finEf(y) ? dias(HOY, finEf(y)) : 99999;

  });
}

/* ═════════ B · por sede, con la línea de vigencia ═════════ */
function lineaVigencia(p) {
  const u = docVig(p), e = estado(p), f = finEf(p), m = meta(p);
  if (!u && !p.fin) return `<div class="vig"><div class="lin"><span>${ic('doc')} Sin contrato en el sistema</span><span class="tx">ingresó el ${fmtF(p.ing)}</span></div><div class="barra-v"><div class="bv punteada" role="img" aria-label="Sin contrato registrado"></div></div></div>`;
  if (!u) return `<div class="vig"><div class="lin"><span>${ic('archivo')} Sin documento en el sistema</span><span class="tx">su ficha dice: hasta ${fmtF(p.fin)}</span></div><div class="barra-v"><div class="bv punteada" role="img" aria-label="Contrato en papel, hasta ${fmtF(p.fin)}"></div></div></div>`;
  if (u.tipo === 'indefinido') return `<div class="vig"><div class="lin"><span>${ic('inf')} Indefinido</span><span class="tx">desde ${fmtF(u.ini)}${u.firma ? '' : ' · sin firmar'}</span></div><div class="barra-v"><div class="bv sinfin" role="img" aria-label="Indefinido, sin fecha de fin"></div></div></div>`;
  // Un borrador sin firmar todavía no corre: se dibuja el contrato que sigue vigente, o el propio borrador.
  const ref = u.firma ? u : (vivos(p).find((d) => d.firma) || u);
  const i0 = ref.ini, f0 = u.firma ? (f || ref.fin) : (ref.firma ? (ref.fin ?? f) : u.fin);
  if (!f0) return '';
  const total = Math.max(1, dias(i0, f0)), trans = dias(i0, HOY);
  const pct = Math.max(0, Math.min(100, (trans / total) * 100));
  const cls = e === 'desnaturalizado' || e === 'vencido' ? 'mal' : e === 'por_vencer' ? 'aviso-v' : (e === 'sin_firmar' ? '' : 'bien');
  const pas = HOY > f0;
  const texto = e === 'sin_firmar' ? `${plural(dias(u.gen, HOY), 'día', 'días')} sin firmar` : rel(p).t;
  return `<div class="vig"><div class="lin"><span>${TIPO[ref.tipo]}${e === 'sin_firmar' && ref !== u ? ` · la siguiente, sin firmar (${plural(dias(u.gen, HOY), 'día', 'días')})` : ''}</span><span class="tx">${fmtC(i0)} → ${fmtF(f0)} · ${esc(e === 'sin_firmar' && ref !== u ? rel(p).t : texto)}</span></div>
    <div class="barra-v"><div class="bv ${cls}" role="img" aria-label="${esc(`${TIPO[ref.tipo]} del ${fmtF(i0)} al ${fmtF(f0)}. ${texto}`)}"><i style="width:${pas ? 100 : pct}%"></i>${pas ? '' : `<u style="left:calc(${pct}% - 1px)" title="Hoy"></u>`}</div>${pas ? `<div class="pasado" title="Días después del vencimiento"></div>` : ''}</div></div>`;
}
function resumenSede(cod) {

function vistaB() {

/* ═════════ C · por urgencia, con la acción al lado ═════════ */
const BANDAS = [

      '<b>Un fallo se ve como «nada pendiente».</b> <code>cargar()</code> descarta el <code>error</code> de sus 11 consultas: si <code>fn_contratos_tablero</code> falla, la lista, los contadores y el aviso del art. 77 desaparecen sin una palabra. El Dashboard ya resolvió esto (<code>contratosNoRespondio</code>).',
      '<b>«Limpiar filtros» no se va.</b> Deja el estado en «todos» y el botón se muestra mientras el estado sea distinto de «pendientes».',
      '<b>«Cerca del tope» puede no ser el tope.</b> Para una practicante, la fecha que gobierna es el menor entre el fin del convenio y los 12 meses; la etiqueta asume siempre lo segundo.',
      '<b>Mensaje de acceso confuso.</b> «Solo administradores y líderes…» deja entender que una líder de equipo puede.',
      '<b>Enlaces sin destino.</b> La ficha y Incidencias enlazan a <code>/admin/contratos</code> sin <code>?persona=</code>. La Bandeja sí lo usa, pero «Pidió revisar su contrato» llega a una pantalla que no muestra esa revisión (en el panel, <code>fn_contrato_revisiones_pedidas</code> solo la lee la Bandeja).',
      '<b>Código muerto.</b> <code>NECESITA_CONTRATO</code> y <code>graves</code> se calculan y no se usan.',
      '<b>Un archivo de 3 900 líneas</b> con el generador adentro: antes de migrar la pantalla conviene sacar el generador a su propio componente (primer commit, sin cambios), y recién después cambiar la lista.',
      '<b>Sin salida para el papel que ya existe.</b> Las personas «en papel» solo pueden salir de ese estado generando un documento nuevo; no se puede cargar el firmado.',
    ])}</div></div></details>
    <details><summary>Decisiones abiertas para Felipe</summary><div class="in"><div class="ancho">${L([
      '¿Qué ventana vale para «vence pronto» en Contratos? Hoy la base dice 60. El Dashboard dice 90 y el correo 30. (El selector «Vence pronto» de arriba lo simula.)',
      '¿«En papel» es atención o es historia? Hoy cuenta como atención; la propuesta lo manda a «Vigentes» (selector «En papel» arriba). Cambia qué número ve DO al entrar.',
      '¿Se agrega «cargar el contrato firmado en papel» sin generar? Pide una función nueva en la base (migración).',
      '¿Se quiere un flujo por tanda para el 31 de diciembre (renovar de a uno y pasar a «siguiente»)? No se propone «renovar todos de golpe».',
      '¿La líder de sede ve algo de contratos de su sede (solo lectura)? Hoy la RLS no la deja.',
      '¿Un solo nombre para el art. 77? Esta propuesta usa «Riesgo art. 77» en pastillas, banner y fila.',
      '¿Se abre el cajón al llegar con <code>?persona=</code>? Hoy solo se busca el nombre y se pasa a «Todos».',
    ])}</div></div></details>
  </section>`;
}

/* ═════════ render ═════════ */
const app = $('#app'), capa = $('#capa');
function lemaHTML() {
  return ({
    lider: '<strong>Líder de equipo (Carla, TRU)</strong>: no tiene esta pantalla (no sale en su menú). Su propio contrato está en Lo mío.',
    do: '<strong>Desarrollo Organizacional (Diego)</strong>: ve a las ' + S.P.length + ' personas, genera, sube firmas, anota copias y anula. Misma pantalla que dirección.',
    admin: '<strong>Dirección (Franco)</strong>: idéntica a DO en esta pantalla; además es quien firma por CAYLA.',
  })[S.rol];
}
function sinAcceso() {
  return `<div class="vacio">${ic('candado')}<h3>Los contratos son de Desarrollo Organizacional</h3>
    <p>Aquí se generan, se firman y se archivan los contratos de todo el equipo, con sueldo y datos personales. Tu propio contrato lo ves en <b>Lo mío → Mi contrato</b>, y ahí mismo puedes pedir que lo revisen.</p>
    <button class="btn sec" data-act="toast" data-t="Abriría Lo mío → Mi contrato (otra pantalla).">Ir a Mi contrato</button></div>`;
}
function render() {
  const enfoca = document.activeElement && document.activeElement.id === 'q';
  const pos = enfoca ? document.activeElement.selectionStart : 0;
  $('#lema').innerHTML = lemaHTML();
  let cuerpo;
  if (!puede()) cuerpo = cabecera() + sinAcceso();
  else {
    const hayLista = S.datos !== 'error' && S.datos !== 'cargando' && S.datos !== 'vacio';
    const vista = ({ A: vistaA, B: vistaB, C: vistaC })[S.v]();
    const conteo = hayLista && S.tab !== 'archivados' ? `<p class="conteo" role="status">${visibles().length} de ${alcance().length} personas${S.pa ? ' · filtrando por «Para atender»' : ''}</p>` : '';
    cuerpo = cabecera() + (hayLista ? bannerArt77() + paHTML() + barraHTML() + tabsHTML() + conteo : '') + vista;
  }
  app.innerHTML = cuerpo + notasHTML();
  const cuerpoAntes = $('#capa .cuerpo'), scrollAntes = cuerpoAntes ? cuerpoAntes.scrollTop : 0;
  const llave = S.drawer ? `${S.drawer.id || S.drawer.form?.pid}|${S.drawer.vista}` : '';
  const mismo = llave && llave === render.llave;
  render.llave = llave;
  capa.innerHTML = (S.drawer ? drawerHTML() : '') + (S.visor ? visorHTML() : '') + (S.ayuda ? ayudaHTML() : '');
  if (mismo) { const c = $('#capa .cajon'); if (c) c.classList.add('quieto'); const cu = $('#capa .cuerpo'); if (cu) cu.scrollTop = scrollAntes; }
  $('#toast-capa').innerHTML = S.toast ? `<div id="toast" role="status">${esc(S.toast)}</div>` : '';
  $$('.vbtn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.v)));
  if (enfoca) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
  else if (S.drawer || S.ayuda || S.visor) { const f = $('#capa .bi'); if (f && !capa.contains(document.activeElement)) f.focus(); }
}
let tt;
function avisar(t) { S.toast = t; clearTimeout(tt); tt = setTimeout(() => { S.toast = null; render(); }, 4500); }

/* ═════════ acciones ═════════ */
function abrir(id, vista = 'detalle') {
  const p = byId(id); if (!p) return;
  S.drawer = { id, vista };
  if (vista === 'subir') S.drawer.form = { arch: '', fecha: HOY };
  if (vista === 'anular') S.drawer.form = { motivo: '' };
}
function nuevoGenerar(id, tipo) {
  const p = id ? byId(id) : null;
  let t = tipo || (p ? (p.vinc === 'practicante' ? 'convenio_practicas' : (p.ing > HOY ? 'nuevo' : 'renovacion')) : 'renovacion');
  const ini = p && t === 'renovacion' && p.fin && p.fin >= HOY ? sumar(p.fin, 1) : HOY;
  S.drawer = { vista: 'generar', form: { pid: p ? p.id : '', tipo: t, ini, fin: t === 'indefinido' ? '' : masMeses(ini, t === 'convenio_practicas' ? 3 : 12, true) } };
}
function recalcular(f) { f.fin = f.tipo === 'indefinido' ? '' : masMeses(f.ini || HOY, f.tipo === 'convenio_practicas' ? 3 : 12, true); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-open],[data-v]');
  if (!t) { if (S.filtros && !e.target.closest('.pop')) { S.filtros = false; render(); } return; }
  const a = t.dataset.act;
  if (t.dataset.v && !a) { S.v = t.dataset.v; S.drawer = null; render(); return; }
  if (t.dataset.open && !a) { abrir(t.dataset.open); render(); return; }
  e.stopPropagation();
  switch (a) {
    case 'ayuda': S.ayuda = true; break;
    case 'cerrar-ayuda': S.ayuda = false; break;
    case 'cerrar': S.drawer = null; break;
    case 'cerrar-visor': S.visor = null; break;
    case 'filtros': S.filtros = !S.filtros; break;
    case 'limpiar-f': S.fSede = 'todas'; S.fTipo = 'todos'; break;
    case 'limpiar-todo': S.q = ''; S.fSede = 'todas'; S.fTipo = 'todos'; S.pa = null; S.tab = 'atencion'; break;
    case 'tab': S.tab = t.dataset.k; S.pa = null; break;
    case 'pa': S.pa = S.pa === t.dataset.k ? null : t.dataset.k; if (S.pa && (S.tab === 'vigentes' || S.tab === 'archivados')) S.tab = 'atencion'; break;
    case 'plegar': S.plegadas[t.dataset.k] = !S.plegadas[t.dataset.k]; break;
    case 'reintentar': S.datos = 'normal'; $('#selDatos').value = 'normal'; break;
    case 'nuevo': nuevoGenerar(null); break;
    case 'abrir': abrir(t.dataset.id); break;
    case 'gen': nuevoGenerar(t.dataset.id, t.dataset.tipo); break;
    case 'firmar': abrir(t.dataset.id); break;
    case 'copia': {
      const p = byId(t.dataset.id), d = docVig(p); d.copia = HOY;
      avisar(`Anotada la entrega de copia a ${p.n}.`); break;
    }
    case 'editar': S.drawer = null; avisar('Abriría el generador con el borrador de ' + byId(t.dataset.id).n + ' para corregirlo en su sitio (no se crea otro).'); break;
    case 'ver': S.visor = { pid: t.dataset.id, did: t.dataset.doc }; break;
    case 'verEscaneo': avisar('Abriría el escaneo firmado en otra pestaña.'); break;
    case 'imprimir': avisar('Imprimiría la hoja o la guardaría como PDF, con el nombre «Nombre Apellido — Contrato de trabajo».'); break;
    case 'toast': avisar(t.dataset.t); break;
    case 'v-detalle': S.drawer = { id: S.drawer.id, vista: 'detalle' }; break;
    case 'v-subir': abrir(S.drawer.id, 'subir'); break;
    case 'v-anular': abrir(S.drawer.id, 'anular'); break;
    case 'ge-tipo': S.drawer.form.tipo = t.dataset.t; recalcular(S.drawer.form); break;
    case 'guardar-su': {
      const p = byId(S.drawer.id), d = docVig(p), f = S.drawer.form;
      if (f.fecha < sumar(d.ini, -30)) { avisar(`La fecha de firma (${fmtF(f.fecha)}) es más de un mes anterior al inicio del documento (${fmtF(d.ini)}). Revisa que sea la correcta.`); break; }
      if (d.fin && f.fecha > d.fin) { avisar(`La fecha de firma (${fmtF(f.fecha)}) es posterior al término del documento (${fmtF(d.fin)}). Revisa que sea la correcta.`); break; }
      const yaFirmado = !!d.firma;
      d.scan = true; if (!yaFirmado) d.firma = f.fecha;
      if (!yaFirmado && d.tipo !== 'adendum') p.fin = d.fin; // el vencimiento de la persona se actualiza (0287)
      S.drawer = { id: p.id, vista: 'detalle' };
      avisar(yaFirmado ? 'Escaneo de respaldo guardado. La fecha de firma sigue siendo la de la firma digital.' : 'Contrato firmado registrado. La fecha de vencimiento de la persona se actualizó.'); break;
    }
    case 'guardar-an': {
      const p = byId(S.drawer.id), d = docVig(p), f = S.drawer.form;
      d.anulado = { f: HOY, m: f.motivo.trim() }; S.drawer = { id: p.id, vista: 'detalle' };
      avisar('Contrato anulado. Sigue guardado en «Archivados».'); break;
    }
    case 'guardar-ge': {
      const f = S.drawer.form, p = byId(f.pid); S.drawer = null;
      avisar(`Abriría el generador (paso 1 de 5) con ${nombre(p)}, «${TIPO[f.tipo]}», del ${fmtF(f.ini)}${f.fin ? ' al ' + fmtF(f.fin) : ''}. Esa pantalla no cambia.`); break;
    }
    default: return;
  }
  render();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); return; }
  const d = S.drawer; if (!d || !d.form) return;
  const f = d.form;
  if (t.dataset.su) { if (t.dataset.su === 'archivo') { f.arch = t.files[0] ? t.files[0].name : ''; const el = $('#elegido'); if (el) el.textContent = f.arch ? `Elegido: ${f.arch}` : ''; } else f[t.dataset.su] = t.value; actualizarBotones(); return; }
  if (t.dataset.an) { f.motivo = t.value; const c = $('#cuenta-an'); if (c) c.textContent = `${t.value.length}/250`; actualizarBotones(); return; }
  if (t.dataset.ge) { f[t.dataset.ge] = t.value; if (t.dataset.ge === 'pid') { const p = byId(t.value); if (p) nuevoGenerar(p.id); } if (t.dataset.ge === 'ini') recalcular(f); render(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.f) { S[t.dataset.f] = t.value; render(); }
});
function actualizarBotones() {
  const d = S.drawer; if (!d) return;
  const f = d.form;
  const set = (act, off) => { const b = $(`#capa [data-act="${act}"]`); if (b) b.disabled = off; };
  if (d.vista === 'subir') { set('guardar-su', !(f.arch && f.fecha)); const e = $('#err-su'); if (e) e.textContent = !f.arch ? 'Falta el escaneo firmado.' : !f.fecha ? 'Indica en qué fecha se firmó.' : ''; }
  if (d.vista === 'anular') set('guardar-an', f.motivo.trim().length < 3);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.visor) S.visor = null; else if (S.ayuda) S.ayuda = false; else if (S.drawer) S.drawer = null; else if (S.filtros) S.filtros = false; else return; render(); }
});

/* barra del prototipo */
$('#selRol').addEventListener('change', (e) => { S.rol = e.target.value; S.drawer = null; S.pa = null; render(); });
$('#selDatos').addEventListener('change', (e) => { S.datos = e.target.value; S.drawer = null; render(); });
$('#selVent').addEventListener('change', (e) => { S.vent = Number(e.target.value); render(); });
$('#selPapel').addEventListener('change', (e) => { S.papel = e.target.value; render(); });
$('#selTema').addEventListener('change', (e) => { S.tema = e.target.value; if (S.tema === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.tema); });
$('#btnReset').addEventListener('click', () => { nDoc = 100; Object.assign(S, { P: P0(), q: '', tab: 'atencion', pa: null, fSede: 'todas', fTipo: 'todos', filtros: false, plegadas: { aldia: true }, drawer: null, visor: null, ayuda: false, toast: null }); render(); });
$('#btnLink').addEventListener('click', () => {
  if (S.rol === 'lider') { S.rol = 'do'; $('#selRol').value = 'do'; }
  S.q = 'Gaby Torres'; S.tab = 'todos'; S.pa = null; abrir('gaby'); render();
  avisar('Como hoy: busca el nombre y pasa a «Todos». En esta propuesta además abre el cajón.');
});
const ajusta = () => { $('#ctlbox').open = window.innerWidth > 720 || $('#ctlbox').open; };
window.addEventListener('resize', ajusta); ajusta();
render();
})();
</script>
