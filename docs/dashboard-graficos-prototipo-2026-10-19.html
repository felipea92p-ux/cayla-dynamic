<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard: gráficos de tendencia — prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<!--
  Prototipo de «gráficos de tendencia en el Dashboard» (2026-10-19).

  NO es código de la app y no toca ninguna base. Datos 100 % ficticios, generados en el navegador con
  una semilla fija. «Hoy» es el lunes 19 de octubre de 2026: la semana y el periodo de planilla en
  curso están EMPEZANDO, justo para ver cómo se dibuja lo que todavía no se puede medir.

  Reglas de CLAUDE.md que este prototipo hace visibles:
    · Dynamic avisa, nunca sanciona: ningún gráfico nombra a una persona. La puntualidad es por sede,
      por día de la semana o por franja. Nunca un ranking nominal.
    · Casos es confidencial: solo agregados por «sobre qué», mínimo 3 casos por barra, sin sede, y el
      Título X no se desglosa nunca. Una líder ve lo que ya gestiona (y casi nunca llega a 3).
    · Plata: costos de planilla solo para DO y dirección (puedeVerPlanilla). Una líder de equipo no los ve.
    · Falsos positivos: lo que no se midió (periodo en curso, sin horario, muestra chica) se dice aparte;
      nunca se dibuja como cero.
    · Colores: tokens de globals.css, claro y oscuro. El número va en tinta; el significado, en punto de
      color + palabra. Ningún dato va solo en color. Los 13 tokens NO pasan el validador de paleta
      categórica (verde/ámbar se confunden bajo daltonismo, ΔE 4.5): por eso ningún gráfico usa color para
      distinguir series. Solo hay una serie en tinta, o dos polos (azul ↔ ámbar, ΔE 19.6) siempre con palabra.
-->
<style>
  :root{
    --color-crema:#f5f0e8; --color-papel:#fbf8f2; --color-tinta:#1a1a18;
    --color-rojo:#b8412d; --color-rojo-profundo:#8b2a1f; --color-sand:#e8e0d0; --color-taupe:#805c4c;
    --color-hueso:#eae1d2; --color-pizarra:#4c5d6e; --color-verde:#48603f;
    --color-ambar:#74501a; --color-azul:#2f5f9e; --color-ceniza:#635f58;
    --font-sans:'DM Sans', ui-sans-serif, system-ui, sans-serif;
    --font-serif:'EB Garamond', ui-serif, Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
      --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
      --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
      --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --color-crema:#1c1a16; --color-papel:#26221d; --color-tinta:#ede7db;
    --color-rojo:#d4634a; --color-rojo-profundo:#e8836b; --color-sand:#332e27; --color-taupe:#ab9080;
    --color-hueso:#15110d; --color-pizarra:#9db0c2; --color-verde:#8fae80;
    --color-ambar:#c99a4a; --color-azul:#9bbbe8; --color-ceniza:#aaa59b;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; max-width:100%; overflow-x:hidden; }
  body{ background:var(--color-crema); color:var(--color-tinta); font-family:var(--font-sans); font-size:14.5px; line-height:1.5; }
  h1,h2,h3,h4{ font-family:var(--font-serif); font-weight:600; margin:0; text-wrap:balance; }
  p{ margin:0; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--color-rojo); outline-offset:2px; }
  .oculto{ display:none !important; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  svg.i{ width:1em; height:1em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.12em; }
  .muted{ color:var(--color-taupe); }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.ok{ background:var(--color-verde); } .dot.alerta{ background:var(--color-rojo); } .dot.aviso{ background:var(--color-ambar); }
  .dot.info{ background:var(--color-pizarra); } .dot.azul{ background:var(--color-azul); } .dot.neutro{ background:var(--color-ceniza); }

  /* ── barra del prototipo (no es parte de la pantalla) ── */
  .proto{ position:sticky; top:0; z-index:60; background:var(--color-papel); border-bottom:1px solid var(--color-sand); padding:8px 16px; display:flex; flex-direction:column; gap:8px; }
  @media (max-width:760px){ .proto{ position:static; } }
  .proto .fila{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .vbtn{ border:1px solid var(--color-sand); background:var(--color-crema); border-radius:10px; padding:6px 11px; font-weight:600; font-size:.82rem; display:inline-flex; gap:7px; align-items:center; }
  .vbtn b{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--color-hueso); color:var(--color-taupe); font-size:.76rem; }
  .vbtn[aria-pressed="true"]{ background:var(--color-tinta); color:var(--color-crema); border-color:var(--color-tinta); }
  .vbtn[aria-pressed="true"] b{ background:var(--color-crema); color:var(--color-tinta); }
  .vbtn small{ font-weight:500; opacity:.85; }
  .recom{ font-size:.64rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--color-verde); background:color-mix(in oklab, var(--color-verde) 14%, var(--color-papel)); border-radius:100px; padding:1px 7px; }
  .vbtn[aria-pressed="true"] .recom{ background:var(--color-crema); }
  .ctl{ display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:.78rem; color:var(--color-taupe); }
  .ctl label{ display:inline-flex; gap:6px; align-items:center; }
  .ctl select{ background:var(--color-hueso); border:1px solid var(--color-sand); border-radius:8px; padding:4px 8px; }
  .ctl input[type=checkbox]{ accent-color:var(--color-tinta); }
  .demo-badge{ font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--color-pizarra); background:color-mix(in oklab, var(--color-pizarra) 14%, var(--color-papel)); border:1px solid color-mix(in oklab, var(--color-pizarra) 35%, transparent); padding:3px 9px; border-radius:100px; }
  .lema{ padding:10px 16px 0; max-width:1240px; margin-inline:auto; color:var(--color-taupe); font-size:.84rem; }
  .lema strong{ color:var(--color-tinta); }

  /* ── el lienzo: la pantalla simulada. Contenedor, para que 375 px funcione de verdad ── */
  .mesa{ max-width:1240px; margin-inline:auto; padding:12px 16px 0; }
  .lienzo{ container-type:inline-size; container-name:pant; margin-inline:auto; transition:max-width .2s; }
  .lienzo.movil{ max-width:375px; border:1px solid var(--color-taupe); border-radius:24px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.18); }
  .pantalla{ background:var(--color-crema); padding:16px 16px 40px; display:flex; flex-direction:column; gap:14px; min-width:0; }
  @container pant (min-width:640px){ .pantalla{ padding:28px 32px 48px; } }

  /* piezas del diseño unificado, copiadas de cómo se ven en la app */
  .cab{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px 18px; align-items:flex-start; }
  .cab .sobre{ font-size:.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.09em; color:var(--color-taupe); }
  .cab h1{ font-size:1.75rem; font-weight:500; line-height:1.15; }
  .cab .desc{ color:var(--color-taupe); margin-top:3px; font-size:.88rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .vivo{ width:8px; height:8px; border-radius:50%; background:var(--color-verde); display:inline-block; }
  .btn{ border:1px solid var(--color-tinta); background:var(--color-tinta); color:var(--color-crema); border-radius:8px; padding:6px 12px; font-weight:600; font-size:.82rem; min-height:34px; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
  .btn.sec{ background:transparent; color:var(--color-tinta); border-color:var(--color-taupe); }
  .btn.sutil{ background:transparent; border-color:transparent; color:var(--color-taupe); }
  .btn.fino{ min-height:28px; padding:3px 10px; font-size:.76rem; }
  .filtro{ border:1px solid var(--color-sand); background:var(--color-papel); border-radius:8px; padding:5px 12px; font-size:.8rem; font-weight:500; min-height:32px; color:var(--color-tinta); }
  .filtro[aria-pressed="true"], .filtro[aria-selected="true"]{ background:var(--color-tinta); color:var(--color-crema); border-color:var(--color-tinta); }
  .filtro[disabled]{ opacity:.55; cursor:not-allowed; }
  .filtros{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .campo-sm{ background:var(--color-hueso); border:1px solid var(--color-taupe); border-radius:8px; padding:5px 9px; font-size:.8rem; min-height:32px; }
  .tarj{ background:var(--color-papel); border:1px solid var(--color-sand); border-radius:16px; padding:16px; min-width:0; }
  @container pant (min-width:640px){ .tarj{ padding:20px; } }
  .tarj > .tt{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .tarj h3{ font-size:1.12rem; font-weight:500; }
  .rot{ font-size:.75rem; font-weight:500; color:var(--color-taupe); }
  .cifras{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  @container pant (min-width:640px){ .cifras{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .cifra{ background:var(--color-papel); border:1px solid var(--color-sand); border-radius:12px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:48px; }
  .cifra .et{ font-size:.74rem; color:var(--color-taupe); display:flex; align-items:center; gap:6px; line-height:1.15; }
  .cifra .nu{ font-family:var(--font-serif); font-size:1.5rem; font-weight:500; line-height:1; }
  .caja{ border-radius:12px; border:1px solid; padding:10px 12px; display:flex; flex-direction:column; gap:4px; font-size:.84rem; }
  .caja.ambar{ border-color:color-mix(in oklab, var(--color-ambar) 40%, transparent); background:color-mix(in oklab, var(--color-ambar) 7%, var(--color-papel)); }
  .caja.info{ border-color:color-mix(in oklab, var(--color-pizarra) 30%, transparent); background:color-mix(in oklab, var(--color-pizarra) 6%, var(--color-papel)); }
  .caja .tit{ font-weight:700; display:flex; gap:7px; align-items:center; }
  .caja.ambar .tit{ color:var(--color-ambar); } .caja.info .tit{ color:var(--color-pizarra); }
  .vacio{ border:1px dashed var(--color-taupe); border-radius:12px; padding:22px 14px; text-align:center; color:var(--color-taupe); font-size:.86rem; display:flex; flex-direction:column; gap:6px; align-items:center; }
  .cargando{ display:flex; align-items:center; gap:10px; color:var(--color-taupe); font-size:.86rem; padding:26px 4px; justify-content:center; }
  .gira{ width:16px; height:16px; border-radius:50%; border:2px solid var(--color-sand); border-top-color:var(--color-taupe); animation:gira 0.9s linear infinite; }
  @keyframes gira{ to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .gira{ animation:none; border-top-color:var(--color-sand); } }

  /* la banda colapsable (PanelColapsable) */
  .panel > .cabp{ display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; margin-bottom:10px; }
  .panel > .cabp button{ display:flex; align-items:center; gap:8px; background:none; border:0; padding:4px 0; text-align:left; }
  .panel > .cabp h2{ font-size:1.25rem; font-weight:500; }
  .panel > .cabp .fr{ font-size:.74rem; color:var(--color-taupe); }
  .panel > .cabp .fl{ width:.8em; color:var(--color-taupe); }
  .plegada{ border:1px dashed var(--color-sand); border-radius:12px; padding:10px 14px; font-size:.82rem; color:var(--color-taupe); background:color-mix(in oklab, var(--color-papel) 60%, transparent); }

  /* sedes simuladas (parte del Dashboard actual, solo de contexto) */
  .sede-sim{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 12px; align-items:center; padding:9px 0; border-top:1px solid var(--color-sand); font-size:.86rem; }
  .sede-sim:first-child{ border-top:0; }
  .sede-sim .n{ font-weight:600; } .sede-sim .n small{ font-weight:400; color:var(--color-taupe); margin-left:6px; }
  .cob{ display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:600; border-radius:6px; padding:2px 7px; font-variant-numeric:tabular-nums; }
  .cob.ok{ color:var(--color-verde); background:color-mix(in oklab, var(--color-verde) 13%, var(--color-papel)); }
  .cob.falta{ color:var(--color-rojo-profundo); background:color-mix(in oklab, var(--color-rojo) 12%, var(--color-papel)); }
  .contexto{ position:relative; opacity:.9; }
  

  /* ── gráficos ── */
  .rejilla{ display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
  @container pant (min-width:900px){ .rejilla.dos{ grid-template-columns:repeat(2, minmax(0,1fr)); } .rejilla .ancho{ grid-column:1 / -1; } }
  .graf{ background:var(--color-papel); border:1px solid var(--color-sand); border-radius:16px; padding:14px 16px 12px; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .graf .pregunta{ font-family:var(--font-serif); font-size:1.12rem; font-weight:500; line-height:1.2; }
  .graf .sub{ font-size:.76rem; color:var(--color-taupe); margin-top:-4px; }
  .graf .cab-g{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .graf .acc-g{ display:flex; gap:4px; flex:none; }
  .ibtn{ border:1px solid transparent; background:none; border-radius:8px; width:30px; height:30px; display:grid; place-items:center; color:var(--color-taupe); }
  .ibtn:hover{ background:var(--color-hueso); } .ibtn[aria-pressed="true"]{ background:var(--color-hueso); color:var(--color-tinta); border-color:var(--color-sand); }
  .area{ position:relative; min-width:0; }
  .area svg{ display:block; width:100%; overflow:visible; }
  .lectura{ font-size:.8rem; color:var(--color-tinta); display:flex; gap:8px; align-items:flex-start; }
  .lectura .dot{ margin-top:6px; }
  .leyenda{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.74rem; color:var(--color-taupe); align-items:center; }
  .leyenda span{ display:inline-flex; gap:6px; align-items:center; }
  .sw{ display:inline-block; width:14px; height:3px; border-radius:2px; background:var(--color-tinta); }
  .sw.punto{ width:9px; height:9px; border-radius:50%; } .sw.taupe{ background:var(--color-taupe); border-radius:3px; width:12px; height:10px; } .sw.azul{ background:var(--color-azul); } .sw.ambar{ background:var(--color-ambar); }
  .sw.rango{ height:8px; background:color-mix(in oklab, var(--color-taupe) 25%, var(--color-papel)); }
  .sw.hueco{ width:9px; height:9px; border-radius:50%; background:var(--color-papel); border:2px solid var(--color-tinta); }
  .sw.rayas{ width:14px; height:10px; border-radius:2px; background:repeating-linear-gradient(135deg, var(--color-taupe) 0 2px, transparent 2px 5px); border:1px solid var(--color-taupe); }
  .pie{ font-size:.72rem; color:var(--color-taupe); line-height:1.4; }
  details.como{ font-size:.76rem; color:var(--color-taupe); }
  details.como > summary{ cursor:pointer; list-style:none; display:inline-flex; gap:6px; align-items:center; font-weight:600; }
  details.como > summary::-webkit-details-marker{ display:none; }
  details.como[open] > summary{ margin-bottom:4px; }
  details.como ul{ margin:4px 0 0; padding-left:18px; } details.como li{ margin:2px 0; }
  .etq{ display:none; flex-wrap:wrap; gap:4px; font-size:.64rem; font-weight:700; letter-spacing:.03em; }
  .con-etq .etq{ display:flex; }
  .etq span{ border-radius:6px; padding:1px 7px; background:var(--color-hueso); color:var(--color-taupe); border:1px solid var(--color-sand); text-transform:uppercase; }
  .etq .ex{ color:var(--color-verde); } .etq .nu{ color:var(--color-ambar); }
  .etq .re{ color:var(--color-rojo-profundo); }

  /* trazos de SVG (se pintan con variables: el cambio de tema no pide redibujar) */
  .gx{ stroke:var(--color-sand); stroke-width:1; shape-rendering:crispEdges; }
  .ejex{ stroke:var(--color-taupe); stroke-width:1; shape-rendering:crispEdges; }
  .tk{ fill:var(--color-taupe); font-size:10.5px; font-family:var(--font-sans); }
  .tk.fuerte{ fill:var(--color-tinta); font-weight:600; }
  .tk.g{ font-size:12px; }
  .lin{ fill:none; stroke:var(--color-tinta); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .prom{ stroke:var(--color-taupe); stroke-width:1; stroke-opacity:.7; }
  .pt{ fill:var(--color-tinta); stroke:var(--color-papel); stroke-width:2; }
  .pt.hueco{ fill:var(--color-papel); stroke:var(--color-tinta); stroke-width:2; }
  .col .hit{ fill:transparent; cursor:crosshair; }
  .col .cross{ stroke:var(--color-taupe); stroke-width:1; opacity:0; pointer-events:none; }
  .col .pt-h{ opacity:0; fill:var(--color-tinta); stroke:var(--color-papel); stroke-width:2; pointer-events:none; }
  .col:hover .cross, .col:focus .cross, .col:hover .pt-h, .col:focus .pt-h{ opacity:1; }
  .col:focus{ outline:none; } .col:focus-visible .hit{ stroke:var(--color-rojo); stroke-width:2; }
  .barra{ fill:var(--color-taupe); }
  .barra.sup{ fill:var(--color-taupe); }
  .barra.pico{ fill:var(--color-taupe); }
  .barra.enc{ fill:var(--color-taupe); fill-opacity:.55; }
  .rangoP{ fill:var(--color-taupe); fill-opacity:.22; }
  .pol-azul{ fill:var(--color-azul); } .pol-ambar{ fill:var(--color-ambar); } .pol-ceniza{ fill:var(--color-ceniza); }
  .anillo{ stroke:var(--color-papel); stroke-width:2; }
  .atenuado{ opacity:.3; }
  .nota-svg{ fill:var(--color-taupe); font-size:10.5px; font-style:italic; }

  /* tooltip */
  #tip{ position:fixed; z-index:200; pointer-events:none; background:var(--color-tinta); color:var(--color-crema); border-radius:8px; padding:7px 10px; font-size:.76rem; line-height:1.35; max-width:230px; opacity:0; transition:opacity .08s; box-shadow:0 6px 18px rgba(0,0,0,.25); }
  #tip.on{ opacity:1; }
  #tip b{ font-weight:700; } #tip .t2{ opacity:.8; }

  /* cuadrícula de calor (tabla real) */
  table.calor{ border-collapse:separate; border-spacing:3px; width:100%; table-layout:fixed; }
  .calor th{ font-size:.7rem; font-weight:500; color:var(--color-taupe); padding:2px 0; text-align:center; }
  .calor th.fila-h{ text-align:left; width:62px; font-weight:600; color:var(--color-tinta); }
  .calor td{ height:34px; border-radius:6px; text-align:center; font-size:.74rem; font-variant-numeric:tabular-nums; color:var(--color-tinta); background:var(--bg, var(--color-hueso)); font-weight:600; }
  .calor td.na{ background:repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in oklab, var(--color-ceniza) 24%, transparent) 4px 5px); background-color:var(--color-papel); color:var(--color-ceniza); font-weight:400; border:1px dashed color-mix(in oklab, var(--color-ceniza) 55%, transparent); }
  .calor td.poca{ background:var(--color-papel); color:var(--color-ceniza); font-weight:400; border:1px dashed color-mix(in oklab, var(--color-ceniza) 55%, transparent); }
  .calor tr.apag td, .calor tr.apag th{ opacity:.3; }
  .escala{ display:flex; align-items:center; gap:4px; font-size:.7rem; color:var(--color-taupe); flex-wrap:wrap; }
  .escala i{ display:inline-block; width:26px; height:12px; border-radius:3px; background:var(--bg); border:1px solid color-mix(in oklab, var(--color-taupe) 25%, transparent); }

  /* barras horizontales de Casos (HTML, como las de la tarjeta actual) */
  .hb{ display:flex; flex-direction:column; gap:10px; margin:2px 0; }
  .hb li{ list-style:none; }
  .hb .l1{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.84rem; }
  .hb .l1 b{ font-variant-numeric:tabular-nums; font-weight:600; }
  .hb .pista{ display:block; height:8px; border-radius:4px; background:var(--color-sand); margin-top:4px; overflow:hidden; }
  .hb .pista i{ display:block; height:100%; border-radius:4px; background:var(--color-taupe); }
  .hb ul{ margin:0; padding:0; }
  .hb-min{ border-top:1px solid var(--color-sand); padding-top:8px; font-size:.78rem; color:var(--color-taupe); display:flex; gap:7px; align-items:flex-start; }

  table.tabla{ border-collapse:collapse; width:100%; font-size:.78rem; }

  /* pestañas de la variante B */

  details.nota .cuerpo{ padding:0 16px 14px; display:grid; gap:10px 22px; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); font-size:.84rem; }
  details.nota h4{ font-family:var(--font-sans); font-size:.72rem; letter-spacing:.07em; text-transform:uppercase; color:var(--color-taupe); margin-bottom:3px; }
  details.nota ul{ margin:0; padding-left:17px; } details.nota li{ margin:2px 0; }
  .decide{ border:1px solid var(--color-sand); border-left:5px solid var(--color-verde); background:var(--color-papel); border-radius:14px; padding:14px 16px; font-size:.86rem; display:grid; gap:4px; }
  .decide b.k{ font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--color-taupe); margin-right:6px; }

<body>

<div class="proto" role="region" aria-label="Controles del prototipo">

</div>

<script>
"use strict";
/* ───────────────────────── utilidades ───────────────────────── */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const NS = "http://www.w3.org/2000/svg";
const fmt = (n, d=0) => Number(n).toLocaleString("es-PE", {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const IC = {
  chevR:'<svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  chevD:'<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  tabla:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>',
  info:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  alerta:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg>',
  candado:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  flecha:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  atras:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  rep:'<svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>',
};

/* ───────────────────────── datos ficticios ─────────────────────────
   «Hoy» = lunes 19-oct-2026. Semanas cerradas: lunes 24-ago … lunes 12-oct (8). La semana del 19 está en curso.
   Meses: nov-2025 … sep-2026 cerrados; oct-2026 en curso (19 días).                                          */
const SEDES = [
  {c:"CCO", n:"Central",     tipo:"Administración y DO", gente:6, dom:false, base:97.2, ll:-2,  p25:-9,  p75:4},
  {c:"LIM", n:"Taller Lima", tipo:"Taller",              gente:9, dom:false, base:95.0, ll:-6,  p25:-12, p75:-1},
  {c:"AQP", n:"Tienda Arequipa", tipo:"Tienda",          gente:6, dom:false, base:96.1, ll:1,   p25:-5,  p75:6},
  {c:"TRU", n:"Tienda Trujillo", tipo:"Tienda",          gente:7, dom:true,  base:93.4, ll:3,   p25:-4,  p75:10},
];
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const SEM = ["24 ago","31 ago","7 sep","14 sep","21 sep","28 sep","5 oct","12 oct","19 oct"];
const MESES12 = ["nov","dic","ene","feb","mar","abr","may","jun","jul","ago","sep","oct"];
const R = rng(20261019);
const D = {};
(function build(){
  // asistencia semanal (9 puntos: 8 cerrados + el actual en curso) y mensual (12: último en curso)
  D.asisSem = {}; D.asisMes = {};
  SEDES.forEach((s,k) => {
    D.asisSem[s.c] = SEM.map((_,i) => +(s.base + Math.sin(i*1.3+k)*0.9 + (R()-0.5)*2.2 - (s.c==="LIM"&&i===3?4.2:0) ).toFixed(1));
    D.asisMes[s.c] = MESES12.map((m,i) => +(s.base + Math.cos(i*0.8+k)*1.1 + (R()-0.5)*1.8 - (m==="dic" && s.c==="TRU" ? 2.6 : 0)).toFixed(1));
  });
  const w = SEDES.map(s => s.gente);
  const pond = (obj, n) => Array.from({length:n}, (_,i) => +(SEDES.reduce((a,s,k)=>a+obj[s.c][i]*w[k],0)/w.reduce((a,b)=>a+b,0)).toFixed(1));
  D.asisSem.TODAS = pond(D.asisSem, SEM.length); D.asisMes.TODAS = pond(D.asisMes, 12);
  // sobretiempo (horas por semana; TRU trabaja domingo)
  const baseS = {CCO:1.5, LIM:9, AQP:3.5, TRU:12};
  D.stSem = {}; D.stMes = {};
  SEDES.forEach(s => {
    D.stSem[s.c] = SEM.map((_,i) => Math.max(0, Math.round((baseS[s.c] + Math.sin(i*1.1)*2.4 + (R()-0.4)*3)*2)/2));
    D.stMes[s.c] = MESES12.map((m,i) => Math.max(0, Math.round(baseS[s.c]*4.3 * (1 + ({dic:.55, jul:.3, may:.35, nov:.2}[m]||0)) + (R()-0.5)*8)));
  });
  const suma = (o, n) => Array.from({length:n}, (_,i) => SEDES.reduce((a,s)=>a+o[s.c][i],0));
  D.stSem.TODAS = suma(D.stSem, SEM.length); D.stMes.TODAS = suma(D.stMes, 12);
  // costo de planilla por periodo (29→28). El periodo «oct» está en curso (29-sep → 28-oct).
  D.costo = [
    {p:"jul", t:50120, rem:41300, st:2480, bo:1210, ap:5130, retro:true},
    {p:"ago", t:52040, rem:42300, st:2910, bo:1290, ap:5540},
    {p:"sep", t:51690, rem:42200, st:2840, bo:1280, ap:5370},
    {p:"oct", t:null, enCurso:true},
  ];
  // llegada vs hora de entrada del horario (minutos; negativo = antes). Mediana y rango central por sede.
  D.llega = SEDES.map(s => ({c:s.c, med:s.ll, p25:s.p25, p75:s.p75, n:{CCO:96,LIM:171,AQP:118,TRU:139}[s.c]}));
  // % de llegadas después de la tolerancia, por día de la semana (lun…dom). n = llegadas medidas en el periodo.
  D.calor = {
    CCO:[[3,24],[2,25],[4,24],[3,23],[6,22],null,null],
    LIM:[[4,40],[6,41],[5,40],[5,38],[9,39],[12,19],null],
    AQP:[[5,22],[4,23],[6,22],[7,22],[10,21],[14,26],null],
    TRU:[[8,28],[7,27],[9,27],[10,26],[13,26],[16,30],[6,5]],
  };
  // Casos: «sobre qué» (12 meses). El Título X NO figura: nunca se desglosa.
  D.casos = {
    total: 17,
    cats: [
      {k:"persona", t:"Una persona del equipo", n:6},
      {k:"empresa", t:"La empresa", n:5},
      {k:"idea", t:"Una idea de mejora", n:3},
      {k:"consulta", t:"Una consulta a mi líder", n:2},
      {k:"clienta", t:"Una clienta", n:1},
    ],
    lider: {total:2, cats:[{k:"empresa", t:"La empresa", n:1},{k:"idea", t:"Una idea de mejora", n:1}]},
  };
})();

/* ───────────────────────── estado de la maqueta ───────────────────────── */
const E = { v:"A", rol:"do", periodo:"6m", estado:"ok", sede:"TODAS", abierta:false, cargada:false, tab:"hoy", analisis:false, tablas:{}, etq:false };
const ROLES = {
  lider: {nombre:"Líder de equipo · AQP", sedes:["AQP"], plata:false, casos:true},
  do:    {nombre:"Desarrollo Organizacional", sedes:["CCO","LIM","AQP","TRU"], plata:true, casos:true},
  ceo:   {nombre:"Dirección / CEO", sedes:["CCO","LIM","AQP","TRU"], plata:true, casos:true},
};
const sedesVisibles = () => ROLES[E.rol].sedes;
function sedeEfectiva(){ return E.rol==="lider" ? "AQP" : E.sede; }

/* ───────────────────────── tooltip ───────────────────────── */
const tip = $("#tip");
document.addEventListener("pointerover", e => mostrarTip(e.target.closest("[data-tip]"), e));
document.addEventListener("focusin", e => mostrarTip(e.target.closest("[data-tip]"), e));
document.addEventListener("pointermove", e => { if (tip.classList.contains("on")) ubicarTip(e.clientX, e.clientY); });
document.addEventListener("pointerout", e => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest("[data-tip]")) tip.classList.remove("on"); });
document.addEventListener("focusout", () => tip.classList.remove("on"));
function mostrarTip(el, e){
  if (!el) return;
  tip.innerHTML = el.dataset.tip; tip.classList.add("on");
  if (e.clientX) ubicarTip(e.clientX, e.clientY);
  else { const r = el.getBoundingClientRect(); ubicarTip(r.left + r.width/2, r.top); }
}
function ubicarTip(x, y){
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let l = x + 14, t = y - h - 12;
  if (l + w > innerWidth - 8) l = x - w - 14;
  if (l < 8) l = 8;
  if (t < 8) t = y + 18;
  tip.style.left = l + "px"; tip.style.top = t + "px";
}

/* ───────────────────────── gráficos (SVG a mano) ───────────────────────── */
function nice(max){ const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max/p; return ([1,1.2,1.6,2,2.5,3,4,5,6,8,10].find(k=>m<=k))*p; }

/* 1 · Asistencia: línea. Eje truncado a propósito (dicho en el pie). */
function dibujaAsistencia(w){
  const sede = sedeEfectiva();
  const sem = E.periodo === "8s";
  const serie = (sem ? D.asisSem : D.asisMes)[sede];
  let etqs = sem ? SEM : MESES12;
  let ser = serie, et = etqs;
  if (E.periodo === "6m"){ ser = serie.slice(-6); et = etqs.slice(-6); }
  const n = ser.length, enCurso = n - 1;           // el último punto es el periodo en curso
  const H = 176, L = 36, Rr = 18, T = 14, B = 26;
  const cerrados = ser.slice(0, enCurso);
  const lo = Math.floor((Math.min(...cerrados) - 1.5)/2)*2, hi = 100;
  const x = i => L + (n===1?0:i*(w-L-Rr)/(n-1));
  const y = v => T + (hi - v)*(H-T-B)/(hi-lo);
  let s = `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="Asistencia sobre lo esperado, ${esc(nombreSede(sede))}">`;
  const ticks = []; for (let v=lo; v<=hi; v+=(hi-lo)>12?4:2) ticks.push(v);
  ticks.forEach(v => { s += `<line class="gx" x1="${L}" x2="${w-Rr+8}" y1="${y(v)}" y2="${y(v)}"/><text class="tk" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v} %</text>`; });
  const prom = cerrados.reduce((a,b)=>a+b,0)/cerrados.length;
  s += `<line class="prom" x1="${L}" x2="${w-Rr+8}" y1="${y(prom)}" y2="${y(prom)}"/>`;
  const pts = cerrados.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  s += `<polyline class="lin" points="${pts}"/>`;
  // etiquetas del eje x: no más de 6
  const paso = Math.ceil(n/6);
  et.forEach((e,i) => { if (i%paso===0 || i===enCurso) s += `<text class="tk" x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${e}${i===enCurso?"*":""}</text>`; });
  // mínimo y último cerrado, anotados con una palabra
  const iMin = cerrados.indexOf(Math.min(...cerrados));
  const ult = enCurso-1;
  if (iMin !== ult) s += `<circle class="pt" cx="${x(iMin)}" cy="${y(cerrados[iMin])}" r="4.5"/><text class="tk fuerte" x="${x(iMin)}" y="${y(cerrados[iMin])+17}" text-anchor="middle">${fmt(cerrados[iMin],1)} % · el más bajo</text>`;
  s += `<circle class="pt" cx="${x(ult)}" cy="${y(cerrados[ult])}" r="4.5"/><text class="tk fuerte g" x="${x(ult)}" y="${y(cerrados[ult])-10}" text-anchor="middle">${fmt(cerrados[ult],1)} %</text>`;
  // periodo en curso: círculo hueco, sin unir (no se midió completo)
  s += `<circle class="pt hueco" cx="${x(enCurso)}" cy="${y(Math.max(lo+1, Math.min(hi-1, ser[enCurso])))}" r="4.5"/>`;
  // zonas de hover
  const paso2 = (w-L-Rr)/Math.max(1,n-1);
  ser.forEach((v,i) => {
    const txt = i===enCurso ? `<b>${et[i]} · en curso</b><br><span class="t2">Aún no cuenta: faltan días por cerrar.</span>` : `<b>${sem?"Semana del ":""}${et[i]}</b><br>${fmt(v,1)} % de los días que les tocaba trabajar`;
    s += `<g class="col" tabindex="0" data-tip="${esc(txt)}" aria-label="${esc((sem?"Semana del ":"")+et[i]+": "+(i===enCurso?"en curso, no cuenta":fmt(v,1)+" por ciento"))}"><rect class="hit" x="${x(i)-paso2/2}" y="${T}" width="${paso2}" height="${H-T-B}"/><line class="cross" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}"/></g>`;
  });
  s += `</svg>`;
  return s;
}
function tablaAsistencia(){
  const sede = sedeEfectiva(), sem = E.periodo==="8s";
  let ser = (sem?D.asisSem:D.asisMes)[sede], et = sem?SEM:MESES12;
  if (E.periodo==="6m"){ ser = ser.slice(-6); et = et.slice(-6); }
  if (E.periodo==="12m"){ ser = ser.slice(2); et = et.slice(2); }
  return tablaHtml([sem?"Semana (lunes)":"Mes","Asistencia sobre lo esperado"], ser.map((v,i)=>[et[i]+(i===ser.length-1?" (en curso)":""), i===ser.length-1?"no cuenta aún":fmt(v,1)+" %"]));
}

/* 2 · Hora de llegada vs horario, por sede: punto (mediana) + rango central. Dos polos con palabra. */
function dibujaLlegada(w){
  const filas = D.llega.filter(d => sedesVisibles().includes(d.c));
  const sel = sedeEfectiva();
  const rowH = 46, T = 22, B = 34, Lc = w < 420 ? 74 : 112, Rc = w < 420 ? 84 : 104;
  const H = T + filas.length*rowH + B;
  const mx = 15, x = v => Lc + (v+mx)*(w-Lc-Rc)/(2*mx);
  let s = `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="Hora de llegada frente al horario, por sede">`;
  [-15,-10,-5,0,5,10,15].forEach(v => { s += `<line class="${v===0?"ejex":"gx"}" x1="${x(v)}" x2="${x(v)}" y1="${T-6}" y2="${H-B+4}"/><text class="tk${v===0?" fuerte":""}" x="${x(v)}" y="${H-B+18}" text-anchor="middle">${v>0?"+"+v:v}</text>`; });
  s += `<text class="tk" x="${x(-mx)}" y="${H-4}" text-anchor="start">${w<420?"← antes":"← antes de su hora"}</text><text class="tk" x="${x(mx)}" y="${H-4}" text-anchor="end">${w<420?"después →":"después de su hora →"}</text>`;
  s += `<text class="tk fuerte" x="${x(0)}" y="${T-10}" text-anchor="middle">hora de entrada</text>`;
  filas.forEach((d,i) => {
    const cy = T + i*rowH + rowH/2, dim = (sel!=="TODAS" && d.c!==sel) ? " atenuado" : "";
    const sd = SEDES.find(z=>z.c===d.c);
    const pol = d.med <= -1 ? "azul" : d.med >= 1 ? "ambar" : "ceniza";
    const palabra = d.med <= -1 ? `${-d.med} min antes` : d.med >= 1 ? `${d.med} min después` : "a la hora";
    const tt = `<b>${esc(sd.n)}</b><br>La mitad de las llegadas cayó entre <b>${d.p25>0?"+":""}${d.p25}</b> y <b>${d.p75>0?"+":""}${d.p75}</b> min.<br>Mediana: ${palabra}.<br><span class="t2">${d.n} llegadas medidas</span>`;
    s += `<g class="col${dim}" tabindex="0" data-tip="${esc(tt)}" aria-label="${esc(sd.n+": "+palabra+", la mitad de las llegadas entre "+d.p25+" y "+d.p75+" minutos")}">`;
    s += `<rect class="hit" x="0" y="${cy-rowH/2}" width="${w}" height="${rowH}"/>`;
    s += `<text class="tk fuerte g" x="0" y="${cy-1}">${sd.c}</text><text class="tk" x="0" y="${cy+13}">${esc(sd.n.replace("Tienda ","").replace("Taller ",""))}</text>`;
    s += `<rect class="rangoP" x="${x(d.p25)}" y="${cy-7}" width="${x(d.p75)-x(d.p25)}" height="14" rx="7"/>`;
    s += `<line stroke="var(--color-tinta)" stroke-opacity=".35" stroke-width="1.5" x1="${x(0)}" x2="${x(d.med)}" y1="${cy}" y2="${cy}"/>`;
    s += `<circle class="pol-${pol} anillo" cx="${x(d.med)}" cy="${cy}" r="7"/>`;
    s += `<text class="tk fuerte" x="${w-Rc+14}" y="${cy-1}">${palabra}</text><text class="tk" x="${w-Rc+14}" y="${cy+13}">${d.n} llegadas</text>`;
    s += `</g>`;
  });
  return s + `</svg>`;
}
function tablaLlegada(){
  return tablaHtml(["Sede","Mediana (min)","Rango central (min)","Llegadas"], D.llega.filter(d=>sedesVisibles().includes(d.c)).map(d=>[d.c, (d.med>0?"+":"")+d.med, `${d.p25} a ${d.p75>0?"+":""}${d.p75}`, d.n]));
}

/* 3 · Cuándo se llega tarde: cuadrícula de calor (tabla real), una sola tinta. Muestra mínima por celda. */
const MIN_MUESTRA = 20;
const DIAS = ["L","M","X","J","V","S","D"];
const PASOS = [5, 8, 12, 16];
function colorCalor(p){ const k = p<PASOS[0]?0 : p<PASOS[1]?1 : p<PASOS[2]?2 : p<PASOS[3]?3 : 4; return `color-mix(in oklab, var(--color-taupe) ${[7,16,28,40,54][k]}%, var(--color-papel))`; }
function dibujaCalor(){
  const sel = sedeEfectiva();
  let h = `<table class="calor"><caption class="sr">Porcentaje de llegadas 5 minutos o más después de su hora, por sede y día de la semana</caption><thead><tr><th class="fila-h"><span class="sr">Sede</span></th>${DIAS.map(d=>`<th scope="col">${d}</th>`).join("")}</tr></thead><tbody>`;
  SEDES.filter(s=>sedesVisibles().includes(s.c)).forEach(s => {
    h += `<tr class="${sel!=="TODAS" && sel!==s.c ? "apag":""}"><th scope="row" class="fila-h">${s.c}</th>`;
    D.calor[s.c].forEach((c,i) => {
      if (c === null) h += `<td class="na" data-tip="${esc(`<b>${esc(s.n)} · ${DIAS[i]}</b><br>No se trabaja este día.`)}" tabindex="0" aria-label="${s.c} ${DIAS[i]}: no se trabaja">–</td>`;
      else if (c[1] < MIN_MUESTRA) h += `<td class="poca" data-tip="${esc(`<b>${esc(s.n)} · ${DIAS[i]}</b><br>Solo ${c[1]} llegadas en el periodo: muy pocas para decir algo.`)}" tabindex="0" aria-label="${s.c} ${DIAS[i]}: muestra insuficiente">·</td>`;
      else h += `<td style="--bg:${colorCalor(c[0])}" data-tip="${esc(`<b>${esc(s.n)} · ${DIAS[i]}</b><br>${c[0]} % llegó 5 min o más tarde<br><span class='t2'>${c[1]} llegadas medidas</span>`)}" tabindex="0" aria-label="${s.c} ${DIAS[i]}: ${c[0]} por ciento llegó 5 minutos o más tarde">${c[0]} %</td>`;
    });
    h += `</tr>`;
  });
  return h + `</tbody></table>`;
}
function tablaCalor(){
  return tablaHtml(["Sede",...DIAS], SEDES.filter(s=>sedesVisibles().includes(s.c)).map(s => [s.c, ...D.calor[s.c].map(c => c===null ? "no se trabaja" : c[1]<MIN_MUESTRA ? "muestra corta" : c[0]+" %")]));
}

/* 4 · Sobretiempo: columnas. Una serie, un color; el pico lleva etiqueta. */
function dibujaSobretiempo(w){
  const sede = sedeEfectiva(), sem = E.periodo==="8s";
  let ser = (sem?D.stSem:D.stMes)[sede], et = sem?SEM:MESES12;
  if (E.periodo==="6m"){ ser = ser.slice(-6); et = et.slice(-6); }
  if (E.periodo==="12m"){ ser = ser.slice(2); et = et.slice(2); }
  const n = ser.length, enCurso = n-1, H = 170, L = 36, Rr = 8, T = 14, B = 26;
  const cerr = ser.slice(0,enCurso), top = nice(Math.max(...cerr)*1.15);
  const y = v => T + (top - v)*(H-T-B)/top, bw = (w-L-Rr)/n;
  let s = `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="Horas de sobretiempo ${sem?"por semana":"por mes"}, ${esc(nombreSede(sede))}">`;
  [0,top/2,top].forEach(v => { s += `<line class="gx" x1="${L}" x2="${w-Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="tk" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmt(v)} h</text>`; });
  const iMax = cerr.indexOf(Math.max(...cerr));
  const paso = Math.ceil(n/6);
  ser.forEach((v,i) => {
    const ww = Math.min(40, Math.max(4, bw*0.64)), bx = L + i*bw + (bw-ww)/2, cur = i===enCurso;
    const tt = cur ? `<b>${et[i]} · en curso</b><br><span class="t2">Aún no cuenta: el ciclo de 7 días no cerró.</span>` : `<b>${sem?"Semana del ":""}${et[i]}</b><br>${fmt(v,1)} h de sobretiempo`;
    s += `<g class="col" tabindex="0" data-tip="${esc(tt)}" aria-label="${esc(et[i]+": "+(cur?"en curso":fmt(v,1)+" horas"))}"><rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}"/>`;
    if (cur) s += `<rect x="${bx}" y="${y(Math.max(v,top*0.04))}" width="${ww}" height="${Math.max(2, H-B-y(Math.max(v,top*0.04)))}" rx="3" fill="none" stroke="var(--color-taupe)" stroke-width="1.5" stroke-dasharray="3 2"/>`;
    else s += `<rect class="barra${i===iMax?" pico":" sup"}" x="${bx}" y="${y(v)}" width="${ww}" height="${Math.max(0, H-B-y(v))}" rx="3"/>`;
    if (i===iMax) s += `<text class="tk fuerte" x="${bx+ww/2}" y="${y(v)-5}" text-anchor="middle">${fmt(v,0)} h</text>`;
    if (i%paso===0 || cur) s += `<text class="tk" x="${bx+ww/2}" y="${H-8}" text-anchor="middle">${et[i]}${cur?"*":""}</text>`;
    s += `</g>`;
  });
  return s + `<line class="ejex" x1="${L}" x2="${w-Rr}" y1="${H-B}" y2="${H-B}"/></svg>`;
}
function tablaSobretiempo(){
  const sede = sedeEfectiva(), sem = E.periodo==="8s"; let ser=(sem?D.stSem:D.stMes)[sede], et=sem?SEM:MESES12;
  if (E.periodo==="6m"){ ser=ser.slice(-6); et=et.slice(-6); }
  if (E.periodo==="12m"){ ser=ser.slice(2); et=et.slice(2); }
  return tablaHtml([sem?"Semana (lunes)":"Mes","Horas de sobretiempo"], ser.map((v,i)=>[et[i]+(i===ser.length-1?" (en curso)":""), i===ser.length-1?"no cuenta aún":fmt(v,1)+" h"]));
}

/* 5 · Costo de planilla por periodo (29→28): columnas, una tinta; el periodo en curso, rayado y sin cifra. Solo DO / dirección. */
function dibujaCosto(w){
  const datos = D.costo, n = datos.length, H = 190, L = 40, Rr = 8, T = 18, B = 26;
  const cerr = datos.filter(d=>d.t!=null), top = nice(Math.max(...cerr.map(d=>d.t))*1.1);
  const y = v => T + (top - v)*(H-T-B)/top, bw = (w-L-Rr)/n;
  let s = `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="Costo de planilla por periodo">`;
  s += `<defs><pattern id="rayas" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--color-taupe)" stroke-width="2"/></pattern></defs>`;
  [0,top/2,top].forEach(v => { s += `<line class="gx" x1="${L}" x2="${w-Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="tk" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmt(v/1000)} mil</text>`; });
  const maxT = Math.max(...cerr.map(d=>d.t));
  datos.forEach((d,i) => {
    const ww = Math.min(52, Math.max(6, bw*0.6)), bx = L + i*bw + (bw-ww)/2;
    if (d.enCurso){
      const hh = (H-T-B)*0.5, yy = H-B-hh;
      s += `<g class="col" tabindex="0" data-tip="${esc("<b>Periodo "+d.p+" · en curso</b><br>29 sep al 28 oct.<br><span class='t2'>Se cierra el 28. Hasta entonces el monto cambia cada día: no se dibuja.</span>")}" aria-label="Periodo en curso, no cuenta"><rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}"/><rect x="${bx}" y="${yy}" width="${ww}" height="${hh}" rx="3" fill="url(#rayas)" fill-opacity=".45" stroke="var(--color-taupe)" stroke-width="1.5"/><text class="tk" x="${bx+ww/2}" y="${yy-5}" text-anchor="middle">en curso</text></g>`;
      s += `<text class="tk" x="${bx+ww/2}" y="${H-8}" text-anchor="middle">${d.p}*</text>`;
    } else {
      const tt = `<b>Periodo ${d.p}</b>${d.retro?" · reconstruido":""} · S/ ${fmt(d.t)}<br>${d.retro?"<span class='t2'>Es el número del día en que se migró, no el de un pago real.</span><br>":""}Remuneraciones: S/ ${fmt(d.rem)}<br>Sobretiempo y feriados: S/ ${fmt(d.st)}<br>Bonos: S/ ${fmt(d.bo)}<br>Aportes de la empresa: S/ ${fmt(d.ap)}`;
      s += `<g class="col" tabindex="0" data-tip="${esc(tt)}" aria-label="${esc("Periodo "+d.p+": S/ "+fmt(d.t))}"><rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}"/><rect class="barra" x="${bx}" y="${y(d.t)}" width="${ww}" height="${H-B-y(d.t)}" rx="3"/>`;
      if (d.t===maxT || i===n-2) s += `<text class="tk fuerte" x="${bx+ww/2}" y="${y(d.t)-5}" text-anchor="middle">${fmt(d.t/1000,1)} mil</text>`;
      s += `<text class="tk" x="${bx+ww/2}" y="${H-8}" text-anchor="middle">${d.p}${d.retro?"†":""}</text></g>`;
    }
  });
  return s + `<line class="ejex" x1="${L}" x2="${w-Rr}" y1="${H-B}" y2="${H-B}"/></svg>`;
}
function tablaCosto(){
  return tablaHtml(["Periodo (29→28)","Remuneraciones","Sobretiempo y feriados","Bonos","Aportes","Total"], D.costo.map(d => d.enCurso ? [d.p+" (en curso)","–","–","–","–","no cuenta aún"] : [d.p+(d.retro?" (reconstruido)":""), fmt(d.rem), fmt(d.st), fmt(d.bo), fmt(d.ap), fmt(d.t)]));
}

/* 6 · Casos por «sobre qué»: barras horizontales en una sola tinta, con mínimo de 3. */
const MIN_CASOS = 3;
function dibujaCasos(){
  const lid = E.rol === "lider";
  const datos = lid ? D.casos.lider : D.casos;
  const vis = datos.cats.filter(c => c.n >= MIN_CASOS), ocultas = datos.cats.filter(c => c.n < MIN_CASOS);
  if (vis.length === 0) {
    return `<div class="vacio">${IC.candado}<b>No hay suficientes casos para mostrar un número</b><span>Se muestra una barra solo cuando hay ${MIN_CASOS} casos o más. Con menos, el número podría señalar a alguien. Quien gestiona un caso lo ve en <a href="#" onclick="return false" style="color:inherit">Casos</a>.</span></div>`;
  }
  const max = vis[0].n;
  let h = `<ul class="hb">` + vis.map(c => `<li data-tip="${esc("<b>"+c.t+"</b><br>"+c.n+" casos en 12 meses<br><span class='t2'>Cuenta casos, no personas.</span>")}" tabindex="0"><div class="l1"><span>${esc(c.t)}</span><b>${c.n}</b></div><span class="pista"><i style="width:${Math.round(c.n/max*100)}%"></i></span></li>`).join("") + `</ul>`;
  if (ocultas.length) h += `<div class="hb-min">${IC.candado}<span>${ocultas.length === 1 ? "Un motivo con" : ocultas.length+" motivos con"} menos de ${MIN_CASOS} casos no se muestra${ocultas.length===1?"":"n"}. Cuentan en el total, pero no se detallan.</span></div>`;
  return h;
}
function tablaCasos(){
  const datos = E.rol === "lider" ? D.casos.lider : D.casos;
  return tablaHtml(["Sobre qué","Casos (12 meses)"], datos.cats.map(c => [c.t, c.n >= MIN_CASOS ? c.n : `menos de ${MIN_CASOS}`]));
}

function nombreSede(c){ return c === "TODAS" ? "todas las sedes" : SEDES.find(s=>s.c===c).n; }
function tablaHtml(cols, filas){
  return `<div class="tabla-wrap"><table class="tabla"><thead><tr>${cols.map(c=>`<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>${filas.map(f=>`<tr>${f.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function tarjeta(g){

    cuerpo = `<div class="vacio">${IC.info}<b>Aún no hay historia suficiente</b><span>Hacen falta al menos 4 semanas cerradas para dibujar una tendencia. Mientras tanto, lo de hoy está arriba.</span></div>`;
  } else if (E.estado === "vacio" && id === "casos"){
    cuerpo = `<div class="vacio">${IC.candado}<b>No hay suficientes casos para mostrar un número</b><span>Se muestra una barra solo cuando hay ${MIN_CASOS} casos o más.</span></div>`;
  } else if (E.tablas[id]) {
    cuerpo = g.tabla();

    cuerpo = `<div class="area" data-g="${id}"></div>`;
  } else {
    cuerpo = `<div class="area" data-g="${id}">${g.dibujo()}</div>`;
  }
  const mostrarLect = !(["errorTodo"].includes(E.estado) || (E.estado==="error1"&&id==="casos") || E.estado==="vacio") && !E.tablas[id] && g.lectura();
  const sedeNota = (id==="casos") ? "" : "";
  return `<article class="graf" data-id="${id}" aria-labelledby="g-${id}">
    <div class="cab-g"><div><h3 class="pregunta" id="g-${id}">${esc(g.pregunta)}</h3></div>
      <div class="acc-g"><button class="ibtn" data-tabla="${id}" aria-pressed="${!!E.tablas[id]}" aria-label="${E.tablas[id]?"Ver el gráfico":"Ver como tabla"}" title="${E.tablas[id]?"Ver el gráfico":"Ver como tabla"}">${IC.tabla}</button></div></div>
    <p class="sub">${esc(g.sub())}</p>
    <div class="etq">${etqs}</div>
    ${cuerpo}
    ${g.leyenda && !E.tablas[id] && !E.estado.startsWith("error") && E.estado!=="vacio" ? `<div class="leyenda">${g.leyenda}</div>` : ""}
    ${mostrarLect ? `<p class="lectura">${g.lectura()}</p>` : ""}
    <p class="pie">${esc(g.pie)}</p>
    <details class="como"><summary>${IC.info} Cómo se calcula y qué no mide</summary><ul>${g.como.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>
  </article>`;
}

/* ───────────────────────── la banda «Tendencias» (contenido común a A, B y C) ───────────────────────── */
function filtrosTendencias(){
  const sedes = ROLES[E.rol].sedes;
  const chip = (c, t) => `<button class="filtro" data-sede="${c}" aria-pressed="${sedeEfectiva()===c}" ${E.rol==="lider"?"disabled":""}>${t}</button>`;
  return `<div class="filtros" role="group" aria-label="Sede">
      <span class="rot" style="margin-right:2px">Sede</span>
      ${E.rol==="lider" ? `<button class="filtro" aria-pressed="true" disabled>Arequipa</button>` : chip("TODAS","Todas") + SEDES.map(s=>chip(s.c,s.c)).join("")}
    </div>
    <div class="filtros" role="group" aria-label="Periodo">
      <span class="rot" style="margin-right:2px">Periodo</span>
      ${[["8s","8 semanas"],["6m","6 meses"],["12m","Desde enero"]].map(([k,t])=>`<button class="filtro" data-per="${k}" aria-pressed="${E.periodo===k}">${t}</button>`).join("")}
    </div>`;
}
function bandaContenido(){
  if (E.estado === "carga" || !E.cargada) return `<div class="cargando" role="status"><span class="gira"></span> Cargando la historia…</div>`;
  const vis = GRAFICOS.filter(puedeVer);
  const ocultosPorRol = GRAFICOS.length - vis.length;
  let h = `<div class="filtros" style="justify-content:space-between;gap:10px 18px;margin-bottom:12px">${filtrosTendencias()}</div>`;
  if (E.rol==="lider") h += `<div class="caja info" style="margin-bottom:12px"><span class="tit">${IC.info} Ves los gráficos de tu sede</span><span>Las comparaciones entre sedes y los montos de planilla las ve Desarrollo Organizacional.</span></div>`;
  h += `<div class="rejilla dos">` + vis.map(tarjeta).join("") + `</div>`;
  h += `<p class="pie" style="margin-top:10px">Dynamic avisa, no sanciona: estos gráficos son por sede y por franja, nunca por persona. Los datos de la historia se cargan una vez al abrir; lo de hoy sigue refrescándose cada 30 s.</p>`;
  return h;
}

/* ───────────────────────── trozos de la pantalla actual (solo contexto) ───────────────────────── */
function cabecera(titulo, desc, extra=""){
  return `<div class="cab"><div><div class="sobre">${desc.sobre||""}</div><h1>${titulo}</h1><div class="desc">${desc.html||""}</div></div>${extra}</div>`;
}
function resumenHoy(){
  const c = (et, n, tono) => `<div class="cifra"><span class="et">${tono?`<span class="dot ${tono}"></span>`:""}${et}</span><span class="nu">${n}</span></div>`;
  return `<div class="contexto"><div class="cifras">${c("Trabajando ahora",19,"ok")}${c("Sin marcar y ya les tocaba entrar",1,"aviso")}${c("Con tardanza hoy",2,"aviso")}${c("Sedes bajo la meta",1,"alerta")}</div></div>`;
}
function sedesHoy(){
  const f = (c, n, t, cob, ok) => `<div class="sede-sim"><span class="n">${c}<small>${n}</small></span><span class="muted" style="font-size:.8rem">${t}</span><span class="cob ${ok?"ok":"falta"}">${ok?"●":"▲"} ${cob}</span></div>`;
  return `<div class="tarj contexto" style="padding-top:10px;padding-bottom:6px"><div class="tt" style="margin-bottom:2px"><h3>Sedes</h3><span class="rot">en vivo · cada 30 s</span></div>${f("CCO","Central","5 de 6 marcaron","Cobertura completa",1)}${f("LIM","Taller Lima","8 de 9 marcaron","Cobertura completa",1)}${f("AQP","Tienda Arequipa","4 de 6 marcaron","Falta 1 en piso",0)}${f("TRU","Tienda Trujillo","6 de 7 marcaron","Cobertura completa",1)}</div>`;
}
function hoyContenido(){
  const sedes = E.rol === "lider" ? `<div class="tarj contexto" style="padding-top:10px;padding-bottom:6px"><div class="tt" style="margin-bottom:2px"><h3>Sede</h3><span class="rot">en vivo · cada 30 s</span></div><div class="sede-sim"><span class="n">AQP<small>Tienda Arequipa</small></span><span class="muted" style="font-size:.8rem">4 de 6 marcaron</span><span class="cob falta">▲ Falta 1 en piso</span></div></div>` : sedesHoy();
  return resumenHoy() + sedes;
}
const CAB_HOY = () => cabecera("Asistencia de hoy", {sobre:"Panel", html:`<span class="vivo" aria-hidden="true"></span><span>lunes 19 de octubre de 2026 · en vivo · 08:42</span>`}, `<div class="filtros"><button class="btn sec fino">⋯</button></div>`);

/* ───────────────────────── variantes ───────────────────────── */
function panelTendencias(){
  const abierta = E.abierta;
  const fr = E.cargada ? "historia · se carga una vez" : "historia · se carga al abrir";
  return `<section class="panel" aria-labelledby="pt-t">
    <div class="cabp"><button type="button" id="alt-banda" aria-expanded="${abierta}" aria-controls="pt-cuerpo"><span class="fl" aria-hidden="true">${abierta?"▾":"▸"}</span><h2 id="pt-t">Tendencias</h2></button><span class="fr">${fr}</span></div>
    ${abierta ? `<div id="pt-cuerpo">${bandaContenido()}</div>` : `<div class="plegada" id="pt-cuerpo">Asistencia, a qué hora llega cada sede, sobretiempo${ROLES[E.rol].plata?", costo de planilla":""}${ROLES[E.rol].casos?" y Casos":""}. Plegado: no se consulta nada hasta que lo abras.</div>`}
  </section>`;
}
function vistaA(){
  return CAB_HOY() + hoyContenido() + panelTendencias();
}
function vistaB(){
  const pest = `<div class="pest" role="tablist" aria-label="Vista del Dashboard"><button role="tab" id="tab-hoy" aria-selected="${E.tab==="hoy"}" data-tab="hoy">Hoy</button><button role="tab" id="tab-tend" aria-selected="${E.tab==="tend"}" data-tab="tend">Tendencias</button></div>`;
  const cuerpo = E.tab==="hoy" ? hoyContenido() : `<div role="tabpanel" aria-labelledby="tab-tend">${tendenciasPestana()}</div>`;
  return CAB_HOY() + pest + cuerpo;
}
function tendenciasPestana(){
  if (!E.cargada && E.estado!=="carga") { setTimeout(()=>cargar(), 0); }
  return `<div class="caja info" style="margin-bottom:12px"><span class="tit">${IC.info} «Hoy» deja de refrescarse mientras miras Tendencias</span><span>Al volver a «Hoy» se pide de nuevo. Así el reloj de 30 s no trabaja a espaldas de quien lee la historia.</span></div>` + bandaContenido();
}
function vistaC(){
  if (!E.analisis){
    return CAB_HOY() + hoyContenido() + `<div class="tarj contexto"><div class="enlace-an"><div><h3 style="font-size:1.12rem;font-weight:500;margin-bottom:3px">Tendencias y análisis</h3><p>Asistencia, a qué hora llega cada sede, sobretiempo${ROLES[E.rol].plata?", costo de planilla":""}${ROLES[E.rol].casos?" y Casos":""}. Vive en su propia pantalla; el Dashboard queda como está.</p></div><button class="btn" id="ir-an">Abrir análisis ${IC.flecha}</button></div></div>`;
  }
  if (!E.cargada && E.estado!=="carga") setTimeout(()=>cargar(), 0);
  return `<button class="atras" id="vuelve">${IC.atras} Asistencia de hoy</button>` + cabecera("Análisis", {sobre:"Panel", html:`<span>Cómo va el equipo en el tiempo · historia, no el día de hoy</span>`}) + bandaContenido();
}

/* ───────────────────────── render ───────────────────────── */
function cargar(){
  if (E.cargada) return;
  E.cargada = false; render();
  clearTimeout(cargar.t);
  cargar.t = setTimeout(() => { E.cargada = true; render(); }, 700);
}
function render(){
  const cont = $("#pantalla");
  const y = scrollY;
  cont.innerHTML = E.v==="A" ? vistaA() : E.v==="B" ? vistaB() : vistaC();
  $("#lienzo").classList.toggle("movil", $("#movil").checked);
  $("#pantalla").classList.toggle("con-etq", E.etq);
  cont.classList.toggle("con-etq", E.etq);
  // dibujar los SVG al ancho real de su contenedor
  $$(".area[data-g]", cont).forEach(a => {
    const g = GRAFICOS.find(x => x.id === a.dataset.g);
    if (g && g.svg) a.innerHTML = g.dibujo(Math.max(240, Math.floor(a.clientWidth)));
  });
  lema(); notas();
  scrollTo(0, y);
}
const ro = new ResizeObserver(() => { clearTimeout(ro.t); ro.t = setTimeout(() => { $$(".area[data-g]").forEach(a => { const g = GRAFICOS.find(x => x.id === a.dataset.g); if (g && g.svg && !E.tablas[g.id]) a.innerHTML = g.dibujo(Math.max(240, Math.floor(a.clientWidth))); }); }, 60); });
ro.observe($("#lienzo"));

function lema(){
  const t = {
    A: "<span class=\'muted\'>Lo de «hoy» (cifras y sedes) es solo contexto: así está el Dashboard actual.</span><br><strong>A · Banda plegable.</strong> «Tendencias» es otro panel del Dashboard, debajo de Sedes, plegado de entrada. Reutiliza <code>PanelColapsable</code> (se puede mover, plegar y ocultar como los otros). No consulta nada hasta que se abre.",
    B: "<strong>B · Pestañas «Hoy | Tendencias».</strong> El Dashboard se parte en dos. Hoy sigue igual; Tendencias es una vista aparte dentro de la misma pantalla.",
    C: "<strong>C · Pantalla «Análisis».</strong> El Dashboard queda intacto; solo suma una tarjeta con un enlace. Las tendencias viven en su propia ruta y menú.",
  }[E.v];
  $("#lema").innerHTML = t;
}

const NOTAS = {
  A: {
    gana:["Cero rutas, cero entradas de menú y cero componentes nuevos: usa <code>PanelColapsable</code> y <code>TarjetaInfo</code>, que ya existen.","Quien no lo abre no paga nada: ni consulta ni ruido visual. Hereda el «plegado» y el orden que cada persona ya personaliza.","Se ve en el mismo sitio donde se mira la asistencia: una pregunta sobre hoy lleva a la pregunta «¿y es normal?»."],
    paga:["Seis gráficos dentro de un panel que ya tiene tres más: el Dashboard se alarga. Con más de ~6 gráficos hay que pasar a C.","Los filtros de sede y periodo de la banda conviven con los filtros de «hoy» y se pueden confundir (por eso la banda lleva los suyos arriba y dicen «Sede» y «Periodo»).","La banda no se puede enlazar a un gráfico concreto."],
    rompe:["Alguien deja el panel abierto y la carga de la historia compite con el refresco de 30 s en una conexión lenta de tienda.","Se agregan gráficos hasta que la banda se vuelve otra pantalla sin serlo: la señal es el décimo gráfico."],
  },
  B: {
    gana:["Separa con claridad «lo que pasa ahora» de «cómo va»: son preguntas distintas con distinto reloj.","El refresco de 30 s puede pararse cuando se mira Tendencias.","Queda un solo ítem de menú."],
    paga:["Hace falta una pieza que el ADR 0004 todavía no decidió: las pestañas (4 subrayadas y 1 segmentado en el panel; <code>Filtro</code> no es el destino). Esta variante obliga a decidirla antes.","Cada persona abre el Dashboard para mirar hoy: la pestaña Tendencias casi nadie la va a abrir.","Los avisos de «Necesita atención» y los tiles de hoy quedan en otra pestaña, a un clic."],
    rompe:["La pestaña activa se recuerda entre visitas y alguien entra a las 8 a. m. y ve la historia en vez del día: justo el error que <code>resumenAbierto</code> ya evita al no guardarse.","Se decide «Pestañas» a las apuradas y se cuelan tres formas más de pestaña en el panel."],
  },
  C: {
    gana:["El Dashboard no se toca: cero riesgo para la pantalla que usan todos los días.","Hay lugar para crecer: 12 gráficos, filtros propios, un enlace por gráfico y, algún día, exportar.","Permite otro permiso de entrada (p. ej. ocultar «Análisis» a quien solo ve Hoy)."],
    paga:["Una ruta nueva, un ítem de menú y su ayuda: hay que mantener otra pantalla.","Nadie la abre si no se la recuerdan: la tarjeta de enlace tiene que ganarse su lugar.","Duplica los filtros de sede y periodo en una segunda pantalla."],
    rompe:["La pantalla «Análisis» se convierte en un Dashboard 2 con sus propios números de «hoy» que difieren de los del primero (el defecto de integridad conceptual de Brooks).","El menú ya tiene 24 entradas; la 25.ª pesa."],
  },
};
function notas(){
  const n = NOTAS[E.v];
  $("#notas").innerHTML = `
    <div class="decide"><div><b class="k">Decidí</b> Variante <b>A</b>: una banda «Tendencias» plegada, debajo de Sedes. Si pasa de ~6 gráficos o alguien pide filtros propios, se muda a <b>C</b> sin cambiar los gráficos.</div>
      <div><b class="k">Descarté</b> <b>B</b> porque obliga a decidir antes la pieza de pestañas (ADR 0004 la dejó abierta) y entierra la historia en una pestaña que casi nadie abre.</div>
      <div><b class="k">Se rompe si</b> la carga de la historia se hace en el mismo ciclo de 30 s del Dashboard: se pedirían ~3 000 filas cada 30 segundos, por cada Mac mini, todo el día.</div></div>
    <details class="nota"><summary>${IC.chevR} Notas de la variante ${E.v}: qué gana, qué paga, qué se rompe si</summary><div class="cuerpo">
      <div><h4>Qué gana</h4><ul>${n.gana.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div><h4>Qué paga</h4><ul>${n.paga.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div><h4>Se rompe si</h4><ul>${n.rompe.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></details>`;
}

/* ───────────────────────── eventos ───────────────────────── */
document.addEventListener("click", e => {
  const t = e.target;
  const v = t.closest("[data-v]");
  if (v){ E.v = v.dataset.v; $$("[data-v]").forEach(b => b.setAttribute("aria-pressed", b===v)); E.analisis = false; E.tab = "hoy"; if (E.v!=="A") E.abierta = false; render(); return; }
  if (t.closest("#alt-banda")){ E.abierta = !E.abierta; if (E.abierta && !E.cargada) cargar(); else render(); return; }
  const tab = t.closest("[data-tab]"); if (tab){ E.tab = tab.dataset.tab; render(); return; }
  if (t.closest("#ir-an")){ E.analisis = true; render(); return; }
  if (t.closest("#vuelve")){ E.analisis = false; render(); return; }
  const sd = t.closest("[data-sede]"); if (sd && !sd.disabled){ E.sede = sd.dataset.sede; render(); return; }
  const pr = t.closest("[data-per]"); if (pr){ E.periodo = pr.dataset.per; $("#periodo").value = E.periodo; render(); return; }
  const tb = t.closest("[data-tabla]"); if (tb){ E.tablas[tb.dataset.tabla] = !E.tablas[tb.dataset.tabla]; render(); return; }
  if (t.closest("[data-reint]")){ E.estado = "ok"; $("#estado").value = "ok"; E.cargada = false; cargar(); return; }
});
$("#rol").addEventListener("change", e => { E.rol = e.target.value; if (E.rol==="lider") E.sede="AQP"; else if (E.sede==="AQP") E.sede="TODAS"; render(); });
$("#periodo").addEventListener("change", e => { E.periodo = e.target.value; render(); });
$("#estado").addEventListener("change", e => { E.estado = e.target.value; if (E.estado==="carga") E.cargada=false; else if (!E.cargada && E.abierta) { E.cargada = true; } render(); });
$("#tema").addEventListener("change", e => { const v = e.target.value; if (v==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); });
$("#movil").addEventListener("change", render);
$("#etq").addEventListener("change", e => { E.etq = e.target.checked; render(); });

/* arranque */
(function(){
  const p = new URLSearchParams(location.search);
  if (p.get("v")) { E.v = p.get("v"); $$("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v===E.v)); }
  if (p.get("rol")) { E.rol = p.get("rol"); $("#rol").value = E.rol; if (E.rol==="lider") E.sede="AQP"; }
  if (p.get("periodo")) { E.periodo = p.get("periodo"); $("#periodo").value = E.periodo; }
  if (p.get("estado")) { E.estado = p.get("estado"); $("#estado").value = E.estado; }
  if (p.get("abierta")==="1") { E.abierta = true; E.cargada = true; }
  if (p.get("tab")) { E.tab = p.get("tab"); E.cargada = true; }
  if (p.get("analisis")==="1") { E.analisis = true; E.cargada = true; }
  if (p.get("tema")) { $("#tema").value = p.get("tema"); document.documentElement.setAttribute("data-theme", p.get("tema")); }
  if (p.get("movil")==="1") $("#movil").checked = true;
  if (p.get("etq")==="1") { E.etq = true; $("#etq").checked = true; }
  if (p.get("estado")==="carga") E.cargada = false;
  render();
})();
</script>
</body>
</html>
